/**

 * prototypes, over the synthetic corpus. Not part of the app.

 * "両方実行" has no function of its own: PdfTools.tsx composes it inline as

 * same production functions and the UI's default settings.
 */
import {

import { normalizePageSize } from '/src/utils/page-size-normalizer.ts';
import { updateTitleBlocks } from '/src/utils/title-block-updater.ts';
import { assessSource } from '/src/utils/annotator-save/source-assessment.ts';
import { PDFDocument } from 'pdf-lib';
import { inspect, portable, visualDiff } from '/research/m5-processor-reliability/prototype/inspect.mjs';
import { monochromeStructural } from '/research/m5-processor-reliability/prototype/mono-structure.mjs';
import { marginInPlace } from '/research/m5-processor-reliability/prototype/margin-inplace.mjs';
import {

const FIXTURES = '/test-fixtures/m5-processor';
const cache = new Map();
async function bytesOf(name) {
  if (!cache.has(name)) {
    if (name.startsWith('@opt:')) {
      // A document of DCT images, made by production Optimize itself: the
      // realistic JPEG input for the monochrome candidates.
      const base = name.slice(5);
      cache.set(name, await processOptimize(fileOf(base, await bytesOf(base)), { dpi: 150 }));
    } else {
      const r = await fetch(`${FIXTURES}/${name}.pdf`);
      cache.set(name, new Uint8Array(await r.arrayBuffer()));
    }
  }
  return cache.get(name).slice();
}
const fileOf = (name, bytes) => new File([bytes], `${name}.pdf`, { type: 'application/pdf' });

/** The UI's defaults (PdfTools.tsx:36-42). */
const DEFAULTS = {
  layer: { color: '#ffffff', opacity: 0.5 },
  mono: { dpi: 300, contrast: 1.0 },
  optimize: { dpi: 150 },
  margin: { scale: 0.8, position: 'center' },
};

const OPS = {
  layer: (name, bytes) => processLayer(fileOf(name, bytes), DEFAULTS.layer),
  monochrome: (name, bytes, dpi) => processMonochrome(fileOf(name, bytes), { ...DEFAULTS.mono, dpi: dpi ?? DEFAULTS.mono.dpi }),
  both: async (name, bytes, dpi) => processLayer(
    await processMonochrome(fileOf(name, bytes), { ...DEFAULTS.mono, dpi: dpi ?? DEFAULTS.mono.dpi }),
    DEFAULTS.layer,
  ),
  margin: (name, bytes) => processMargin(fileOf(name, bytes), DEFAULTS.margin),
  optimize: (name, bytes, dpi) => processOptimize(fileOf(name, bytes), { dpi: dpi ?? DEFAULTS.optimize.dpi }),
};

const MARKER = /[A-Z0-9]+(?:-[A-Z0-9]+)*-M5(?:-\d+)?/g;
const markersIn = (texts) => [...new Set(texts.join(' ').match(MARKER) ?? [])].filter((m) => m !== 'OCR-LAYER-M5');
const sum = (arr, f) => arr.reduce((n, x) => n + f(x), 0);

/**
 * Whether each property survived, decided from structure. Visual numbers are
 * reported next to them and decide nothing.
 */
function preservation(src, out) {
  if (out.loadError) return { loadError: out.loadError };
  const srcText = src.text.join(' ');
  const outText = out.text.join(' ');
  const markers = markersIn(src.text);
  const srcPaths = sum(src.pages, (p) => p.content.pathOps);
  const outPaths = sum(out.pages, (p) => p.content.pathOps);
  const srcImages = src.pages.flatMap((p) => p.images);
  const outImages = out.pages.flatMap((p) => p.images);
  const kinds = (r) => r.pages.flatMap((p) => p.annots.map((a) => a.subtype)).filter((s) => s !== 'Widget' && s !== 'Link').sort();
  const links = (r) => r.pages.flatMap((p) => p.annots.filter((a) => a.subtype === 'Link').map((a) => a.uri));
  const widgets = (r) => r.pages.flatMap((p) => p.annots.filter((a) => a.subtype === 'Widget'));
  const field = (r, name) => r.fields.find((f) => f.name === name) ?? null;
  const fullPageRaster = out.pages.every((p) => p.content.pathOps === 0 && p.content.textShows === 0
    && p.content.imageDraws === 1 && p.images.length === 1);
  const vis = src.thumbs.map((t, i) => visualDiff(t, out.thumbs[i]));

  const verdict = (had, has) => (!had ? 'n/a' : (has ? 'retained' : 'lost'));
  const srcSig = src.signatures[0] ?? null;
  const outSig = out.signatures[0] ?? null;
  return {
    pageCount: { before: src.pages.length, after: out.pages.length },
    pageOrder: (() => {
      const order = (r) => r.text.map((t) => (t.match(/PAGE-ORDER-M5-(\d)/) ?? [])[1] ?? null);
      const b = order(src);
      if (b.every((x) => x === null)) return 'n/a';
      const a = order(out);
      if (a.join(',') === b.join(',')) return 'preserved (by extracted text)';
      if (a.some((x) => x !== null)) return `changed ${a.join(',')}`;
      // The text is gone, so ask the pixels: which source page does each
      // output page look like? Only as evidence of order, never of content.
      const matched = out.thumbs.map((t) => {
        let best = null;
        src.thumbs.forEach((s, j) => {
          const d = visualDiff(s, t);
          if (d && (best === null || d.meanAbs < best.d)) best = { j, d: d.meanAbs };
        });
        return best ? best.j + 1 : null;
      });
      return matched.every((j, i) => j === i + 1)
        ? 'preserved (by rendered appearance; the text is gone)' : `changed ${matched.join(',')}`;
    })(),
    boxes: src.pages.map((p, i) => ({
      mediaBefore: p.mediaBox, mediaAfter: out.pages[i]?.mediaBox ?? null,
      cropBefore: p.cropBox, cropAfter: out.pages[i]?.cropBox ?? null,
      rotateBefore: p.rotate, rotateAfter: out.pages[i]?.rotate ?? null,
    })),
    nativeText: markers.length === 0 ? 'n/a'
      : (markers.every((m) => outText.includes(m)) ? 'extractable' : `lost ${markers.filter((m) => !outText.includes(m)).join(' ')}`),
    ocrText: srcText.includes('OCR-LAYER-M5') ? (outText.includes('OCR-LAYER-M5') ? 'extractable' : 'lost') : 'n/a',
    vectors: srcPaths === 0 ? 'n/a' : (outPaths >= srcPaths ? 'retained'
      : (outPaths === 0 ? 'lost' : `lost (${outPaths} of ${srcPaths} path operators remain)`)),
    vectorOps: { before: srcPaths, after: outPaths },
    raster: srcImages.length === 0 ? 'n/a'
      : (srcImages.every((s) => outImages.some((o) => o.digest === s.digest)) ? 'retained (same bytes)'
        : (outImages.length > 0 ? 're-encoded' : 'lost')),
    fullPageRaster,
    outImages: outImages.map((i) => ({ filter: i.filter, width: i.width, height: i.height, colorSpace: i.colorSpace })),
    annotations: (() => {
      const b = kinds(src); const a = kinds(out);
      return b.length === 0 ? 'n/a' : (b.join(',') === a.join(',') ? 'retained' : `lost (${b.join(',')} -> ${a.join(',') || 'none'})`);
    })(),
    links: links(src).length === 0 ? 'n/a' : (links(src).every((u) => links(out).includes(u)) ? 'retained' : 'lost'),
    form: !field(src, 'm5.text') ? 'n/a'
      : (field(out, 'm5.text')?.value === field(src, 'm5.text').value && widgets(out).length === widgets(src).length
        ? 'retained with value' : (field(out, 'm5.text') ? `field present, value ${field(out, 'm5.text').value}` : 'lost')),
    acroFormBefore: src.acroForm, acroFormAfter: out.acroForm,
    signature: !srcSig ? 'n/a' : (!outSig ? 'removed' : (outSig.state === 'intact' ? 'intact' : `invalidated (${outSig.state})`)),
    xfa: !src.xfa ? 'n/a' : (out.xfa ? 'retained' : 'removed'),
    metadata: {
      title: src.info.title === out.info.title ? 'retained' : `changed ${JSON.stringify(out.info.title)}`,
      author: !src.info.author ? 'n/a' : (src.info.author === out.info.author ? 'retained' : 'lost'),
      producer: src.info.producer === out.info.producer ? 'retained' : `changed ${JSON.stringify(out.info.producer)}`,
      modDate: src.info.modDate === out.info.modDate ? 'retained' : 'changed',
      xmp: !src.xmpMarker ? 'n/a' : (out.xmpMarker ? 'retained' : 'lost'),
    },
    visual: {
      meanAbs: vis[0]?.meanAbs ?? null, differingFraction: vis[0]?.differingFraction ?? null,
      chromaBefore: src.thumbs[0]?.chromaFraction ?? null, chromaAfter: out.thumbs[0]?.chromaFraction ?? null,
      sizeBefore: src.thumbs[0] ? [src.thumbs[0].width, src.thumbs[0].height] : null,
      sizeAfter: out.thumbs[0] ? [out.thumbs[0].width, out.thumbs[0].height] : null,
    },
    size: { before: src.bytes, after: out.bytes, ratio: out.bytes / src.bytes },
  };
}

const srcReports = new Map();
async function sourceReport(name) {
  if (!srcReports.has(name)) srcReports.set(name, await inspect(await bytesOf(name)));
  return srcReports.get(name);
}

/**
 * How much of the page a translucent white overlay actually reached: of the
 * source's ink, the share the overlay lightened. White on white shows nothing,
 * so paper is not counted.
 */
function overlayCoverage(before, after) {
  if (!before || !after || before.width !== after.width || before.height !== after.height) return null;
  let ink = 0; let lightened = 0;
  for (let i = 0; i < before.data.length; i += 4) {
    const l0 = 0.299 * before.data[i] + 0.587 * before.data[i + 1] + 0.114 * before.data[i + 2];
    if (l0 > 150) continue;
    ink += 1;
    const l1 = 0.299 * after.data[i] + 0.587 * after.data[i + 1] + 0.114 * after.data[i + 2];
    if (l1 > l0 + 30) lightened += 1;
  }
  return ink === 0 ? null : lightened / ink;
}

/** Magenta: the colour of the content `mediabox-larger` hides outside its CropBox. */
function magentaFraction(thumb) {
  let n = 0;
  for (let i = 0; i < thumb.data.length; i += 4) {
    if (thumb.data[i] > 180 && thumb.data[i + 1] < 90 && thumb.data[i + 2] > 180) n += 1;
  }
  return n / (thumb.data.length / 4);
}

window.__m5 = {
  defaults: () => DEFAULTS,

  /** The fixtures describe what they claim to: the controls for every later check. */
  async corpus(names) {
    const out = {};
    for (const name of names) out[name] = portable(await sourceReport(name));
    return out;
  },

  /** Every target operation over the corpus, measured before and after. */
  async baseline(plan) {
    const rows = [];
    for (const { op, fixture, dpi } of plan) {
      const src = await sourceReport(fixture);
      const started = performance.now();
      let out = null; let error = null;
      try { out = await OPS[op](fixture, await bytesOf(fixture), dpi); } catch (e) { error = String(e?.message ?? e); }
      const ms = performance.now() - started;
      if (!out) { rows.push({ op, fixture, dpi: dpi ?? null, error, outputBytes: 0, ms }); continue; }
      const outReport = await inspect(out);
      const row = { op, fixture, dpi: dpi ?? null, ms, ...preservation(src, outReport) };
      if (op === 'layer') row.overlayCoverage = overlayCoverage(src.thumbs[0], outReport.thumbs[0]);
      if (fixture === 'mediabox-larger') {
        row.hiddenContentRevealed = magentaFraction(outReport.thumbs[0]) > 0.001;
        row.hiddenMagentaBefore = magentaFraction(src.thumbs[0]);
        row.hiddenMagentaAfter = magentaFraction(outReport.thumbs[0]);
      }
      rows.push(row);
    }
    return rows;
  },

  /** The hardened lanes, handed the documents they do not inspect for. */
  async hardened() {
    const rows = [];
    const rule = [{ rect: { x: 0.62, y: 0.88, width: 0.3, height: 0.04 }, text: 'REV-M5' }];
    for (const fixture of ['signature-a4', 'xfa-a4', 'metadata-a4', 'form-a4']) {
      const src = await sourceReport(fixture);
      for (const [lane, run] of [
        ['normalize-size', async () => (await normalizePageSize(await bytesOf(fixture), { target: 'A3' })).data],
        ['title-block-update', async () => (await updateTitleBlocks(await bytesOf(fixture), { rules: rule, templateOrientation: 'portrait' })).data],
      ]) {
        let out = null; let error = null;
        try { out = await run(); } catch (e) { error = String(e?.message ?? e); }
        if (!out) { rows.push({ lane, fixture, error }); continue; }
        const r = preservation(src, await inspect(out, { render: false }));
        rows.push({ lane, fixture, signature: r.signature, xfa: r.xfa, form: r.form, metadata: r.metadata, nativeText: r.nativeText });
      }
    }
    return rows;
  },

  /**
   * The signature proxy, fed a change it must notice: one byte inside the
   * signed range, not in /Contents. Without this, "intact" could be a checker
   * that says intact to everything.
   */
  async signatureProbe() {
    const original = await bytesOf('signature-a4');
    const tampered = original.slice();
    // One letter of the signer's /Name: covered by /ByteRange, outside
    // /Contents, and harmless to the file's structure.
    const at = new TextDecoder('latin1').decode(original).indexOf('M5 synthetic signer') + 3;
    if (at < 3) throw new Error('signer name not found in the fixture');
    tampered[at] = 0x53; // 's' -> 'S'
    return {
      original: (await inspect(original, { render: false })).signatures,
      tampered: (await inspect(tampered, { render: false })).signatures,
    };
  },

  /** What the existing M3 inspection says about each document, unchanged. */
  async assess(names) {
    const out = {};
    for (const name of names) {
      const v = await assessSource(await bytesOf(name));
      out[name] = { supported: v.supported, codes: v.problems.map((p) => p.code), signatureFields: v.signatureFields };
    }
    // And that looking did not modify: a document without an AcroForm still has none.
    const plain = await bytesOf('text-a4');
    await assessSource(plain);
    out.__inspectionIsReadOnly = !(await inspect(plain, { render: false })).acroForm;
    return out;
  },

  /** Monochrome candidates B and C against the same corpus. */
  async monoCandidates(names) {
    const out = {};
    for (const name of names) {
      const src = await sourceReport(name);
      out[name] = {};
      for (const [label, images] of [['B', 'refuse'], ['C', 'grayscale']]) {
        const started = performance.now();
        let r;
        try { r = await monochromeStructural(await bytesOf(name), { images, contrast: 1 }); } catch (e) {
          out[name][label] = { status: 'ERROR', error: String(e?.message ?? e) }; continue;
        }
        const entry = { status: r.status, refusals: r.refusals.slice(0, 4), stats: r.stats, ms: performance.now() - started };
        if (r.bytes) {
          const rep = await inspect(r.bytes);
          const p = preservation(src, rep);
          Object.assign(entry, {
            nativeText: p.nativeText, ocrText: p.ocrText, vectors: p.vectors, raster: p.raster, annotations: p.annotations,
            links: p.links, form: p.form, xfa: p.xfa, signature: p.signature, metadata: p.metadata,
            boxes: p.boxes[0], chromaAfter: p.visual.chromaAfter, chromaBefore: p.visual.chromaBefore,
            outImages: p.outImages, size: p.size,
          });
        }
        out[name][label] = entry;
      }
      // Candidate A, for the same row: production at the UI default.
      const a = await inspect(await OPS.monochrome(name, await bytesOf(name)));
      const pa = preservation(src, a);
      out[name].A = { status: 'CONVERTED', nativeText: pa.nativeText, ocrText: pa.ocrText, vectors: pa.vectors, raster: pa.raster,
        annotations: pa.annotations, links: pa.links, form: pa.form, xfa: pa.xfa, signature: pa.signature, metadata: pa.metadata,
        boxes: pa.boxes[0], chromaAfter: pa.visual.chromaAfter, chromaBefore: pa.visual.chromaBefore, size: pa.size };
    }
    return out;
  },

  /**
   * Margin: production (embedPage) against the in-place candidate.
   *
   * For the visual, the expected picture is computed independently: the
   * source's own rendering, shrunk by the scale into the chosen corner of the
   * *visible* page. Each candidate is measured against that.
   */
  async marginCandidates(names, positions = ['center', 'tl']) {
    const out = {};
    for (const name of names) {
      const src = await sourceReport(name);
      out[name] = {};
      for (const position of positions) {
        const options = { scale: 0.8, position };
        const expected = (() => {
          const t = src.thumbs[0];
          const canvas = document.createElement('canvas');
          canvas.width = t.width; canvas.height = t.height;
          const ctx = canvas.getContext('2d', { willReadFrequently: true });
          ctx.fillStyle = 'white'; ctx.fillRect(0, 0, t.width, t.height);
          const from = document.createElement('canvas');
          from.width = t.width; from.height = t.height;
          from.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(t.data), t.width, t.height), 0, 0);
          const w = t.width * options.scale; const h = t.height * options.scale;
          const x = position === 'center' ? (t.width - w) / 2 : (position.endsWith('l') ? 0 : t.width - w);
          const y = position === 'center' ? (t.height - h) / 2 : (position.startsWith('t') ? 0 : t.height - h);
          ctx.drawImage(from, x, y, w, h);
          return { width: t.width, height: t.height, data: ctx.getImageData(0, 0, t.width, t.height).data };
        })();
        for (const [label, run] of [
          ['production', async () => ({ status: 'TRANSFORMED', bytes: await processMargin(fileOf(name, await bytesOf(name)), options) })],
          ['inplace', async () => marginInPlace(await bytesOf(name), options)],
        ]) {
          let r;
          try { r = await run(); } catch (e) { out[name][`${label}:${position}`] = { status: 'ERROR', error: String(e?.message ?? e) }; continue; }
          if (!r.bytes) { out[name][`${label}:${position}`] = { status: r.status, refusals: r.refusals }; continue; }
          const rep = await inspect(r.bytes);
          const p = preservation(src, rep);
          const againstExpected = visualDiff(expected, rep.thumbs[0]);
          out[name][`${label}:${position}`] = {
            status: r.status, nativeText: p.nativeText, ocrText: p.ocrText, vectors: p.vectors, raster: p.raster,
            annotations: p.annotations, links: p.links, form: p.form, xfa: p.xfa, signature: p.signature,
            metadata: p.metadata, boxes: p.boxes[0], pageCount: p.pageCount,
            outputThumb: p.visual.sizeAfter, sourceThumb: p.visual.sizeBefore,
            againstExpected: againstExpected ? { meanAbs: againstExpected.meanAbs, differing: againstExpected.differingFraction } : 'different page shape',
            hiddenMagenta: name === 'mediabox-larger' ? magentaFraction(rep.thumbs[0]) : null,
            annotRects: rep.pages[0].annots.map((a) => ({ subtype: a.subtype, rect: a.rect })),
            size: p.size,
          };
        }
      }
    }
    return out;
  },

  /** Optimize: what it does to size, at each resolution the UI offers, and a lossless re-save. */
  async optimizeSizes(names) {
    const out = {};
    for (const name of names) {
      const src = await bytesOf(name);
      const row = { source: src.length };
      // Every marker, the OCR layer's included: a document with none to lose
      // is n/a, not "kept".
      const wanted = [...new Set((await sourceReport(name)).text.join(' ').match(MARKER) ?? [])];
      for (const dpi of [72, 150, 300]) {
        const o = await OPS.optimize(name, src.slice(), dpi);
        const rep = await inspect(o, { render: false });
        row[`O1@${dpi}`] = {
          bytes: o.length, ratio: o.length / src.length,
          text: wanted.length === 0 ? 'n/a' : (wanted.every((m) => rep.text.join(' ').includes(m)) ? 'kept' : 'lost'),
          vectorOps: sum(rep.pages, (p) => p.content.pathOps),
        };
      }
      const doc = await PDFDocument.load(src.slice(), { updateMetadata: false });
      const lossless = await doc.save({ useObjectStreams: true });
      row.O2lossless = { bytes: lossless.length, ratio: lossless.length / src.length };
      const o3 = await optimizeStructural(src.slice(), { dpi: 150 });
      const o3r = await inspect(o3.bytes);
      const p3 = preservation(await sourceReport(name), o3r);
      row.O3at150 = {
        bytes: o3.bytes.length, ratio: o3.bytes.length / src.length, reencoded: o3.report.reencoded, kept: o3.report.kept,
        text: wanted.length === 0 ? 'n/a' : (wanted.every((m) => o3r.text.join(' ').includes(m)) ? 'kept' : 'lost'),
        vectors: p3.vectors, annotations: p3.annotations, form: p3.form, meanAbs: p3.visual.meanAbs,
      };
      out[name] = row;
    }
    return out;
  },

  /** What failing looks like: an unreadable file, and a failure part-way through a document. */
  async failures() {
    const out = { invalid: {}, midDocument: {} };
    for (const op of Object.keys(OPS)) {
      try { const b = await OPS[op]('invalid', await bytesOf('invalid')); out.invalid[op] = { bytes: b.length }; } catch (e) {
        out.invalid[op] = { threw: String(e?.message ?? e).slice(0, 120), bytes: 0 };
      }
    }
    // The second page's canvas comes back without a context.
    for (const op of ['monochrome', 'optimize', 'both']) {
      const original = HTMLCanvasElement.prototype.getContext;
      let large = 0;
      HTMLCanvasElement.prototype.getContext = function patched(...args) {
        if (this.width > 1000 && this.height > 1000) { large += 1; if (large === 2) return null; }
        return original.apply(this, args);
      };
      try {
        const b = await OPS[op]('three-pages', await bytesOf('three-pages'));
        out.midDocument[op] = { bytes: b.length, pages: (await inspect(b, { render: false })).pages.length };
      } catch (e) {
        out.midDocument[op] = { threw: String(e?.message ?? e).slice(0, 120), bytes: 0 };
      } finally {
        HTMLCanvasElement.prototype.getContext = original;
      }
    }
    return out;
  },

  /**
   * Full-page raster cost. Measured where it is safe to measure, calculated
   * everywhere; the browser's canvas limit is probed without drawing a page.
   */
  async memory(measure) {
    const sheets = { A4: [595.28, 841.89], A3: [841.89, 1190.55], A1: [1683.78, 2383.94], A0: [2383.94, 3370.39] };
    const probe = (w, h) => {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d', { willReadFrequently: true });
      let usable = false;
      try {
        ctx.fillStyle = 'rgb(1,2,3)'; ctx.fillRect(w - 1, h - 1, 1, 1);
        const d = ctx.getImageData(w - 1, h - 1, 1, 1).data;
        usable = d[0] === 1 && d[1] === 2 && d[2] === 3 && d[3] === 255;
      } catch { usable = false; }
      const dataUrl = usable ? null : c.toDataURL('image/jpeg', 0.8);
      c.width = 1; c.height = 1;
      return { usable, emptyDataUrl: dataUrl === 'data:,' };
    };
    const rows = [];
    for (const [sheet, [wPt, hPt]] of Object.entries(sheets)) {
      for (const dpi of [72, 150, 300, 600]) {
        const s = dpi / 72;
        const w = Math.floor(wPt * s); const h = Math.floor(hPt * s);
        rows.push({ sheet, dpi, width: w, height: h, megapixels: (w * h) / 1e6, rgba: w * h * 4 });
      }
    }
    const measured = [];
    for (const { op, fixture, dpi } of measure) {
      const src = await bytesOf(fixture);
      const t0 = performance.now();
      let out = null; let error = null;
      try { out = await OPS[op](fixture, src, dpi); } catch (e) { error = String(e?.message ?? e); }
      const rep = out ? await inspect(out, { render: false }) : null;
      const img = rep?.pages[0]?.images[0] ?? null;
      measured.push({
        op, fixture, dpi, ms: performance.now() - t0, error,
        outputBytes: out?.length ?? 0,
        image: img ? { width: img.width, height: img.height, filter: img.filter, encodedBytes: img.encodedBytes } : null,
      });
    }
    // The canvas limit, probed at the sizes the UI can ask for and nothing drawn.
    const limits = [];
    for (const [sheet, dpi] of [['A1', 300], ['A0', 300], ['A1', 600], ['A0', 600]]) {
      const [wPt, hPt] = sheets[sheet];
      const w = Math.floor(wPt * dpi / 72); const h = Math.floor(hPt * dpi / 72);
      limits.push({ sheet, dpi, width: w, height: h, megapixels: (w * h) / 1e6, ...probe(w, h) });
    }
    return { rows, measured, limits };
  },

  /** The 600 dpi case the canvas cannot hold: what production does with it. */
  async overLimit() {
    const out = {};
    for (const op of ['monochrome', 'both']) {
      try {
        const b = await OPS[op]('vector-a1', await bytesOf('vector-a1'), 600);
        const rep = await inspect(b);
        out[op] = { bytes: b.length, inkFraction: rep.thumbs[0].inkFraction, image: rep.pages[0].images[0] ?? null };
      } catch (e) {
        out[op] = { threw: String(e?.message ?? e).slice(0, 160), bytes: 0 };
      }
    }
    return out;
  },

  /**
   * RF-K1: facts, read without a verdict and without getForm(); then each H7
   * candidate policy applied to them, operation by operation.
   */
  async sourceFacts() {
    const names = ['text-a4', 'form-a4', 'signature-a4', 'xfa-a4', 'annotation-a4', 'metadata-a4', 'invalid', 'raster-a4'];
    const original = PDFDocument.prototype.getForm;
    let calls = 0;
    // Reaching getForm() while reading facts is the defect, so make it loud.
    PDFDocument.prototype.getForm = function trapped() { calls += 1; throw new Error('getForm() reached'); };
    const facts = {};
    try {
      for (const n of names) facts[n] = await readSourceFacts(await bytesOf(n));
    } finally {
      PDFDocument.prototype.getForm = original;
    }
    // The control: M3's assessSource does reach it on an ordinary form, so
    // the trap is live and a zero above means something.
    let controlCalls = 0;
    PDFDocument.prototype.getForm = function counted(...args) { controlCalls += 1; return original.apply(this, args); };
    try { await assessSource(await bytesOf('form-a4')); } finally { PDFDocument.prototype.getForm = original; }
    const m3 = {};
    for (const n of names) {
      const v = await assessSource(await bytesOf(n));
      m3[n] = { supported: v.supported, codes: v.problems.map((p) => p.code), docReturned: v.doc !== null };
    }
    const matrix = {};
    for (const [policyName, policy] of Object.entries(H7_POLICIES)) {
      matrix[policyName] = {};
      for (const n of ['signature-a4', 'xfa-a4', 'form-a4', 'text-a4', 'invalid']) {
        matrix[policyName][n] = Object.fromEntries(Object.keys(OPERATION_EFFECTS)
          .map((op) => [op, planOperation(facts[n], op, policy).status]));
      }
    }
    return { facts, getFormCallsWhileReading: calls, getFormCallsByAssessSource: controlCalls, m3, matrix, effects: OPERATION_EFFECTS };
  },

  /** RF-K2: B1/B2/B3 as defined, around the unchanged production processLayer/processMonochrome. */
  async batchPolicies() {
    const policy = H7_POLICIES['refuse-if-dropped'];
    const plan = async (bytes) => {
      const p = planOperation(await readSourceFacts(bytes), 'layer', policy);
      return { status: p.status, reason: p.reasons.join(', ') };
    };
    const layer = (file) => processLayer(file, DEFAULTS.layer);
    const mono = (file) => processMonochrome(file, { dpi: 150, contrast: 1 });
    const files = async (names) => Promise.all(names.map(async (n) => fileOf(n, await bytesOf(n))));
    const collect = () => {
      const units = [];
      return { units, publish: async (u) => { units.push(u.kind === 'archive' ? { kind: 'archive', files: u.files.map((f) => f.name), manifest: u.manifest } : { kind: 'file', name: u.name }); } };
    };
    const out = { definitions: BATCH_POLICIES };
    const mixed = ['batch-ok', 'invalid', 'text-a4', 'signature-a4'];
    for (const p of ['B1', 'B2', 'B3']) {
      const sink = collect();
      const r = await runBatch(p, { files: await files(mixed), plan, run: layer, owner: createOwner(), publish: sink.publish });
      out[p] = { ...r, units: sink.units, started: r.events.filter((e) => e.type === 'start').map((e) => e.name) };
    }
    // B3: one file cancelled by its own owner; the others stand.
    {
      const sink = collect();
      const r = await runBatch('B3', {
        files: await files(['batch-ok', 'long-8', 'text-a4']), plan, run: mono, owner: createOwner(), publish: sink.publish,
        onFileStart: (name, own) => { if (name === 'long-8.pdf') setTimeout(() => own.supersede(), 20); },
      });
      out.B3fileCancel = { ...r, units: sink.units };
    }
    // Every policy: the whole batch superseded while its second file runs.
    for (const p of ['B1', 'B2', 'B3']) {
      const sink = collect();
      const owner = createOwner();
      const r = await runBatch(p, {
        files: await files(['batch-ok', 'long-8', 'text-a4']), plan, run: mono, owner, publish: sink.publish,
        onFileStart: (name) => { if (name === 'long-8.pdf') setTimeout(() => owner.supersede(), 20); },
      });
      out[`${p}superseded`] = { ...r, units: sink.units };
    }
    // The shape B3 must not be mistaken for, fed to the same checker.
    const fake = await aggregateMasqueradingAsB3({ files: await files(['batch-ok', 'text-a4']), plan, run: layer, owner: createOwner(), publish: async () => {} });
    const real = await runBatch('B3', { files: await files(['batch-ok', 'text-a4']), plan, run: layer, owner: createOwner(), publish: async () => {} });
    out.conformance = { real: conformsToB3(real), fake: conformsToB3(fake) };
    return out;
  },

  /** RF-K4: destinations, a partly clipped annotation, and a form widget, through Margin. */
  async marginSemantics() {
    const opts = { scale: 0.8, position: 'center' };
    // -- destinations -----------------------------------------------------------
    const readDests = async (bytes) => {
      const doc = await PDFDocument.load(bytes, { updateMetadata: false });
      const res = (v) => (v instanceof PDFRef ? doc.context.lookup(v) : v);
      const pageIndex = new Map(doc.getPages().map((p, i) => [p.ref.toString(), i + 1]));
      const arr = (a) => {
        const v = res(a);
        if (!(v instanceof PDFArray)) return null;
        return [pageIndex.get(v.get(0)?.toString()) ?? '?', res(v.get(1))?.decodeText?.(),
          ...v.asArray().slice(2).map((x) => (x?.asNumber ? Math.round(x.asNumber() * 100) / 100 : null))];
      };
      const out = { links: [], named: null, outline: null, annots: 0 };
      const annots = doc.getPages()[0].node.lookup(PDFName.of('Annots'));
      if (annots instanceof PDFArray) {
        out.annots = annots.size();
        for (const a of annots.asArray()) {
          const d = res(a);
          const action = res(d.get(PDFName.of('A')));
          out.links.push(arr(d.get(PDFName.of('Dest'))) ?? (action ? (arr(action.get(PDFName.of('D'))) ?? `name:${action.get(PDFName.of('D'))?.decodeText?.()}`) : null));
        }
      }
      const names = res(doc.catalog.get(PDFName.of('Names')));
      const tree = names instanceof PDFDict ? res(names.get(PDFName.of('Dests'))) : null;
      const list = tree ? res(tree.get(PDFName.of('Names'))) : null;
      out.named = list instanceof PDFArray ? arr(list.get(1)) : null;
      const outlines = res(doc.catalog.get(PDFName.of('Outlines')));
      out.outline = outlines instanceof PDFDict ? arr(res(outlines.get(PDFName.of('First'))).get(PDFName.of('Dest'))) : null;
      return out;
    };
    const links = await bytesOf('internal-links');
    const inplace = await marginInPlace(links, opts);
    const production = await processMargin(fileOf('internal-links', links), opts);
    const a4 = [0, 0, 595.28, 841.89];
    const m = marginTransform(a4, 0, 0.8, 'center').matrix;
    const expect = (x, y) => [Math.round((m[0] * x + m[4]) * 100) / 100, Math.round((m[3] * y + m[5]) * 100) / 100];
    // What a reader resolves: PDF.js's own view of the named destination.
    const readerNamed = async (bytes) => {
      const pdf = await pdfjsLib.getDocument({ data: bytes.slice(), isEvalSupported: false }).promise;
      const d = await pdf.getDestination('m5-named');
      await pdf.destroy();
      return d ? d.slice(1).map((x) => (typeof x === 'number' ? Math.round(x * 100) / 100 : x?.name ?? x)) : null;
    };
    const destinations = {
      before: await readDests(links),
      inplace: inplace.bytes ? await readDests(inplace.bytes) : null,
      inplaceStatus: inplace.status, movedDestinations: inplace.movedDestinations,
      production: await readDests(production),
      expected: { xyz: expect(100, 700), fitH: expect(0, 500)[1], fitR: [...expect(100, 100), ...expect(300, 300)], outline: expect(50, 400) },
      readerNamedBefore: await readerNamed(links),
      readerNamedAfter: inplace.bytes ? await readerNamed(inplace.bytes) : null,
    };
    // -- a partly clipped annotation, and the same page without it -------------
    const partial = await bytesOf('annotation-partial-crop');
    const refused = await marginInPlace(partial, opts);
    const stripped = await PDFDocument.load(partial, { updateMetadata: false });
    stripped.getPages()[0].node.delete(PDFName.of('Annots'));
    const control = await marginInPlace(await stripped.save(), opts);
    // -- a form widget ----------------------------------------------------------
    const form = await bytesOf('form-a4');
    const widget = async (bytes, regenerate) => {
      let b = bytes;
      if (regenerate) {
        // A viewer that ignores the stored appearance and redraws it from
        // /DA. Only for this measurement, on a copy, and only on a form
        // with no XFA (getForm() would delete it).
        const doc = await PDFDocument.load(bytes, { updateMetadata: false });
        const helv = await doc.embedFont(StandardFonts.Helvetica);
        doc.getForm().getTextField('m5.text').updateAppearances(helv);
        b = await doc.save();
      }
      const doc = await PDFDocument.load(b, { updateMetadata: false });
      const res = (v) => (v instanceof PDFRef ? doc.context.lookup(v) : v);
      const acro = res(doc.catalog.get(PDFName.of('AcroForm')));
      // `m5.text` is a hierarchy (m5 → text → widget): walk down to the first
      // dictionary with a /Rect, keeping the nearest /DA on the way.
      let node = res(res(acro.get(PDFName.of('Fields'))).get(0));
      let daValue = null;
      for (let depth = 0; node && node.get(PDFName.of('Rect')) === undefined && depth < 8; depth += 1) {
        daValue = node.get(PDFName.of('DA')) ?? daValue;
        const kids = res(node.get(PDFName.of('Kids')));
        node = kids instanceof PDFArray ? res(kids.get(0)) : null;
      }
      const w = node;
      const rect = res(w.get(PDFName.of('Rect'))).asArray().map((n) => n.asNumber());
      const da = (w.get(PDFName.of('DA')) ?? daValue)?.decodeText?.() ?? null;
      // Ink height inside the widget, rendered by PDF.js at 4x.
      const pdf = await pdfjsLib.getDocument({ data: b.slice(), isEvalSupported: false }).promise;
      const page = await pdf.getPage(1);
      const vp = page.getViewport({ scale: 4 });
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.fillStyle = 'white'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      await page.render({ canvas, canvasContext: ctx, viewport: vp }).promise;
      const [x0, y0, x1, y1] = vp.convertToViewportRectangle(rect);
      const [l, t, r, bt] = [Math.min(x0, x1), Math.min(y0, y1), Math.max(x0, x1), Math.max(y0, y1)].map(Math.round);
      // 2.5 pt in from every edge: the border is not the text.
      const inset = 10;
      const px = ctx.getImageData(l + inset, t + inset, Math.max(1, r - l - 2 * inset), Math.max(1, bt - t - 2 * inset));
      let top = Infinity; let bottom = -1;
      for (let y = 0; y < px.height; y += 1) {
        for (let x = 0; x < px.width; x += 1) {
          const i = (y * px.width + x) * 4;
          if (0.299 * px.data[i] + 0.587 * px.data[i + 1] + 0.114 * px.data[i + 2] < 128) { top = Math.min(top, y); bottom = y; }
        }
      }
      canvas.width = 1; canvas.height = 1;
      await pdf.destroy();
      const value = (await readSourceFacts(b)).fieldCount;
      return { rect, da, inkHeight: bottom >= top ? (bottom - top + 1) / 4 : 0, rectHeight: Math.abs(rect[3] - rect[1]), fields: value };
    };
    const scaled = await marginInPlace(form, opts);
    const unscaled = await marginInPlace(form, { ...opts, scaleWidgetText: false });
    const widgets = {
      source: await widget(form, false), sourceRegenerated: await widget(form, true),
      scaled: await widget(scaled.bytes, false), scaledRegenerated: await widget(scaled.bytes, true),
      unscaledRegenerated: await widget(unscaled.bytes, true),
      fieldValue: (await inspect(scaled.bytes, { render: false })).fields.find((f) => f.name === 'm5.text')?.value ?? null,
    };
    return {
      destinations,
      partial: { status: refused.status, refusals: refused.refusals, controlStatus: control.status },
      widgets,
    };
  },

  /** RF-K6: which layer the translucent overlay sits on, relative to an annotation. */
  async layerStacking() {
    const src = await bytesOf('annotation-overlap');
    const production = await processLayer(fileOf('annotation-overlap', src), DEFAULTS.layer);
    const above = await layerAboveAnnotations(src, DEFAULTS.layer);
    const sample = async (bytes) => {
      const r = await inspect(bytes);
      const t = r.thumbs[0];
      const at = (xPt, yPt) => {
        const x = Math.round(xPt / 595.28 * t.width);
        const y = Math.round((841.89 - yPt) / 841.89 * t.height);
        const i = (y * t.width + x) * 4;
        return [t.data[i], t.data[i + 1], t.data[i + 2]];
      };
      return {
        annotationCentre: at(300, 400),
        annots: r.pages[0].annots.map((a) => a.subtype),
        thumb: t,
        text: r.text.join(' ').includes('OVERLAP-M5'),
      };
    };
    const s = await sample(src);
    const p = await sample(production);
    const a = await sample(above);
    return {
      before: s.annotationCentre, production: p.annotationCentre, above: a.annotationCentre,
      annotsBefore: s.annots, annotsProduction: p.annots, annotsAbove: a.annots,
      contentProduction: overlayCoverage(s.thumb, p.thumb), contentAbove: overlayCoverage(s.thumb, a.thumb),
      textKept: { production: p.text, above: a.text },
    };
  },

  /** RF-K3: every use of every image, planned before anything is rewritten. */
  async optimizePlanning() {
    const out = {};
    for (const name of ['shared-image-a4-a1', 'shared-image-a1-a4', 'repeated-image', 'form-image', 'annot-image']) {
      const src = await bytesOf(name);
      const doc = await PDFDocument.load(src, { updateMetadata: false });
      const uses = [...planImageUses(doc).values()].map((e) => ({
        width: e.stream.dict.lookup(PDFName.of('Width')).asNumber(),
        height: e.stream.dict.lookup(PDFName.of('Height')).asNumber(),
        uses: e.uses.map((u) => ({ page: u.page, needW: Math.ceil(u.w * 150 / 72), needH: Math.ceil(u.h * 150 / 72) })),
        uncertain: e.uncertain,
      }));
      out[name] = { uses };
      for (const planner of ['all-uses', 'first-use']) {
        const r = await optimizeStructural(src, { dpi: 150, planner });
        const rep = await inspect(r.bytes, { render: false });
        out[name][planner] = {
          images: [...new Set(rep.pages.flatMap((p) => p.images.map((i) => `${i.width}x${i.height}`)))],
          decisions: r.report.decisions.map((d) => ({ action: d.action, to: d.to ?? null, from: [d.width, d.height], uncertain: d.uncertain.length })),
          bytes: r.bytes.length,
        };
      }
    }
    return out;
  },

  /**
   * RF-K3: what lossy recompression does to one-pixel linework, measured at
   * the scan's own 300 dpi against the source, for each variant a Human could
   * choose.
   */
  async optimizeQuality() {
    const src = await bytesOf('fine-line-scan');
    const render = async (bytes, dpi) => {
      const pdf = await pdfjsLib.getDocument({ data: bytes.slice(), isEvalSupported: false }).promise;
      const page = await pdf.getPage(1);
      const vp = page.getViewport({ scale: dpi / 72 });
      const c = document.createElement('canvas');
      c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.fillStyle = 'white'; ctx.fillRect(0, 0, c.width, c.height);
      await page.render({ canvas: c, canvasContext: ctx, viewport: vp }).promise;
      const d = ctx.getImageData(0, 0, c.width, c.height).data;
      c.width = 1; c.height = 1;
      await pdf.destroy();
      const luma = new Uint8Array(d.length / 4);
      for (let i = 0; i < luma.length; i += 1) luma[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
      return luma;
    };
    const compare = (a, b) => {
      let ink = 0; let kept = 0; let spurious = 0; let se = 0;
      for (let i = 0; i < a.length; i += 1) {
        const ia = a[i] < 128; const ib = b[i] < 128;
        if (ia) { ink += 1; if (ib) kept += 1; } else if (ib) spurious += 1;
        se += (a[i] - b[i]) ** 2;
      }
      const mse = se / a.length;
      return { lineInkKept: kept / ink, spuriousInk: spurious / ink, psnr: mse === 0 ? Infinity : 10 * Math.log10(255 * 255 / mse) };
    };
    const reference = await render(src, 300);
    const variants = {
      'O1 production @150': await processOptimize(fileOf('fine-line-scan', src), { dpi: 150 }),
      'O2 lossless': await (await PDFDocument.load(src, { updateMetadata: false })).save({ useObjectStreams: true }),
      'O3 JPEG q0.8 @150': (await optimizeStructural(src, { dpi: 150, quality: 0.8 })).bytes,
      'O3 JPEG q0.92 @150': (await optimizeStructural(src, { dpi: 150, quality: 0.92 })).bytes,
      'O3 JPEG q0.8 @300': (await optimizeStructural(src, { dpi: 300, quality: 0.8 })).bytes,
      'O3 JPEG q0.92 @300': (await optimizeStructural(src, { dpi: 300, quality: 0.92 })).bytes,
      'O3 lossless resample @150': (await optimizeStructural(src, { dpi: 150, codec: 'flate' })).bytes,
    };
    const out = { sourceBytes: src.length };
    for (const [k, bytes] of Object.entries(variants)) {
      out[k] = { bytes: bytes.length, ratio: bytes.length / src.length, ...compare(reference, await render(bytes, 300)) };
    }
    return out;
  },

  /** RF-K5: the JPEG encoder's worst case — full-resolution noise — at the quality production uses. */
  jpegWorstCase() {
    const out = [];
    // xorshift32, high byte: an LCG's low bits have short periods, and a
    // periodic "noise" is exactly what a JPEG encoder compresses well.
    let seed = 2463534242;
    const rand = () => {
      seed ^= seed << 13; seed >>>= 0;
      seed ^= seed >>> 17;
      seed ^= seed << 5; seed >>>= 0;
      return seed >>> 24;
    };
    // Uniform noise, binary (0/255) noise, and a one-pixel checkerboard: the
    // contents that leave a JPEG encoder least to discard.
    const kinds = {
      'rgb noise': (p, x, y) => [rand(), rand(), rand()],
      'grey noise': () => { const v = rand(); return [v, v, v]; },
      'binary rgb noise': () => [rand() & 1 ? 255 : 0, rand() & 1 ? 255 : 0, rand() & 1 ? 255 : 0],
      'binary grey noise': () => { const v = rand() & 1 ? 255 : 0; return [v, v, v]; },
      'checkerboard': (p, x, y) => { const v = (x + y) % 2 ? 255 : 0; return [v, v, v]; },
      'colour checkerboard': (p, x, y) => ((x + y) % 2 ? [255, 0, 0] : [0, 0, 255]),
    };
    for (const [kind, gen] of Object.entries(kinds)) for (const [w, h] of [[1024, 1024], [2480, 3508]]) {
      const grey = kind.includes('grey') || kind === 'checkerboard';
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(w, h);
      for (let i = 0, p = 0; i < img.data.length; i += 4, p += 1) {
        const [r, g, b] = gen(p, p % w, Math.floor(p / w));
        img.data[i] = r; img.data[i + 1] = g; img.data[i + 2] = b; img.data[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      const url = c.toDataURL('image/jpeg', 0.8);
      c.width = 1; c.height = 1;
      const b64 = url.length - 23;
      const bytes = b64 * 3 / 4 - (url.endsWith('==') ? 2 : (url.endsWith('=') ? 1 : 0));
      out.push({ kind, width: w, height: h, grey, bytes, bytesPerPixel: bytes / (w * h) });
    }
    return { samples: out, worst: Math.max(...out.map((s) => s.bytesPerPixel)), bound: RASTER_MODEL.jpegBytesPerPixelBound };
  },

  /**
   * RF-K5: the Raster Budget model, validated against production runs, then
   * applied to every sheet and offered resolution and to its boundaries.
   */
  async rasterBudget() {
    // Validation: what production actually creates and writes, against the terms.
    const dataUrls = [];
    const canvases = [];
    const origUrl = HTMLCanvasElement.prototype.toDataURL;
    const origCtx = HTMLCanvasElement.prototype.getContext;
    HTMLCanvasElement.prototype.toDataURL = function patched(...a) { const u = origUrl.apply(this, a); dataUrls.push(u.length); return u; };
    const counted = new WeakSet();
    HTMLCanvasElement.prototype.getContext = function patched(...a) {
      // Once per canvas: production asks for its context, and PDF.js may ask again.
      if (this.width > 400 && !counted.has(this)) { counted.add(this); canvases.push([this.width, this.height]); }
      return origCtx.apply(this, a);
    };
    const runs = [
      ['monochrome', 'text-a4', 300], ['monochrome', 'raster-a4', 300], ['optimize', 'mixed-a4', 150],
      ['monochrome', 'long-8', 150], ['both', 'text-a4', 150], ['optimize', 'vector-a1', 150], ['optimize', 'mixed-sizes', 72],
    ];
    const validation = [];
    try {
      for (const [op, name, dpi] of runs) {
        dataUrls.length = 0; canvases.length = 0;
        const src = await bytesOf(name);
        const facts = await rasterFacts(src);
        const plan = filePlan(facts, op, dpi);
        const outBytes = await OPS[op](name, src, dpi);
        const rep = await inspect(outBytes, { render: false });
        const jpegs = rep.pages.map((p) => p.images[0]?.encodedBytes ?? 0);
        validation.push({
          op, name, dpi, pages: facts.pages.length,
          outputBytes: outBytes.length, outputBound: plan.output,
          jpegMax: Math.max(...jpegs), jpegBound: Math.max(...plan.pages.map((p) => p.jpeg)),
          jpegPerPageWithinBound: jpegs.every((j, i) => j <= plan.pages[i].jpeg),
          dataUrlExact: op === 'both' ? null : dataUrls.length === jpegs.length
            && dataUrls.every((len, i) => len === 4 * Math.ceil(jpegs[i] / 3) + RASTER_MODEL.dataUrlPrefix),
          canvasExact: canvases.slice(0, plan.pages.length).every((c, i) => {
            const p = plan.pages[i];
            return (c[0] === p.w && c[1] === p.h) || (c[0] === p.h && c[1] === p.w);
          }),
          canvases: canvases.slice(0, 3), planned: plan.pages.slice(0, 3).map((p) => [p.w, p.h]),
        });
      }
    } finally {
      HTMLCanvasElement.prototype.toDataURL = origUrl;
      HTMLCanvasElement.prototype.getContext = origCtx;
    }

    // The model over every sheet and every resolution the UI offers.
    const MIB = 1024 * 1024;
    const sheets = { A4: [595.28, 841.89], A3: [841.89, 1190.55], A1: [1683.78, 2383.94], A0: [2383.94, 3370.39] };
    const one = (wPt, hPt, pages = 1, sourceBytes = 50000) => ({
      sourceBytes, pages: Array.from({ length: pages }, () => ({ wPt, hPt, imagePixels: 0, transparency: false })),
    });
    const limits = (memory, maxRasterPixels = RASTER_LIMIT_CANDIDATES.MAX_RASTER_PIXELS[1]) => ({
      maxRasterPixels, memory, maxOutputBytes: RASTER_LIMIT_CANDIDATES.MAX_OUTPUT_BYTES[0],
    });
    const offered = { monochrome: [150, 300, 600], both: [150, 300, 600], optimize: [72, 150, 300] };
    const table = [];
    for (const [sheet, [w, h]] of Object.entries(sheets)) {
      for (const [op, dpis] of Object.entries(offered)) {
        for (const dpi of dpis) {
          const at = (mem) => runPlan([{ name: 'x', facts: one(w, h) }], op, dpi, limits(mem));
          const r = at(512 * MIB);
          table.push({
            sheet, op, dpi, megapixels: r.maxPixels / 1e6, peakMiB: r.peak / MIB, outputMiB: r.output / MIB,
            at512: r.status, at1G: at(1024 * MIB).status, at2G: at(2048 * MIB).status,
          });
        }
      }
    }
    // Which sheets and resolutions each raster-limit candidate admits (memory aside).
    const candidates = RASTER_LIMIT_CANDIDATES.MAX_RASTER_PIXELS.map((limit) => ({
      limitMpx: limit / 1e6,
      admits: Object.entries(sheets).flatMap(([s, [w, h]]) => [72, 150, 300, 600]
        .filter((dpi) => pagePixels(w, h, dpi).pixels <= limit).map((dpi) => `${s}@${dpi}`)),
    }));

    // Boundaries.
    const search = (lo, hi, ok) => { while (hi - lo > 1) { const mid = Math.floor((lo + hi) / 2); if (ok(mid)) lo = mid; else hi = mid; } return [lo, hi]; };
    // (a) the raster ceiling, isolated from memory by an unbounded budget.
    const rasterAt = (width) => runPlan([{ name: 'x', facts: one(width, width * Math.SQRT2) }], 'monochrome', 300, limits(Infinity));
    const [rLo, rHi] = search(100, 20000, (wPt) => rasterAt(wPt).status === 'READY');
    // (b) pages of A4 at 300 dpi Monochrome under the default budget.
    const pagesAt = (n, mem = 512 * MIB) => runPlan([{ name: 'x', facts: one(...sheets.A4, n) }], 'monochrome', 300, limits(mem));
    const [pLo, pHi] = search(1, 400, (n) => pagesAt(n).status === 'READY');
    // (c) files of one A4 page at 150 dpi Optimize, as a batch.
    const filesAt = (k, mem = 512 * MIB) => runPlan(Array.from({ length: k }, (_, i) => ({ name: `f${i}`, facts: one(...sheets.A4) })), 'optimize', 150, limits(mem));
    const [fLo, fHi] = search(1, 400, (k) => filesAt(k).status === 'READY');
    // (d) the first memory-refused single page, at the presets.
    const a1 = (mem) => runPlan([{ name: 'x', facts: one(...sheets.A1) }], 'monochrome', 300, limits(mem));
    const pick = (r) => ({ status: r.status, reason: r.reason, peakMiB: r.peak / MIB, outputMiB: r.output / MIB });
    return {
      model: RASTER_MODEL, terms: RASTER_TERMS, limits: RASTER_LIMIT_CANDIDATES, validation, table, candidates,
      boundaries: {
        raster: { largestWidthPt: rLo, firstRefusedWidthPt: rHi, largest: pick(rasterAt(rLo)), firstRefused: pick(rasterAt(rHi)), pixelsLargest: rasterAt(rLo).maxPixels, pixelsFirst: rasterAt(rHi).maxPixels },
        pages: { largest: pLo, firstRefused: pHi, atLargest: pick(pagesAt(pLo)), atFirst: pick(pagesAt(pHi)), firstAt1G: pick(pagesAt(pHi, 1024 * MIB)), firstAt2G: pick(pagesAt(pHi, 2048 * MIB)) },
        files: { largest: fLo, firstRefused: fHi, atLargest: pick(filesAt(fLo)), atFirst: pick(filesAt(fHi)), firstAt1G: pick(filesAt(fHi, 1024 * MIB)) },
        a1mono300: { at512: pick(a1(512 * MIB)), at1G: pick(a1(1024 * MIB)), at2G: pick(a1(2048 * MIB)) },
        independence: {
          rasterAt2G: pick(runPlan([{ name: 'x', facts: one(...sheets.A1) }], 'monochrome', 600, limits(2048 * MIB))),
          rasterAtUnbounded: pick(runPlan([{ name: 'x', facts: one(...sheets.A0) }], 'monochrome', 600, limits(Infinity))),
          outputAt2G: pick(pagesAt(pHi + 40, 2048 * MIB)),
        },
      },
    };
  },
};

document.getElementById('state').textContent = 'ready';
window.__m5Ready = true;
</script>
