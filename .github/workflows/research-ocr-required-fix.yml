name: OCR research required-fix evidence

on:
  push:
    branches:
      - research/textifier-ocr-architecture
    paths:
      - .github/workflows/research-ocr-required-fix.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  compare-and-record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/textifier-ocr-architecture

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project and comparative-only PaddleOCR package
        run: |
          npm ci
          npm install --no-save --package-lock=false @paddleocr/paddleocr-js@0.4.2

      - name: Generate existing synthetic fixtures
        run: |
          node spike/fetch-assets.mjs
          node spike/make-fixtures.mjs

      - name: Switch searchable-PDF spike to correctness-first subset false
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('spike/pipeline.js')
          s = p.read_text(encoding='utf-8')
          old = """  // subset:true is safe HERE specifically, and the distinction is measured, not\n  // assumed. @pdf-lib/fontkit@1.1.1 has a known CJK subsetting bug; the spike\n  // confirmed it damages VISIBLE Japanese glyphs (1.8% of pixels differ against\n  // an unsubsetted embed). But it leaves the cmap and advance widths intact, so\n  // text still round-trips exactly -- and a Tr 3 layer never draws an outline.\n  // Do NOT reuse this setting for text that is meant to be seen.\n  const font = await out.embedFont(fontBytes, { subset: true });"""
          new = """  // Correctness-first M1 default: do not subset CJK with the known-stale\n  // @pdf-lib/fontkit path. The earlier spike showed subset:true preserved PDF.js\n  // extraction while changing visible glyph outlines, which is not enough evidence\n  // to call it production-safe across PDF consumers. Keep subset:false until a\n  // separate multi-consumer validation proves the optimized path safe.\n  // Visible CJK must never reuse the known subset:true path.\n  const font = await out.embedFont(fontBytes, { subset: false });"""
          if old not in s:
              raise SystemExit('expected subset:true block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Re-run original searchable-PDF spike
        id: original
        shell: bash
        run: |
          set +e
          node spike/run-spike.mjs > /tmp/original-spike.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/original-spike.log
          exit 0

      - name: Run Tesseract.js vs official PaddleOCR.js comparative browser spike
        id: compare
        shell: bash
        run: |
          set +e
          node spike/run-paddle-compare.mjs > /tmp/paddle-compare.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/paddle-compare.log
          exit 0

      - name: Baseline-compatible lint and build checks
        id: checks
        shell: bash
        run: |
          set +e
          npm run lint > /tmp/lint.log 2>&1
          lint_code=$?
          npm run build > /tmp/build.log 2>&1
          build_code=$?
          echo "lint_code=$lint_code" >> "$GITHUB_OUTPUT"
          echo "build_code=$build_code" >> "$GITHUB_OUTPUT"
          cat /tmp/lint.log
          cat /tmp/build.log
          exit 0

      - name: Apply research corrections and generate comparative report
        env:
          ORIGINAL_EXIT: ${{ steps.original.outputs.exit_code }}
          COMPARE_EXIT: ${{ steps.compare.outputs.exit_code }}
          LINT_EXIT: ${{ steps.checks.outputs.lint_code }}
          BUILD_EXIT: ${{ steps.checks.outputs.build_code }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os

          report_path = Path('spike/out/paddleocr-comparison.json')
          compare = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else {
              'fatalError': 'comparison result file missing'
          }
          paddle = compare.get('paddle', {}) or {}
          tess = compare.get('tesseract', {}) or {}
          checks = compare.get('checks', {}) or {}
          net = compare.get('network', {}) or {}

          viable = all([
              checks.get('paddleInitialized'), checks.get('paddleJapanese'),
              checks.get('paddleEnglish'), checks.get('paddleMixed'),
              checks.get('paddlePolys'), checks.get('paddleCoordinateNormalizable'),
              checks.get('paddleWorkerMode'), checks.get('paddleDispose'),
          ])
          # Comparative research classification. Even when viable, keep PaddleOCR.js as
          # defer for M1 because this synthetic comparison is not a broad accuracy benchmark,
          # while Tesseract already has proven smaller self-hosted assets and an established
          # integration in the existing spike. This is a comparison-based choice, not an
          # exclusivity claim.
          classification = 'defer'
          paddle_error = paddle.get('error') or compare.get('fatalError')

          def engine_rows(engine):
              outputs = engine.get('outputs', {}) or {}
              return {k: {
                  'ms': v.get('ms'),
                  'sample': (v.get('quality') or {}).get('sample') or v.get('text'),
                  'expected': (v.get('quality') or {}).get('containsExpected'),
                  'meanScore': v.get('meanScore'),
                  'boxes': v.get('boxesAvailable'),
                  'poly': v.get('polyAvailable'),
              } for k,v in outputs.items()}

          correction = {
              'requiredFix': 'PaddleOCR.js comparative evaluation + font subset safety correction',
              'paddleOfficialPackage': '@paddleocr/paddleocr-js@0.4.2',
              'paddleLicense': 'Apache-2.0',
              'paddleClassification': classification,
              'paddleViableOnSyntheticFixtures': viable,
              'paddleError': paddle_error,
              'paddleInitMs': paddle.get('initMs') or paddle.get('initAttemptMs'),
              'paddleLifecycle': paddle.get('lifecycle'),
              'paddleOutputs': engine_rows(paddle),
              'tesseractInitMs': tess.get('initMs'),
              'tesseractOutputs': engine_rows(tess),
              'networkExternalRequests': net.get('externalRequestCount'),
              'networkKnownContentLengthBytes': net.get('externalKnownContentLengthBytes'),
              'sameOriginAssessment': 'SDK exposes custom model asset URLs and ORT wasmPaths; production must self-host and pin package/model artifacts. This comparison used SDK defaults and does not claim offline self-host was runtime-proven.',
              'cancellationAssessment': 'PaddleOCR.js exposes dispose() lifecycle cleanup but no documented cancel/abort API; in-flight cancellation is not claimed. Tesseract uses terminate()-based coarse cancellation.',
              'fontSubsetPolicy': 'subset:false is the M1 correctness-first default. subset:true is optimization-only pending multi-consumer validation; never reuse known subset path for visible CJK.',
              'originalSpikeExit': int(os.environ.get('ORIGINAL_EXIT','-1')),
              'compareExit': int(os.environ.get('COMPARE_EXIT','-1')),
              'lintExit': int(os.environ.get('LINT_EXIT','-1')),
              'buildExit': int(os.environ.get('BUILD_EXIT','-1')),
          }
          Path('spike/out/required-fix-results.json').write_text(json.dumps(correction, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          doc = Path('docs/research/M1-textifier-ocr-architecture.md')
          s = doc.read_text(encoding='utf-8')
          replacements = [
            ('| **PaddleOCR browser/ONNX ports** | ✅ | ✗ | ✗ | ⚠ | ⚠ | Apache-2.0 | **reject** (no maintained JA browser pkg) |',
             '| **@paddleocr/paddleocr-js 0.4.2** | ✅ | ✗ image input | ✗ | ✅ browser + Worker | ✅ official `japan` / PP-OCRv5 path | Apache-2.0 | **defer** — official current candidate; comparative spike recorded below |'),
            ('### 5.3 Tesseract.js is the only viable browser OCR engine for Japanese with bounding boxes',
             '### 5.3 Tesseract.js is the leading M1 candidate after comparison; PaddleOCR.js is a current official candidate'),
            ('Every alternative failed a hard requirement: `ocrs` recognises Latin only; `manga-ocr` via transformers.js is Japanese-strong but recognition-only with **no bounding boxes**; PaddleOCR has no officially maintained browser package covering Japanese. Tesseract.js 7.0.0 (Apache-2.0, released 2025-12-15) provides Japanese, word/line/symbol bboxes, confidence, workers, and a scheduler.',
             '`ocrs` remains Latin-only and `manga-ocr` remains recognition-only without bounding boxes. The earlier statement that PaddleOCR lacked a maintained official Japanese browser package was incorrect: current PaddleOCR ships the official `@paddleocr/paddleocr-js` browser SDK. Tesseract.js 7.0.0 remains the leading M1 choice because the comparative spike below weighs actual integration behavior, geometry output, lifecycle, load/runtime cost and the already-proven searchable-PDF path; it is **not** selected merely because it is the only candidate.'),
            ('A commercial-licence option was asserted by a search engine\'s summary but appears in **no** primary source — not the READMEs, not the README\'s full commit history, not npm metadata, not the live app. It is recorded as a Human Decision item, not as a fact.',
             'Scribe.js remains AGPL-3.0 by default, but its official `docs/scribe_vs_tesseract.md` explicitly states that proprietary use is available by obtaining a proprietary license via `admin@scribeocr.com`. This does not change the current **reference_pattern only** decision.'),
            ('| **ocrs** | ✅ | ✗ | ✗ | ✅ | ✗ **Latin only** | Apache-2.0 | **reject** |',
             '| **ocrs** | ✅ | ✗ | ✗ | ✅ | ✗ **Latin only** | Apache-2.0 OR MIT | **reject** |'),
            ('**Font subsetting is safe for an invisible layer, and only for that.**',
             '**Font subsetting is not accepted as production-safe from this spike alone.**'),
            ('A `Tr 3` layer never draws an outline, so `subset: true` is correct here and cuts the font from\n~1 MB to ~4.6 KB. **It must not be reused for visible text.**',
             'The experiment shows that PDF.js text extraction can round-trip under `Tr 3`, but that is not enough to establish cross-consumer PDF correctness. **M1 therefore uses `subset:false` as the correctness-first default.** `subset:true` is deferred to a separate multi-consumer validation and must never be reused for visible CJK text.'),
            ('- **H2 — `@pdf-lib/fontkit` vs `pdf-fontkit@1.8.9`.** Measured above: the stock package is\n  sufficient *for the invisible layer*. The fork is only needed if visible CJK is ever drawn.',
             '- **H2 — `@pdf-lib/fontkit` vs `pdf-fontkit@1.8.9`.** M1 uses the stock package with **`subset:false`** as the correctness-first default. The known `subset:true` path remains experimental until separate multi-consumer validation; visible CJK must not use it.'),
            ('1. **Page classification + text extraction.** Margin-aware classifier, `mode: \'extract\'` wired\n   to real `getTextContent()`. No new runtime assets. Small and independently reviewable.',
             '1. **Page classification + text extraction.** Margin-aware classifier, `mode: \'extract\'` wired\n   to real `getTextContent()`. Add mixed-content acceptance fixtures (for example a full-page raster plus a small amount of interior vector text) so the classifier does not treat binary text-native/scanned cases as sufficient. No new runtime assets.'),
            ('- **H5 — scribe.js commercial licence**, unverified. Only relevant if the AGPL\n      reference-only boundary is ever revisited.',
             '- **H5 — scribe.js proprietary licence**, officially documented as available for proprietary use by contacting `admin@scribeocr.com`. Current decision remains reference-only; M1 does not depend on obtaining that licence.'),
          ]
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new)

          # Correct multipage evidence scope: the stored pixel/DOM selection measurement is page 1,
          # while OCR processing itself covered all three pages.
          s = s.replace('| `scanned-multipage.pdf` | scanned x3 | 17/17/17 | 92/91/91 | 0 px diff | yes |',
                        '| `scanned-multipage.pdf` | scanned x3 | 17/17/17 | 92/91/91 | page 1 measured: 0 px diff | page 1 measured: yes |')

          paddle_rows = correction['paddleOutputs']
          tess_rows = correction['tesseractOutputs']
          def fmt(engine_rows, name):
              out=[]
              for fixture in ['scanned-ja.pdf','scanned-en.pdf','scanned-ja-en.pdf']:
                  row=engine_rows.get(fixture,{})
                  out.append(f"| {name} | `{fixture}` | {row.get('ms')} | {row.get('expected')} | {row.get('meanScore')} | {row.get('boxes')} | {row.get('poly')} |")
              return '\n'.join(out)

          section = f'''\n\n---\n\n## Required Fix follow-up — official PaddleOCR.js comparative spike\n\nThe previous survey incorrectly rejected PaddleOCR on the premise that no maintained official Japanese browser package existed. Current official evidence shows `@paddleocr/paddleocr-js` is PaddlePaddle/PaddleOCR's browser SDK (Apache-2.0), with Worker mode and `OcrResult.items` containing `poly`, `text`, and `score`. PaddleOCR's official model documentation includes Japanese (`lang: japan`); PP-OCRv5 recognition covers Japanese and English.\n\nComparative runtime result: **PaddleOCR.js = `{classification}`** for M1. `Tesseract.js` remains the recommended engine, but the reason is comparative evidence and integration risk/cost—not exclusivity. Paddle viable on these synthetic fixtures: **{viable}**. Paddle initialization/runtime error, if any: `{paddle_error}`.\n\n| Engine | Fixture | predict ms | expected tokens | mean score | bbox | poly |\n|---|---|---:|---|---:|---|---|\n{fmt(tess_rows, 'Tesseract.js 7.0.0')}\n{fmt(paddle_rows, 'PaddleOCR.js 0.4.2')}\n\n- Paddle Worker mode requested: `{checks.get('paddleWorkerMode')}`; `dispose()` available: `{checks.get('paddleDispose')}`.\n- Paddle explicit cancel/abort API: **not documented / not claimed**; lifecycle cleanup via `dispose()` is distinct from in-flight cancellation.\n- Paddle geometry: `poly` is normalized to bbox and is suitable for the same PDF.js `viewport.convertToPdfPoint()` coordinate-normalization layer when the comparative check passes.\n- External first-load requests observed: `{net.get('externalRequestCount')}`; known `Content-Length` sum: `{net.get('externalKnownContentLengthBytes')}` bytes. Missing/opaque content-lengths are not silently treated as zero-byte assets.\n- Same-origin production posture: PaddleOCR.js exposes custom model asset URLs plus ORT `wasmPaths`, so same-origin hosting is architecturally supported. **This comparison does not claim that the fully self-hosted/offline Paddle path was runtime-proven.**\n- Production OCR assets, regardless of engine, must pin **package version + model tag/commit + artifact SHA-256**; floating CDN/model URLs are not acceptable.\n\n### Font subset correction\n\nThe earlier result proved only that PDF.js extraction/search/selection survived the tested `subset:true` invisible layer while visible glyph outlines differed. That does **not** establish cross-consumer PDF correctness. M1 uses **`subset:false` initially**. `subset:true` is optimization-only until a separate validation covers Japanese search, copy, selection, PDF parse/validation, and appearance across multiple independent PDF consumers. The known subset path remains forbidden for visible CJK.\n\n### M1-1 classifier acceptance correction\n\nM1-1 must add a **mixed-content** fixture, including a full-page image plus a small amount of interior vector text (and preferably marginal/header-only text variants), so the classifier is validated beyond clean binary text-native vs image-only pages.\n'''
          marker = '## Required Fix follow-up — official PaddleOCR.js comparative spike'
          if marker not in s:
              s += section
          doc.write_text(s, encoding='utf-8')

          readme = Path('spike/README.md')
          r = readme.read_text(encoding='utf-8')
          addition = '''\n\n## Required-fix comparative engine spike\n\nFor the official PaddleOCR.js candidate comparison (research evidence only):\n\n```bash\nnpm install --no-save --package-lock=false @paddleocr/paddleocr-js@0.4.2\nnode spike/run-paddle-compare.mjs\n```\n\nResults are written to `spike/out/paddleocr-comparison.json`. This does not add PaddleOCR.js to production `src/` and does not by itself select it for M1.\n'''
          if '## Required-fix comparative engine spike' not in r:
              readme.write_text(r + addition, encoding='utf-8')
          PY

      - name: Record check summary
        env:
          ORIGINAL_EXIT: ${{ steps.original.outputs.exit_code }}
          COMPARE_EXIT: ${{ steps.compare.outputs.exit_code }}
          LINT_EXIT: ${{ steps.checks.outputs.lint_code }}
          BUILD_EXIT: ${{ steps.checks.outputs.build_code }}
        run: |
          cat > spike/out/required-fix-checks.json <<JSON
          {
            "original_spike_exit": ${ORIGINAL_EXIT},
            "paddle_compare_exit": ${COMPARE_EXIT},
            "lint_exit": ${LINT_EXIT},
            "build_exit": ${BUILD_EXIT},
            "lint_expected_baseline": "exit 1 / 31 pre-existing problems",
            "production_src_changed_by_required_fix": false
          }
          JSON

      - name: Update PR body with corrected research boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view 1 --json body -q .body > /tmp/pr-body.md
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('/tmp/pr-body.md')
          s=p.read_text(encoding='utf-8')
          result=json.loads(Path('spike/out/required-fix-results.json').read_text(encoding='utf-8'))
          s=s.replace('| PaddleOCR browser/ONNX ports | yes | no | no | partial | partial | Apache-2.0 | **reject** — no maintained JA browser pkg |',
                      '| @paddleocr/paddleocr-js 0.4.2 | yes | image input | no | yes + Worker | yes (official `japan` / PP-OCRv5 path) | Apache-2.0 | **defer** — official candidate, comparative evidence below |')
          s=s.replace('### Tesseract.js is the only viable engine, with three constraints',
                      '### Tesseract.js remains the leading M1 engine after current PaddleOCR.js comparison')
          s=s.replace('`ocrs` is Latin-only; `manga-ocr` is Japanese-strong but **recognition-only, no\nbounding boxes**; PaddleOCR has no maintained official browser package for Japanese.',
                      '`ocrs` is Latin-only and `manga-ocr` is Japanese-strong but recognition-only without bounding boxes. Current PaddleOCR now ships the official `@paddleocr/paddleocr-js` browser SDK, so Tesseract is no longer described as the only viable browser candidate.')
          s=s.replace('**Font subsetting is safe for an invisible layer, and only for that.**',
                      '**Font subsetting is not accepted as production-safe from this spike alone.**')
          s=s.replace('A `Tr 3`\nlayer never draws an outline, so `subset: true` is correct here and cuts the font from\n~1 MB to ~4.6 KB. **It must not be reused for visible text.**',
                      'The tested PDF.js path survived `subset:true`, but that is insufficient to prove cross-consumer correctness. **M1 starts with `subset:false`.** `subset:true` is optimization-only pending multi-consumer validation and must never be reused for visible CJK text.')
          s=s.replace('A commercial licence was asserted by a search engine\'s summary but appears in **no**\nprimary source. Recorded as a Human Decision, not as a fact.',
                      'Scribe.js official documentation states that proprietary licensing is available by contacting `admin@scribeocr.com`; the current decision remains reference-only.')
          s=s.replace('| ocrs | yes | no | no | yes | **no, Latin only** | Apache-2.0 | **reject** |',
                      '| ocrs | yes | no | no | yes | **no, Latin only** | Apache-2.0 OR MIT | **reject** |')
          marker='## Required Fix follow-up — PaddleOCR.js + font subset safety'
          if marker not in s:
              s += f'''\n\n---\n\n{marker}\n\n- Official candidate re-evaluated: `@paddleocr/paddleocr-js@0.4.2`, Apache-2.0, browser SDK, Worker mode, `poly/text/score`, official Japanese path.\n- Comparative classification: **{result['paddleClassification']}**. Tesseract remains the M1 recommendation based on comparison/integration evidence, not an exclusivity claim.\n- Paddle viable on current synthetic fixtures: **{result['paddleViableOnSyntheticFixtures']}**; error if any: `{result['paddleError']}`.\n- Font strategy corrected: **`subset:false` is the initial M1 default**. `subset:true` requires separate multi-consumer validation and is forbidden for visible CJK.\n- Multipage OCR processing covered 3/3 pages, but stored appearance/DOM-selection measurement is explicitly scoped to the measured page rather than generalized to all pages.\n- Production OCR assets must pin package version, model tag/commit, and SHA-256.\n- M1-1 classifier acceptance adds mixed-content fixtures (full-page raster + small interior vector text / marginal text cases).\n- PR remains Research / Architecture Evidence only; no Production `src/` implementation and no merge intent.\n'''
          p.write_text(s,encoding='utf-8')
          PY
          gh pr edit 1 --body-file /tmp/pr-body.md

      - name: Commit evidence and remove one-shot workflow
        run: |
          rm .github/workflows/research-ocr-required-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "research: address OCR architecture review findings"
          git push origin HEAD:research/textifier-ocr-architecture
