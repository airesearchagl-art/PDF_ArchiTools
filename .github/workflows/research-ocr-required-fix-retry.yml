name: OCR research required-fix retry

on:
  push:
    branches:
      - research/textifier-ocr-architecture
    paths:
      - .github/workflows/research-ocr-required-fix-retry.yml

permissions:
  contents: write

jobs:
  compare-and-record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/textifier-ocr-architecture

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install baseline plus comparative-only PaddleOCR.js
        run: |
          npm ci
          npm install --no-save --package-lock=false @paddleocr/paddleocr-js@0.4.2

      - name: Generate synthetic fixtures and font probe
        run: |
          node spike/fetch-assets.mjs
          node spike/make-fixtures.mjs
          node spike/probe-font-subset.mjs

      - name: Use correctness-first subset false in searchable-PDF spike
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('spike/pipeline.js')
          s = p.read_text(encoding='utf-8')
          old = "const font = await out.embedFont(fontBytes, { subset: true });"
          new = "const font = await out.embedFont(fontBytes, { subset: false });"
          if old in s:
              s = s.replace(old, new)
          elif new not in s:
              raise SystemExit('font subset setting not found')
          s = s.replace('subset:true is safe HERE specifically', 'subset:true was measured here but is not production-safe evidence by itself')
          s = s.replace('Do NOT reuse this setting for text that is meant to be seen.', 'M1 uses subset:false. The known subset:true path must not be used for visible CJK.')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Re-run original searchable-PDF spike
        id: original
        shell: bash
        run: |
          set +e
          node spike/run-spike.mjs > /tmp/original.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/original.log
          exit 0

      - name: Run bounded official PaddleOCR.js comparison
        id: compare
        shell: bash
        run: |
          set +e
          node spike/run-paddle-compare.mjs > /tmp/compare.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/compare.log
          exit 0

      - name: Baseline-compatible lint and build
        id: checks
        shell: bash
        run: |
          set +e
          npm run lint > /tmp/lint.log 2>&1
          lint=$?
          npm run build > /tmp/build.log 2>&1
          build=$?
          echo "lint_code=$lint" >> "$GITHUB_OUTPUT"
          echo "build_code=$build" >> "$GITHUB_OUTPUT"
          cat /tmp/lint.log
          cat /tmp/build.log
          exit 0

      - name: Record check evidence
        env:
          ORIGINAL_EXIT: ${{ steps.original.outputs.exit_code }}
          COMPARE_EXIT: ${{ steps.compare.outputs.exit_code }}
          LINT_EXIT: ${{ steps.checks.outputs.lint_code }}
          BUILD_EXIT: ${{ steps.checks.outputs.build_code }}
        run: |
          cat > spike/out/required-fix-checks.json <<JSON
          {
            "original_spike_exit": ${ORIGINAL_EXIT},
            "paddle_compare_exit": ${COMPARE_EXIT},
            "lint_exit": ${LINT_EXIT},
            "build_exit": ${BUILD_EXIT},
            "lint_expected_baseline": "exit 1 / 31 pre-existing problems",
            "font_subset_m1_default": false,
            "production_src_changed_by_required_fix": false
          }
          JSON

      - name: Commit evidence and remove temporary workflows
        run: |
          rm -f .github/workflows/research-ocr-required-fix.yml
          rm -f .github/workflows/research-ocr-required-fix-retry.yml
          rm -f .github/workflows/research-ocr-required-fix-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "research: record bounded PaddleOCR comparative evidence"
          git push origin HEAD:research/textifier-ocr-architecture
