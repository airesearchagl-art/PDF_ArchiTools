<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Textifier smoke harness</title>
<style>
  body { font: 13px/1.5 system-ui, sans-serif; margin: 16px; }
  .stage { position: relative; }
  .stage canvas { display: block; }
  .textLayer { position: absolute; inset: 0; overflow: hidden; line-height: 1; transform-origin: 0 0; }
  .textLayer span { position: absolute; color: transparent; white-space: pre; transform-origin: 0 0; }
</style>
</head>
<body>
<h1>Textifier smoke harness</h1>
<p>Driven by <code>scripts/smoke-textifier.mjs</code>. Not part of the app.</p>
<div id="log">idle</div>
<div id="stage" class="stage"></div>

<script type="module">
import * as pdfjsLib from 'pdfjs-dist';
import { TextLayer } from 'pdfjs-dist';
import { textifyPdf, classifyDocument, TextifyError } from '/src/utils/pdf-textifier/index.ts';

const log = (m) => { document.getElementById('log').textContent = m; };

async function renderToCanvas(bytes, pageNo, scale) {
  const doc = await pdfjsLib.getDocument({ data: new Uint8Array(bytes) }).promise;
  const page = await doc.getPage(pageNo);
  const viewport = page.getViewport({ scale });
  const canvas = document.createElement('canvas');
  canvas.width = Math.ceil(viewport.width);
  canvas.height = Math.ceil(viewport.height);
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  await page.render({ canvas, viewport }).promise;
  return { canvas, ctx, doc, page, viewport };
}

/** Appearance must not change: an invisible layer draws nothing. */
async function compareAppearance(input, output, pageNo, scale = 1.5) {
  const a = await renderToCanvas(input, pageNo, scale);
  const b = await renderToCanvas(output, pageNo, scale);
  if (a.canvas.width !== b.canvas.width || a.canvas.height !== b.canvas.height) {
    return { identical: false, reason: 'page size changed' };
  }
  const da = a.ctx.getImageData(0, 0, a.canvas.width, a.canvas.height).data;
  const db = b.ctx.getImageData(0, 0, b.canvas.width, b.canvas.height).data;
  let diff = 0;
  for (let i = 0; i < da.length; i += 4) {
    if (da[i] !== db[i] || da[i + 1] !== db[i + 1] || da[i + 2] !== db[i + 2]) diff++;
  }
  return { identical: diff === 0, differingPixels: diff, totalPixels: da.length / 4 };
}

/** Bounding box of the dark pixels, i.e. where the scanned ink actually is. */
function inkBox(ctx, w, h) {
  const d = ctx.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      if ((d[i] + d[i + 1] + d[i + 2]) / 3 < 128) {
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
  }
  return x1 < 0 ? null : { x0, y0, x1, y1 };
}

const boxArea = (b) => (b ? Math.max(0, b.x1 - b.x0) * Math.max(0, b.y1 - b.y0) : 0);
function iou(a, b) {
  if (!a || !b) return 0;
  const ix0 = Math.max(a.x0, b.x0), iy0 = Math.max(a.y0, b.y0);
  const ix1 = Math.min(a.x1, b.x1), iy1 = Math.min(a.y1, b.y1);
  const inter = Math.max(0, ix1 - ix0) * Math.max(0, iy1 - iy0);
  const union = boxArea(a) + boxArea(b) - inter;
  return union > 0 ? inter / union : 0;
}

/**
 * Build the real text layer, select across it, and report both what the browser
 * selected and where the selectable boxes sit. The box positions are what makes
 * the rotation check meaningful: text placed without the page rotation would
 * land somewhere other than the ink.
 */
async function selectionAndPlacement(outputBytes, pageNo, scale = 1.5) {
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  const { canvas, ctx, page, viewport } = await renderToCanvas(outputBytes, pageNo, scale);
  stage.style.width = canvas.width + 'px';
  stage.style.height = canvas.height + 'px';
  stage.appendChild(canvas);

  const container = document.createElement('div');
  container.className = 'textLayer';
  container.style.width = canvas.width + 'px';
  container.style.height = canvas.height + 'px';
  stage.appendChild(container);

  const layer = new TextLayer({ textContentSource: await page.getTextContent(), container, viewport });
  await layer.render();

  const spans = [...container.querySelectorAll('span')].filter((s) => s.textContent.trim());
  if (!spans.length) return { selectable: false, spans: 0, selectedChars: 0, textBox: null, inkBox: null, iou: 0 };

  const range = document.createRange();
  range.setStartBefore(spans[0]);
  range.setEndAfter(spans[spans.length - 1]);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  const selected = sel.toString();
  sel.removeAllRanges();

  // Measure placement from the text items' own matrices rather than from the
  // rendered spans: this is exactly what the pipeline wrote, with nothing from
  // the text-layer renderer in between.
  const content = await page.getTextContent();
  let tb = null;
  const samples = [];
  for (const item of content.items) {
    if (!item.str || !item.str.trim() || !item.transform) continue;
    const [a, b, , , e, f] = item.transform;
    const [px, py] = viewport.convertToViewportPoint(e, f);
    // Advance along the run's own direction, then to the far end of it.
    const angle = Math.atan2(b, a);
    const [qx, qy] = viewport.convertToViewportPoint(
      e + Math.cos(angle) * (item.width ?? 0),
      f + Math.sin(angle) * (item.width ?? 0),
    );
    const box = {
      x0: Math.min(px, qx), y0: Math.min(py, qy),
      x1: Math.max(px, qx), y1: Math.max(py, qy),
    };
    tb = tb ? { x0: Math.min(tb.x0, box.x0), y0: Math.min(tb.y0, box.y0), x1: Math.max(tb.x1, box.x1), y1: Math.max(tb.y1, box.y1) } : box;
    if (samples.length < 3) {
      samples.push({ str: item.str.slice(0, 12), angleDeg: Math.round(angle * 180 / Math.PI), device: [Math.round(px), Math.round(py)] });
    }
  }
  const ib = inkBox(ctx, canvas.width, canvas.height);

  // Containment, not IoU: the ink box also holds the drawing border, so a
  // correctly placed text layer is a subset of it, never the same size.
  let contained = 0;
  if (tb && ib) {
    const ix0 = Math.max(tb.x0, ib.x0), iy0 = Math.max(tb.y0, ib.y0);
    const ix1 = Math.min(tb.x1, ib.x1), iy1 = Math.min(tb.y1, ib.y1);
    const inter = Math.max(0, ix1 - ix0) * Math.max(0, iy1 - iy0);
    const area = Math.max(1, (tb.x1 - tb.x0) * (tb.y1 - tb.y0));
    contained = inter / area;
  }

  return {
    selectable: selected.replace(/\s/g, '').length > 0,
    spans: spans.length,
    selectedChars: selected.replace(/\s/g, '').length,
    selectedSample: selected.replace(/\s+/g, ' ').trim().slice(0, 160),
    textBox: tb,
    inkBox: ib,
    iou: +iou(tb, ib).toFixed(3),
    containedInInk: +contained.toFixed(3),
    samples,
  };
}

async function extractText(bytes) {
  const doc = await pdfjsLib.getDocument({ data: new Uint8Array(bytes) }).promise;
  const out = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const tc = await (await doc.getPage(i)).getTextContent();
    out.push(tc.items.map((it) => it.str ?? '').join(''));
  }
  return out;
}

const fetchFixture = (name) => fetch(`/test-fixtures/${name}`).then((r) => {
  if (!r.ok) throw new Error(`fixture ${name}: HTTP ${r.status}`);
  return r.arrayBuffer();
});

window.__smoke = {
  async classify(name) {
    const bytes = await fetchFixture(name);
    const doc = await pdfjsLib.getDocument({ data: new Uint8Array(bytes) }).promise;
    return classifyDocument(doc);
  },

  async run(name, checkPage = 1) {
    log(`running ${name}`);
    const input = await fetchFixture(name);
    const events = [];
    const result = await textifyPdf(input.slice(0), { onProgress: (e) => events.push(e.phase) });
    const extracted = await extractText(result.bytes);
    const appearance = await compareAppearance(input.slice(0), result.bytes, checkPage);
    const placement = await selectionAndPlacement(result.bytes, checkPage);
    log(`done ${name}`);
    return {
      name,
      pages: result.pages,
      fontEmbedded: result.fontEmbedded,
      inputBytes: result.inputBytes,
      outputBytes: result.outputBytes,
      totalMs: result.totalMs,
      extracted,
      appearance,
      placement,
      phases: [...new Set(events)],
    };
  },

  async cancelProbe(name) {
    const input = await fetchFixture(name);
    let seen = 0;
    try {
      await textifyPdf(input, {
        onProgress: (e) => { if (e.phase === 'ocr-page') seen++; },
        shouldCancel: () => seen >= 1,
      });
      return { threw: false, code: null, pagesStarted: seen };
    } catch (error) {
      return {
        threw: true,
        code: error instanceof TextifyError ? error.code : null,
        message: error?.message ?? String(error),
        pagesStarted: seen,
      };
    }
  },

  ready: true,
};
log('ready');
</script>
</body>
</html>
