<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>M7-P2-B2 harness</title>
    <style>
        /* The viewer's pane as the workspace sizes it: a fixed box, so a render never resizes it. */
        .ds-viewer { display: flex; flex-direction: column; height: 100%; }
        .ds-viewer-pane { position: relative; flex: 1; min-height: 0; overflow: auto; }
    </style>

<body>
    <p id="state">loading</p>
    <!--
        Drives the Production M7-P2-B2 modules -- the preview owner's page
        sections and release (W0), the crop service, the session store's
        commands, operation lock and confirmation evidence -- in a real
        browser, through the Vite dev server, for scripts/smoke-m7-p1.mjs
        (scripts/smoke-m7-p2b2-checks.mjs). Every function returns plain data;
        the Node side decides what passes. Synthetic fixtures only.

        Delays are deferreds the harness settles itself, and the release
        deadline is the owner's test seam, fired by hand: nothing here waits
        on a timer to decide an outcome.
    -->
    <script>
        // Before any module runs: count Workers by kind, canvases made, and
        // every storage write, object URL and canvas export.
        (() => {
            const counts = { pdf: { started: 0, ended: 0, live: 0, peak: 0 }, ocr: { started: 0, ended: 0, live: 0, peak: 0 }, other: { started: 0, ended: 0, live: 0, peak: 0 } };
            const kindOf = (url) => (/pdf\.worker/.test(url) ? 'pdf' : /\/ocr\//.test(url) ? 'ocr' : 'other');
            const NativeWorker = window.Worker;
            window.Worker = class extends NativeWorker {
                constructor(url, options) {
                    super(url, options);
                    this.__kind = kindOf(String(url));
                    const c = counts[this.__kind];
                    c.started += 1;
                    c.live += 1;
                    c.peak = Math.max(c.peak, c.live);
                }
                terminate() {
                    if (!this.__ended) {
                        this.__ended = true;
                        const c = counts[this.__kind];
                        c.ended += 1;
                        c.live -= 1;
                    }
                    super.terminate();
                }
            };
            window.__workers = counts;
            const canvases = { made: 0, list: [] };
            const create = Document.prototype.createElement;
            Document.prototype.createElement = function (name, ...rest) {
                const element = create.call(this, name, ...rest);
                if (String(name).toLowerCase() === 'canvas') {
                    canvases.made += 1;
                    canvases.list.push(element);
                    if (canvases.list.length > 64) canvases.list.shift();
                }
                return element;
            };
            window.__canvases = canvases;
            const exports = { toDataURL: 0, toBlob: 0 };
            for (const name of ['toDataURL', 'toBlob']) {
                const original = HTMLCanvasElement.prototype[name];
                HTMLCanvasElement.prototype[name] = function (...args) {
                    exports[name] += 1;
                    return original.apply(this, args);
                };
            }
            window.__exports = exports;
            const storage = { writes: 0, calls: [] };
            for (const name of ['setItem', 'removeItem', 'clear']) {
                const original = Storage.prototype[name];
                Storage.prototype[name] = function (...args) {
                    storage.writes += 1;
                    storage.calls.push(`Storage.${name}`);
                    return original.apply(this, args);
                };
            }
            for (const name of ['open', 'deleteDatabase']) {
                const original = indexedDB[name].bind(indexedDB);
                indexedDB[name] = (...args) => {
                    storage.writes += 1;
                    storage.calls.push(`indexedDB.${name}`);
                    return original(...args);
                };
            }
            if (window.caches) {
                const original = caches.open.bind(caches);
                caches.open = (...args) => {
                    storage.writes += 1;
                    storage.calls.push('caches.open');
                    return original(...args);
                };
            }
            window.__storage = storage;
            const urls = new Set();
            const createUrl = URL.createObjectURL.bind(URL);
            const revokeUrl = URL.revokeObjectURL.bind(URL);
            URL.createObjectURL = (o) => { const u = createUrl(o); urls.add(u); return u; };
            URL.revokeObjectURL = (u) => { urls.delete(u); return revokeUrl(u); };
            window.__objectUrls = urls;
        })();
    </script>
    <script type="module">
        import * as pdfjsLib from 'pdfjs-dist';
        import { StrictMode, createElement } from 'react';
        import { createRoot } from 'react-dom/client';
        import { configurePdfWorker } from '/src/utils/pdf-worker-source.ts';
        import { renderRegion } from '/src/utils/pdf-textifier/drawing-register-geometry.ts';
        import { PreviewDocumentOwner, RELEASE_DEADLINE_MS } from '/src/utils/drawing-set/preview-document.ts';
        import { PdfDocumentGate } from '/src/utils/drawing-set/pdf-document-gate.ts';
        import { m7PdfDocumentAssets } from '/src/utils/drawing-set/pdf-document-assets.ts';
        import { readFileDigest } from '/src/utils/drawing-set/file-evidence.ts';
        import { verifyHeldFile, RuntimeBindingLedger, observationCurrency, currencyLabel } from '/src/utils/drawing-set/currency.ts';
        import { CROP_LIMITS, planCrop } from '/src/utils/drawing-set/crop-service.ts';
        import { GuardedRegisterOcr } from '/src/utils/drawing-set/register-extraction.ts';
        import { DrawingSetStore, EvidenceHandle } from '/src/utils/drawing-set/workspace-store.ts';
        import { ReadOnlySheetViewer } from '/src/components/drawing-set/ReadOnlySheetViewer.tsx';
        import { PAGE_PREVIEW_OWNER } from '/src/utils/drawing-set/page-documents.ts';
        import { dragToUpright, uprightSize, uprightToScreen } from '/src/utils/drawing-set/profile-pointer.ts';

        const P1 = '/test-fixtures/m7-p1';
        const P2A = '/test-fixtures/m7-p2a';
        const FIELDS = ['drawingNumber', 'drawingTitle', 'revision', 'issueDate'];
        const plainly = (value) => JSON.parse(JSON.stringify(value ?? null));
        const workers = () => plainly(window.__workers);
        const settle = (promise) => promise.then((value) => ({ ok: true, value }), (error) => ({ ok: false, code: error?.code ?? error?.name ?? String(error) }));
        const tick = () => new Promise((resolve) => setTimeout(resolve, 0));
        const frames = (n = 2) => new Promise((resolve) => {
            const step = (left) => (left === 0 ? resolve() : requestAnimationFrame(() => step(left - 1)));
            step(n);
        });
        function defer() {
            let resolve;
            let reject;
            const promise = new Promise((res, rej) => { resolve = res; reject = rej; });
            return { promise, resolve, reject };
        }
        /** Wait for a condition the harness itself will make true; fails loudly rather than hanging. */
        async function until(test, what, limitMs = 20000) {
            const t0 = performance.now();
            while (!test()) {
                if (performance.now() - t0 > limitMs) throw new Error(`timed out waiting for ${what}`);
                await new Promise((resolve) => setTimeout(resolve, 5));
            }
        }

        async function fixtureBytes(dir, name) {
            const response = await fetch(`${dir}/${name}.pdf`);
            const type = response.headers.get('content-type') || '';
            if (!response.ok || type.includes('text/html')) throw new Error(`fixture ${name} missing (the dev server fell back to HTML)`);
            return new Uint8Array(await response.arrayBuffer());
        }
        const fileOf = (bytes, name) => new File([bytes], name, { type: '' });
        async function sha256Hex(bytes) {
            const digest = await crypto.subtle.digest('SHA-256', bytes);
            return [...new Uint8Array(digest)].map((b) => b.toString(16).padStart(2, '0')).join('');
        }
        async function fixture(dir, name) {
            const bytes = await fixtureBytes(dir, name);
            return { bytes, file: fileOf(bytes, `${name}.pdf`), expected: { sha256: await sha256Hex(bytes), byteLength: bytes.byteLength } };
        }
        async function canvasDigest(canvas) {
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            return sha256Hex(data);
        }
        function darkCount(canvas) {
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            let dark = 0;
            for (let i = 0; i < data.length; i += 4) if (0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2] < 128) dark += 1;
            return dark;
        }

        /** An upright rectangle as it lies on the page turned clockwise by `rotate`. */
        function displayRect(r, rotate, W, H) {
            switch (((rotate % 360) + 360) % 360) {
                case 90: return { left: H - r.bottom, right: H - r.top, top: r.left, bottom: r.right };
                case 180: return { left: W - r.right, right: W - r.left, top: H - r.bottom, bottom: H - r.top };
                case 270: return { left: r.top, right: r.bottom, top: W - r.right, bottom: W - r.left };
                default: return { ...r };
            }
        }
        /** A copy of a canvas turned clockwise by a multiple of 90 degrees. */
        function turned(source, rotate) {
            const r = ((rotate % 360) + 360) % 360;
            const quarter = r % 180 === 90;
            const out = document.createElement('canvas');
            out.width = quarter ? source.height : source.width;
            out.height = quarter ? source.width : source.height;
            const ctx = out.getContext('2d', { willReadFrequently: true });
            ctx.translate(out.width / 2, out.height / 2);
            ctx.rotate((r * Math.PI) / 180);
            ctx.drawImage(source, -source.width / 2, -source.height / 2);
            return out;
        }
        /**
         * How alike two canvases look at a coarse scale: the correlation of
         * their ink density over 8 px blocks, across the area they share.
         * Rasterising through a rotation moves strokes by a pixel or so, so
         * pixels are not compared one by one; the layout is.
         */
        function agreement(a, b) {
            const w = Math.min(a.width, b.width);
            const h = Math.min(a.height, b.height);
            const B = 8;
            const cols = Math.floor(w / B);
            const rows = Math.floor(h / B);
            if (cols === 0 || rows === 0) return 0;
            const density = (canvas) => {
                const data = canvas.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, cols * B, rows * B).data;
                const grid = new Float64Array(cols * rows);
                for (let y = 0; y < rows * B; y++) {
                    for (let x = 0; x < cols * B; x++) {
                        const i = (y * cols * B + x) * 4;
                        if (0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2] < 128) grid[Math.floor(y / B) * cols + Math.floor(x / B)] += 1;
                    }
                }
                return grid;
            };
            const ga = density(a);
            const gb = density(b);
            a.width = 0;
            const mean = (g) => g.reduce((s, v) => s + v, 0) / g.length;
            const ma = mean(ga);
            const mb = mean(gb);
            let num = 0;
            let va = 0;
            let vb = 0;
            for (let i = 0; i < ga.length; i++) {
                num += (ga[i] - ma) * (gb[i] - mb);
                va += (ga[i] - ma) ** 2;
                vb += (gb[i] - mb) ** 2;
            }
            return va === 0 || vb === 0 ? (va === vb ? 1 : 0) : num / Math.sqrt(va * vb);
        }

        /**
         * A gate and an owner with the test seams: page requests through
         * `pages(doc, n)` (the document's own by default), every one logged,
         * and the release deadline armed into `deadlines` for the test to
         * fire by hand.
         */
        function rig(pages = null) {
            const gate = new PdfDocumentGate();
            const log = [];
            const deadlines = [];
            const pageRequests = [];
            const owner = new PreviewDocumentOwner({
                gate,
                pageSource: (doc, n) => {
                    pageRequests.push(n);
                    log.push(`page-asked:${n}`);
                    return pages ? pages(doc, n, log) : doc.getPage(n);
                },
                releaseDeadline: (expire) => {
                    const armed = { expire, disarmed: false };
                    deadlines.push(armed);
                    return () => { armed.disarmed = true; };
                },
            });
            return { gate, owner, log, deadlines, pageRequests };
        }

        /** Log a document's destruction, and let the test hold it, fail it, or never finish it. */
        function watchDestroy(doc, log, mode = {}) {
            const task = doc.loadingTask;
            const real = task.destroy.bind(task);
            const control = { real, hold: null };
            task.destroy = () => {
                log.push('destroy-asked');
                if (mode.fail) return Promise.reject(new Error('simulated destroy failure'));
                if (mode.never) return new Promise(() => { });
                if (mode.hold) {
                    control.hold = defer();
                    return control.hold.promise.then(() => real()).then(() => { log.push('destroy-done'); });
                }
                return real().then(() => { log.push('destroy-done'); });
            };
            return control;
        }

        /**
         * A real page whose renders pause at their first step until the test
         * lets them go (PDF.js's own onContinue hook), and whose renders and
         * cleanups are logged. `cleanup` can be made to report false, or to throw.
         */
        function instrumentPage(page, log, options = {}) {
            if (page.__instrumented) {
                page.__options = options;
                return page;
            }
            page.__instrumented = true;
            page.__options = options;
            page.__held = [];
            const realRender = page.render.bind(page);
            const realCleanup = page.cleanup.bind(page);
            const realGetViewport = page.getViewport.bind(page);
            page.render = (params) => {
                const opts = page.__options;
                if (opts.renderFails) {
                    log.push('render-start');
                    return { promise: Promise.reject(new Error('simulated render failure')), cancel: () => { } };
                }
                const task = realRender(params);
                log.push('render-start');
                page.__lastCanvas = params.canvas;
                if (opts.hold) {
                    task.onContinue = (next) => { page.__held.push(next); opts.onHeld?.(); };
                }
                task.promise.then(() => log.push('render-done'), (e) => log.push(`render-${e?.name ?? 'error'}`));
                return task;
            };
            page.cleanup = (...args) => {
                const opts = page.__options;
                if (opts.cleanupThrows) {
                    log.push('cleanup-threw');
                    throw new Error('simulated cleanup failure');
                }
                const result = realCleanup(...args);
                const reported = opts.cleanupFalse ? false : result;
                log.push(`cleanup:${reported}`);
                return reported;
            };
            page.getViewport = (params) => {
                (page.__viewports ??= []).push({ scale: params?.scale, rotation: params?.rotation });
                const viewport = realGetViewport(params);
                const shrink = page.__options.shrinkBaseAfter;
                if (shrink !== undefined && params?.scale === 1 && page.__viewports.filter((v) => v.scale === 1).length > shrink) {
                    return { ...viewport, width: viewport.width - 120, height: viewport.height };
                }
                return viewport;
            };
            return page;
        }
        const releaseHeld = (page) => { for (const next of page.__held.splice(0)) next(); };

        async function openDoc(bytes) {
            configurePdfWorker();
            const task = pdfjsLib.getDocument({ data: bytes.slice(), isEvalSupported: false, ...m7PdfDocumentAssets() });
            return { task, doc: await task.promise };
        }

        const lastRecord = (owner) => owner.releaseRecords().at(-1) ?? null;
        const gateRefusals = async (gate, owner, other) => {
            const intake = gate.beginIntake();
            if (intake.ok) intake.end();
            const extraction = await gate.beginExtraction();
            if (extraction.ok) extraction.lease.end();
            const open = await settle(owner.open('Z', other.file, other.expected));
            return { intake: intake.ok ? 'ok' : intake.code, extraction: extraction.ok ? 'ok' : extraction.code, open: open.ok ? 'opened' : open.code };
        };

        // ================================================================ W0: the owner

        async function ownerRelease() {
            const geometry = await fixture(P2A, 'p2a-geometry');
            const other = await fixture(P1, 'p1-native-a');
            const third = await fixture(P1, 'p1-second-c');
            const out = {};
            const wholeRect = { left: 0, top: 0, right: 800, bottom: 580 };

            // N-A1 / N-A13.2-3: a crop render running when the document closes.
            {
                const r = rig((doc, n, log) => doc.getPage(n).then((p) => instrumentPage(p, log, { hold: true })));
                const doc = await r.owner.open('A', geometry.file, geometry.expected);
                watchDestroy(doc, r.log);
                let cropError = null;
                let ranRender = 0;
                const started = defer();
                const section = r.owner.withPage(doc, 1, async (page) => {
                    const counting = new Proxy(page, { get(t, p) { if (p === 'render') ranRender += 1; return t[p]; } });
                    const go = renderRegion(counting, wholeRect, { dpi: 300 });
                    started.resolve();
                    try {
                        return await go;
                    } catch (error) {
                        cropError = error?.name ?? String(error);
                        throw error;
                    }
                });
                // Settled later; marked handled now, so a rejection meanwhile is not reported as unhandled.
                section.catch(() => { });
                await started.promise;
                await until(() => r.log.includes('render-start'), 'the crop render to start');
                const madeBefore = window.__canvases.list.at(-1);
                const beforeClose = { destroy: lastRecord(r.owner)?.destroy ?? 'none' };
                const closing = r.owner.close();
                const atClose = { destroyAsked: r.log.includes('destroy-asked'), steps: lastRecord(r.owner).steps.slice() };
                await closing;
                const outcome = await settle(section);
                const record = lastRecord(r.owner);
                const order = r.log.filter((e) => e.startsWith('render-') || e.startsWith('cleanup') || e.startsWith('destroy'));
                out.NA1 = {
                    beforeClose, atClose, outcome, cropError, ranRender, order, record,
                    canvasZeroed: madeBefore ? madeBefore.width === 0 && madeBefore.height === 0 : null,
                    canvasWasTheRendered: madeBefore !== undefined,
                    counts: r.owner.counts(), deadlineDisarmed: r.deadlines.every((d) => d.disarmed), unconfirmed: r.gate.releaseUnconfirmed,
                };
            }

            // N-A2 / N-A2b / N-A2c: a page request that does not settle.
            for (const variant of ['never', 'rejectBeforeDestroy', 'resolveBeforeDestroy']) {
                const pending = defer();
                const r = rig(() => pending.promise);
                const doc = await r.owner.open('A', geometry.file, geometry.expected);
                const realPage = variant === 'resolveBeforeDestroy' ? await doc.getPage(1) : null;
                const destroy = watchDestroy(doc, r.log, { hold: variant !== 'never' });
                let runCalls = 0;
                const section = r.owner.withPage(doc, 1, async () => { runCalls += 1; });
                // Settled later; marked handled now, so a rejection meanwhile is not reported as unhandled.
                section.catch(() => { });
                await until(() => r.pageRequests.length === 1, 'the page request');
                const closing = r.owner.close();
                if (variant !== 'never') {
                    await until(() => r.log.includes('destroy-asked'), 'the destruction to be asked for');
                    if (variant === 'rejectBeforeDestroy') pending.reject(new Error('Transport destroyed'));
                    else pending.resolve(realPage);
                    await tick();
                    destroy.hold.resolve();
                }
                const closed = await Promise.race([closing.then(() => 'resolved'), new Promise((resolve) => setTimeout(() => resolve('still waiting'), 15000))]);
                const sectionOutcome = await settle(section);
                const record = lastRecord(r.owner);
                const after = await gateRefusals(r.gate, r.owner, other);
                out[`NA2_${variant}`] = { closed, sectionOutcome, runCalls, record, unconfirmed: r.gate.releaseUnconfirmed, after, counts: r.owner.counts() };
                if (variant === 'never') pending.reject(new Error('released by the harness'));
                await r.owner.close();
            }

            // N-A3: sections waiting when the document closes never ask for a page.
            {
                const r = rig();
                const doc = await r.owner.open('A', geometry.file, geometry.expected);
                watchDestroy(doc, r.log);
                const hold = defer();
                const entered = defer();
                const first = r.owner.withPage(doc, 1, async () => { entered.resolve(); await hold.promise; });
                // Settled later; marked handled now, so a rejection meanwhile is not reported as unhandled.
                first.catch(() => { });
                const second = r.owner.withPage(doc, 2, async () => 'second');
                // Settled later; marked handled now, so a rejection meanwhile is not reported as unhandled.
                second.catch(() => { });
                const third_ = r.owner.withPage(doc, 3, async () => 'third');
                // Settled later; marked handled now, so a rejection meanwhile is not reported as unhandled.
                third_.catch(() => { });
                await entered.promise;
                const closing = r.owner.close();
                const waitingOutcomes = await Promise.all([settle(second), settle(third_)]);
                await tick();
                const whileRunning = { destroyAsked: r.log.includes('destroy-asked'), destroy: lastRecord(r.owner).destroy };
                hold.resolve();
                await closing;
                out.NA3 = {
                    waitingOutcomes, pageRequests: r.pageRequests.slice(), whileRunning, first: await settle(first), record: lastRecord(r.owner),
                    counts: r.owner.counts(),
                };
            }

            // N-A4: switching Source while a crop runs -- A drained and destroyed before B is read.
            {
                const r = rig((doc, n, log) => doc.getPage(n).then((p) => instrumentPage(p, log, { hold: true })));
                const doc = await r.owner.open('A', geometry.file, geometry.expected);
                watchDestroy(doc, r.log);
                const section = r.owner.withPage(doc, 1, (page) => renderRegion(page, wholeRect, { dpi: 300 }));
                // Settled later; marked handled now, so a rejection meanwhile is not reported as unhandled.
                section.catch(() => { });
                await until(() => r.log.includes('render-start'), 'the crop render');
                const docB = await r.owner.open('B', other.file, other.expected, { beginRead: () => r.log.push('B-read-begins') });
                await settle(section);
                out.NA4 = { order: r.log.filter((e) => /^(render-|cleanup|destroy|B-read)/.test(e)), bPages: docB.numPages, record: r.owner.releaseRecords()[0] };
                await r.owner.close();
            }

            // N-A6: extraction asked for while a crop runs -- the lease only after drain and destruction.
            {
                const r = rig((doc, n, log) => doc.getPage(n).then((p) => instrumentPage(p, log, { hold: true })));
                const doc = await r.owner.open('A', geometry.file, geometry.expected);
                watchDestroy(doc, r.log);
                const section = r.owner.withPage(doc, 1, (page) => renderRegion(page, wholeRect, { dpi: 300 }));
                // Settled later; marked handled now, so a rejection meanwhile is not reported as unhandled.
                section.catch(() => { });
                await until(() => r.log.includes('render-start'), 'the crop render');
                const begun = await r.gate.beginExtraction();
                const atLease = { ok: begun.ok, previewLive: r.owner.counts().live, record: lastRecord(r.owner), log: r.log.slice() };
                if (begun.ok) begun.lease.end();
                out.NA6 = { atLease, section: await settle(section), extractionActive: r.gate.extractionActive };
            }

            // N-A7: the destruction fails after the drain.
            {
                const r = rig((doc, n, log) => doc.getPage(n).then((p) => instrumentPage(p, log, { hold: true })));
                const doc = await r.owner.open('A', geometry.file, geometry.expected);
                const control = watchDestroy(doc, r.log, { fail: true });
                r.owner.withPage(doc, 1, (page) => renderRegion(page, wholeRect, { dpi: 300 })).catch(() => { });
                await until(() => r.log.includes('render-start'), 'the crop render');
                await r.owner.close();
                const record = lastRecord(r.owner);
                const sectionAfter = await settle(r.owner.withPage(doc, 1, async () => 'never'));
                const after = await gateRefusals(r.gate, r.owner, other);
                out.NA7 = { record, sectionAfter, after, unconfirmed: r.gate.releaseUnconfirmed, documentsUnavailable: r.owner.documentsUnavailable };
                await control.real();
            }

            // N-A9 / N-A13.1 / N-A13.4: the page a section is handed, against the real page.
            {
                const r = rig();
                const doc = await r.owner.open('A', geometry.file, geometry.expected);
                const rect = { left: 560, top: 440, right: 780, bottom: 480 };
                const accessed = new Set();
                let handedPage = null;
                const viaSection = await r.owner.withPage(doc, 1, async (page) => {
                    handedPage = page;
                    const spy = new Proxy(page, { get(t, p) { accessed.add(String(p)); return t[p]; } });
                    const region = await renderRegion(spy, rect, { dpi: 300 });
                    return { width: region.width, height: region.height, digest: await canvasDigest(region.canvas) };
                });
                const { task, doc: oracleDoc } = await openDoc(geometry.bytes);
                const oraclePage = await oracleDoc.getPage(1);
                const oracleRegion = await renderRegion(oraclePage, rect, { dpi: 300 });
                const oracle = { width: oracleRegion.width, height: oracleRegion.height, digest: await canvasDigest(oracleRegion.canvas) };
                await task.destroy();

                const canvasesBefore = window.__canvases.made;
                const again = await s.prepare(R);
                out.NC4 = {
                    revised: revised.ok, result: s.confirm(R, handle), prepareAfter: again.ok ? 'issued' : again.refusal.code,
                    canvasesMade: window.__canvases.made - canvasesBefore, currency: currencyLabel(observationCurrency(store.currentSet(), s.sheet(R), ledger)),
                };
                // Read again under the new revision, so the rest runs on CURRENT observations.
                await store.extract({ sheetIds: [R, ...s.geometrySheets] });
                s.profile.fields = store.currentSet().titleBlockProfiles.find((p) => p.id === s.profile.id).fields;
            }
            // N-C9: a look-alike handle, one made with the prototype, one forged, one from another store.
            {
                await fresh();
                const lookalike = { sheetId: R };
                const prototyped = Object.create(EvidenceHandle.prototype);
                let forged = 'not thrown';
                try { new EvidenceHandle(Symbol('evidence'), R); } catch (error) { forged = error?.name ?? 'threw'; }
                const t = await observedStore();
                const theirs = await t.prepare(t.register1);
                out.NC9 = {
                    lookalike: s.confirm(R, lookalike), prototyped: s.confirm(R, prototyped), forged,
                    anotherStores: theirs.ok ? s.confirm(R, theirs.handle) : { ok: false, code: `prepare ${theirs.refusal.code}` },
                };
                await t.dispose();
            }
            // N-C10 / N-C11: a crop hidden, sized to nothing, or taken out of the page.
            {
                const handle = await fresh();
                s.slots.revision.querySelector('canvas').style.visibility = 'hidden';
                out.NC10_hidden = s.confirm(R, handle);
                const handle2 = await fresh();
                s.slots.issueDate.querySelector('canvas').style.opacity = '0';
                out.NC10_transparent = s.confirm(R, handle2);
                const handle3 = await fresh();
                s.slots.drawingTitle.querySelector('canvas').remove();
                out.NC11_removed = s.confirm(R, handle3);
            }
            // N-C13: the Source's File went missing, and the same bytes were chosen again (another presentation).
            {
                const handle = await fresh();
                const gone = await store.verifyFile(sourceId).then(() => {
                    ledger.present(store.currentSet(), sourceId, null);
                    return store.bindingOf(sourceId);
                });
                const back = await restoreBinding();
                out.NC13 = { gone, back, binding: store.bindingOf(sourceId), result: s.confirm(R, handle) };
            }
            // N-R12 / N-R13: each rotation and CropBox offset -- crops drawn upright at rotation 0, turned by CSS only, the size worked out beforehand.
            {
                const geometry = await fixture(P2A, 'p2a-geometry');
                const { task, doc: oracleDoc } = await openDoc(geometry.bytes);
                const rows = [];
                for (const id of s.geometrySheets) {
                    const sheet = s.sheet(id);
                    const result = await s.prepare(id);
                    if (!result.ok) {
                        rows.push({ page: sheet.pageNumber, refused: result.refusal.code });
                        continue;
                    }
                    const oraclePage = await oracleDoc.getPage(sheet.pageNumber);
                    const R = result.view.rotate;
                    const row = { page: sheet.pageNumber, rotate: R, factsRotate: sheet.pageFacts.rotate, pdfRotate: oraclePage.rotate, fields: {} };
                    const W = sheet.pageFacts.uprightWidthPt;
                    const H = sheet.pageFacts.uprightHeightPt;
                    for (const name of FIELDS) {
                        const canvas = s.slots[name].querySelector('canvas');
                        const rect = result.view.fields[name].rect;
                        const oracle = await renderRegion(oraclePage, rect, { dpi: 300 });
                        // As the viewer shows the page: the same field through the page's own /Rotate.
                        const shown = displayRect(rect, R, W, H);
                        const asDisplayed = await renderRegion(oraclePage, shown, { dpi: 300, rotation: R });
                        row.fields[name] = {
                            planned: [result.view.fields[name].width, result.view.fields[name].height],
                            drawn: [canvas.width, canvas.height],
                            sameAsOracle: (await canvasDigest(canvas)) === (await canvasDigest(oracle.canvas)),
                            transform: canvas.style.transform,
                            frame: [canvas.parentElement.style.width, canvas.parentElement.style.height],
                            dark: darkCount(canvas),
                            // How well the crop turned by its CSS rotation matches the page as displayed; and turned the wrong way, as a control.
                            likeDisplayed: agreement(turned(canvas, R), asDisplayed.canvas),
                            likeDisplayedWrongWay: agreement(turned(canvas, R + 180), asDisplayed.canvas),
                        };
                        oracle.canvas.width = 0;
                        asDisplayed.canvas.width = 0;
                    }
                    rows.push(row);
                }
                await task.destroy();
                out.NR12 = rows;
            }
            // N-R13 (injected): renderRegion's page box differs from the one the plan used -- the sizes disagree.
            {
                const t = await observedStore({ pages: (doc, n, log) => doc.getPage(n).then((p) => instrumentPage(p, log, { shrinkBaseAfter: 1 })) });
                const result = await t.prepare(t.register1);
                out.NR13_injected = { ok: result.ok, code: result.ok ? null : result.refusal.code, inSlots: FIELDS.filter((n) => t.slots[n].querySelector('canvas')).length };
                await t.dispose();
            }
            // N-R3: rectangles past each limit -- refused before any canvas exists.
            {
                // Through the whole path: a field over 4,000,000 px on a real page.
                const big = store.createProfile({ name: 'big-field', transferModel: 'corner-anchored', referencePage: { uprightWidthPt: 800, uprightHeightPt: 580 }, fields: { ...s.profile.fields, drawingTitle: { left: 0, top: 0, right: 800, bottom: 580 } } });
                const sheetId = s.geometrySheets[0];
                let pipeline = { created: big.ok ? 'ok' : big.refusal.code };
                if (big.ok) {
                    store.assignProfile([sheetId], big.profile.id, { replace: true });
                    const run = await store.extract({ sheetIds: [sheetId] });
                    const plan = planCrop(store.currentSet().titleBlockProfiles.find((p) => p.id === big.profile.id), { width: 800, height: 580 });
                    const canvasesBefore = window.__canvases.made;
                    const renderedBefore = s.r.owner.counts().renderStarted;
                    const result = await s.prepare(sheetId);
                    pipeline = {
                        run: run.report.kind === 'finished' ? run.report.outcome : run.report.refusal.code,
                        plan: plan.exceeds, title: plan.fields.drawingTitle, code: result.ok ? 'issued' : result.refusal.code,
                        canvasesMade: window.__canvases.made - canvasesBefore, rendersStarted: s.r.owner.counts().renderStarted - renderedBefore,
                        inSlots: FIELDS.filter((n) => s.slots[n].querySelector('canvas')).length,
                    };
                    store.assignProfile([sheetId], s.profile.id, { replace: true });
                }
                // Each limit on its own, as planned (no canvas is made by planning).
                const at = (fields, upright) => planCrop({ ...s.profile, referencePage: { uprightWidthPt: upright.width, uprightHeightPt: upright.height }, fields }, upright);
                const small = s.profile.fields;
                const canvasesBefore = window.__canvases.made;
                const side = at({ ...small, drawingTitle: { left: 0, top: 100, right: 1970, bottom: 110 } }, { width: 14400, height: 14400 });
                const sideOk = at({ ...small, drawingTitle: { left: 0, top: 100, right: 1966, bottom: 110 } }, { width: 14400, height: 14400 });
                const field = at({ ...small, drawingTitle: { left: 0, top: 0, right: 480, bottom: 481 } }, { width: 14400, height: 14400 });
                const fieldOk = at({ ...small, drawingTitle: { left: 0, top: 0, right: 479, bottom: 479 } }, { width: 14400, height: 14400 });
                const fourAtLimit = at(Object.fromEntries(FIELDS.map((n) => [n, { left: 0, top: 0, right: 479, bottom: 479 }])), { width: 800, height: 580 });
                const summary = (p) => ({ exceeds: p.exceeds, title: [p.fields.drawingTitle.width, p.fields.drawingTitle.height], total: p.totalPixels });
                out.NR3 = {
                    pipeline, constants: CROP_LIMITS,
                    side: summary(side), sideOk: summary(sideOk), field: summary(field), fieldOk: summary(fieldOk), fourAtLimit: summary(fourAtLimit),
                    planningMadeCanvases: window.__canvases.made - canvasesBefore,
                };
            }
            // N-C16: an OCR_FAILED reading confirmed with values typed in -- still needs its crops; all four edited.
            {
                const sheetId = s.sheet(s.geometrySheets[1]).id;
                class FailingOcr extends GuardedRegisterOcr {
                    async recogniseFields() { throw new Error('simulated recognition failure'); }
                }
                const raster = await fixture(P2A, 'p2a-register');
                void raster;
                const regSheets = store.currentSet().sheets.filter((x) => x.sourceId === s.sheet(R).sourceId && x.retiredAt === null).sort((a, b) => a.pageNumber - b.pageNumber);
                const rasterSheet = regSheets[1].id;
                store.assignProfile([rasterSheet], s.profile.id, { replace: true });
                const run = await store.extract({ sheetIds: [rasterSheet] }, { createOcr: () => new FailingOcr() });
                const observed = s.sheet(rasterSheet).observation;
                const typed = { drawingNumber: 'A-102', drawingTitle: '2階平面図', revision: 'A', issueDate: '2026.09.01' };
                const without = store.confirmSheet({ sheetId: rasterSheet, values: typed, evidence: null });
                const handle = await s.prepare(rasterSheet);
                out.NC16 = {
                    run: run.report.kind === 'finished' ? run.report.outcome : run.report.refusal.code, status: observed?.status, sources: observed ? FIELDS.map((n) => observed.fields[n].source) : null,
                    without: without.ok ? 'confirmed' : without.refusal.code, withCrop: handle.ok ? s.confirm(rasterSheet, handle.handle, typed) : { ok: false, code: handle.refusal.code },
                };
                void sheetId;
            }
            // CROP_NOT_AVAILABLE (H-13): a Sheet with no profile has nothing to show the drawing of.
            {
                const unassigned = store.currentSet().sheets.find((x) => x.retiredAt === null && x.profileAssignment === null);
                const prepared = unassigned ? await store.prepareEvidence(unassigned.id, { panel: s.panel, slots: s.slots }) : null;
                const direct = unassigned ? store.confirmSheet({ sheetId: unassigned.id, values: { drawingNumber: 'X', drawingTitle: 'X', revision: 'X', issueDate: 'X' }, evidence: null }) : null;
                out.cropNotAvailable = { prepared: prepared?.ok ? 'issued' : prepared?.refusal.code, direct: direct?.ok ? 'confirmed' : direct?.refusal.code };
            }
            // Every confirmation this store made names its profile (N-C8).
            out.allConfirmationsHaveProfile = store.currentSet().sheets.flatMap((x) => [x.confirmation, ...x.confirmationHistory.map((h) => h.confirmation)]).filter(Boolean).every((c) => c.profile !== null);
            out.confirmationCount = store.currentSet().sheets.flatMap((x) => [x.confirmation, ...x.confirmationHistory.map((h) => h.confirmation)]).filter(Boolean).length;
            out.bulk = { confirmSheets: typeof store.confirmSheets, confirmAll: typeof store.confirmAll };
            await s.dispose();
            out.workers = workers();
            return plainly(out);
        }

        // N-A5 / N-A11: reset and leaving while crops are drawn, and an old session's page arriving late.
        async function sessions() {
            const out = {};
            for (const how of ['reset', 'leave']) {
                const hold = { page: null };
                const s = await observedStore({ pages: (doc, n, log) => doc.getPage(n).then((p) => { hold.page = instrumentPage(p, log, { hold: true }); return hold.page; }) });
                await s.openFor(s.register1);
                const versionBefore = store => store.getSnapshot().version;
                const pending = s.store.prepareEvidence(s.register1, { panel: s.panel, slots: s.slots });
                await until(() => s.r.log.includes('render-start'), 'the crop render');
                if (how === 'reset') s.store.reset();
                else s.store.leave();
                const result = await pending;
                await until(() => lastRecord(s.r.owner)?.outcome !== 'pending', 'the release');
                out[`NA5_${how}`] = {
                    result: result.ok ? 'issued' : result.refusal.code, record: lastRecord(s.r.owner), cropsInSlots: FIELDS.filter((n) => s.slots[n].querySelector('canvas')).length,
                    version: versionBefore(s.store),
                };
                await s.dispose();
            }
            {
                const stuck = defer();
                let held = false;
                const s = await observedStore({ pages: (doc, n) => (held ? stuck.promise : doc.getPage(n)) });
                await s.openFor(s.register1);
                held = true;
                const pending = s.store.prepareEvidence(s.register1, { panel: s.panel, slots: s.slots });
                await until(() => s.r.pageRequests.length > 0 && s.r.log.at(-1)?.startsWith('page-asked'), 'the held page request');
                s.store.reset();
                const result = await pending;
                const afterReset = { version: s.store.getSnapshot().version, generation: s.store.getSnapshot().evidenceGeneration };
                const late = await openDoc(await fixtureBytes(P2A, 'p2a-register'));
                stuck.resolve(await late.doc.getPage(1));
                await tick();
                await tick();
                await late.task.destroy();
                const afterLate = { version: s.store.getSnapshot().version, generation: s.store.getSnapshot().evidenceGeneration };
                out.NA11 = {
                    result: result.ok ? 'issued' : result.refusal.code, afterReset, afterLate, sheets: s.store.currentSet().sheets.length,
                    crops: FIELDS.filter((n) => s.slots[n].querySelector('canvas')).length, record: lastRecord(s.r.owner),
                };
                await s.dispose();
            }
            out.workers = workers();
            return plainly(out);
        }

        // ================================================================ the operation lock (B2-D02)

        async function lock() {
            const out = {};
            class HeldOcr extends GuardedRegisterOcr {
                constructor() {
                    super();
                    this.entered = defer();
                    this.gate = defer();
                }
                async recogniseFields(page, rects, options) {
                    await this.start();
                    this.entered.resolve();
                    await this.gate.promise;
                    return super.recogniseFields(page, rects, options);
                }
            }
            const s = await observedStore();
            const { store } = s;
            const regSheets = store.currentSet().sheets.filter((x) => x.sourceId === s.sheet(s.register1).sourceId && x.retiredAt === null).sort((a, b) => a.pageNumber - b.pageNumber);
            const raster = regSheets[1].id;
            store.assignProfile([raster], s.profile.id, { replace: true });
            const handle = (await s.prepare(s.register1));
            const ocr = new HeldOcr();
            const progressSeen = [];
            const running = store.extract({ sheetIds: [raster] }, { createOcr: () => ocr, onProgress: (event) => progressSeen.push(event.phase) });
            const atStart = { operation: plainly(store.getSnapshot().operation) };
            await ocr.entered.promise;
            const setBefore = store.currentSet();
            const tryAll = {
                createProfile: store.createProfile({ name: 'Q', transferModel: 'normalised', referencePage: { uprightWidthPt: 800, uprightHeightPt: 580 }, fields: s.profile.fields }),
                renameProfile: store.renameProfile(s.profile.id, 'P2'),
                reviseProfile: store.reviseProfile(s.profile.id, { transferModel: 'corner-anchored' }),
                retireProfile: store.retireProfile(s.profile.id),
                assign: store.assignProfile([regSheets[2].id], s.profile.id),
                unassign: store.unassignProfile([s.register1]),
                confirm: handle.ok ? store.confirmSheet({ sheetId: s.register1, values: s.valuesOf(s.register1), evidence: handle.handle }) : { ok: false, refusal: { code: `prepare ${handle.refusal.code}` } },
                withdraw: store.withdrawConfirmation(s.register1),
                removeSource: store.removeSource(s.sheet(s.register1).sourceId),
                verifyFile: await store.verifyFile(s.sheet(s.register1).sourceId),
                intake: await store.intake(fileOf(await fixtureBytes(P1, 'p1-second-c'), 'p1-second-c.pdf')),
                extract: await store.extract({ sheetIds: [s.register1] }),
                prepareEvidence: await store.prepareEvidence(s.register1, { panel: s.panel, slots: s.slots }),
            };
            const codeOf = (r) => (r?.ok === false ? r.refusal?.code ?? r.code : r?.kind === 'refused' ? r.refusal.code : r?.report?.kind === 'refused' ? r.report.refusal.code : r?.code ?? (r?.ok ? 'ok' : 'unknown'));
            out.during = Object.fromEntries(Object.entries(tryAll).map(([k, v]) => [k, codeOf(v)]));
            out.modelUntouched = store.currentSet() === setBefore;
            out.gateStillRefuses = { intake: (() => { const i = s.r.gate.beginIntake(); if (i.ok) i.end(); return i.ok ? 'ok' : i.code; })(), extraction: await s.r.gate.beginExtraction().then((b) => { if (b.ok) b.lease.end(); return b.ok ? 'ok' : b.code; }) };
            // Cancel: idempotent; nothing it reported afterwards is shown.
            const progressAtCancel = progressSeen.length;
            store.cancelExtraction();
            store.cancelExtraction();
            const cancelling = plainly(store.getSnapshot().operation);
            ocr.gate.resolve();
            const finished = await running;
            out.cancel = {
                cancelling: cancelling?.phase, report: finished.report.kind === 'finished' ? finished.report.outcome : finished.report.refusal.code,
                progressAfterCancel: progressSeen.length - progressAtCancel, operationAfter: store.getSnapshot().operation, workers: workers(),
                previewEpochMoved: store.getSnapshot().previewEpoch > 0,
            };
            out.atStart = atStart;
            out.afterUnlock = { rename: codeOf(store.renameProfile(s.profile.id, 'P（改名）')), cancelNothing: (() => { store.cancelExtraction(); return store.getSnapshot().operation; })() };

            // N-L3: reset while extraction runs -- the old run lands nowhere; the new session is untouched and unlocked.
            {
                const t = await observedStore();
                const reg = t.store.currentSet().sheets.filter((x) => x.sourceId === t.sheet(t.register1).sourceId && x.retiredAt === null).sort((a, b) => a.pageNumber - b.pageNumber);
                t.store.assignProfile([reg[1].id], t.profile.id, { replace: true });
                const held = new HeldOcr();
                const progress = [];
                const run = t.store.extract({ sheetIds: [reg[1].id] }, { createOcr: () => held, onProgress: (e) => progress.push(e.phase) });
                await held.entered.promise;
                const seen = progress.length;
                t.store.reset();
                const afterReset = { operation: t.store.getSnapshot().operation, sheets: t.store.currentSet().sheets.length, runs: t.store.currentSet().analysisRuns.length };
                held.gate.resolve();
                const report = await run;
                out.NL3 = { afterReset, report: report.report.kind === 'finished' ? { applied: report.report.applied, notApplied: report.report.notApplied } : report.report.refusal.code, progressAfterReset: progress.length - seen, operation: t.store.getSnapshot().operation, runsNow: t.store.currentSet().analysisRuns.length };
                await t.dispose();
            }
            // N-L5: extraction that throws -- the lock is let go.
            {
                const t = await observedStore();
                let thrown = 'not thrown';
                try {
                    await t.store.extract({ sheetIds: [t.register1] }, { createOcr: () => { throw new Error('simulated'); } });
                } catch (error) {
                    thrown = error?.message ?? 'threw';
                }
                out.NL5 = { thrown, operation: t.store.getSnapshot().operation, renameAfter: codeOf(t.store.renameProfile(t.profile.id, 'R')) };
                await t.dispose();
            }
            await s.dispose();
            out.workers = workers();
            return plainly(out);
        }

        // T-01 / H-12: where a profile's rectangles land on the viewer, and back, for every rotation, offset and zoom.
        async function pointer(geometryTruth) {
            const geometry = await fixture(P2A, 'p2a-geometry');
            const r = rig();
            const host = document.createElement('div');
            host.style.cssText = 'width: 900px; height: 700px;';
            document.body.appendChild(host);
            const root = createRoot(host);
            await r.owner.open('A', geometry.file, geometry.expected);
            const source = { id: 'A', displayName: 'p2a-geometry.pdf', fingerprint: { sha256: geometry.expected.sha256, byteLength: geometry.expected.byteLength, pageCount: 8 } };
            const seen = { geometry: null };
            const rows = [];
            for (const pageTruth of geometryTruth.pages) {
                const sheet = { id: `sheet-${pageTruth.page}`, pageNumber: pageTruth.page };
                const overlay = (g) => { seen.geometry = g; return null; };
                root.render(createElement(ReadOnlySheetViewer, { owner: r.owner, source, file: geometry.file, sheet, pageTotal: 8, overlay }));
                const state = () => host.querySelector('[data-ds-viewer]')?.dataset.dsRenderState ?? '';
                await until(() => state() === 'rendered' && host.querySelector('canvas')?.dataset.dsRenderedSheet === sheet.id, `page ${pageTruth.page}`);
                for (const zoomClicks of [0, 2, 4]) {
                    for (let i = 0; i < zoomClicks; i++) host.querySelector('[data-ds-zoom-in]').click();
                    await tick();
                    await until(() => state() === 'rendered' && seen.geometry, 'the zoomed render');
                    await frames(1);
                    const g = seen.geometry;
                    const canvasBox = host.querySelector('canvas').getBoundingClientRect();
                    let worstToTruth = 0;
                    let worstRoundTrip = 0;
                    for (const name of FIELDS) {
                        const upright = pageTruth.uprightRects[name];
                        const display = pageTruth.displayRects[name];
                        const box = uprightToScreen(upright, g);
                        // Against the generator's own display rectangle, in CSS px.
                        worstToTruth = Math.max(worstToTruth, Math.abs(box.left - display.left * g.cssScale), Math.abs(box.top - display.top * g.cssScale),
                            Math.abs(box.left + box.width - display.right * g.cssScale), Math.abs(box.top + box.height - display.bottom * g.cssScale));
                        // A drag over that box back to upright points, in CSS px.
                        const back = dragToUpright({ x: box.left, y: box.top }, { x: box.left + box.width, y: box.top + box.height }, g);
                        worstRoundTrip = Math.max(worstRoundTrip, ...['left', 'top', 'right', 'bottom'].map((k) => Math.abs(back[k] - upright[k]) * g.cssScale));
                    }
                    rows.push({
                        page: pageTruth.page, rotate: pageTruth.rotate, offset: pageTruth.offset, zoomClicks, cssScale: g.cssScale, viewerRotate: g.rotate,
                        upright: uprightSize(g), uprightTruth: pageTruth.upright, canvasCss: [canvasBox.width, canvasBox.height],
                        worstToTruth, worstRoundTrip,
                    });
                    if (zoomClicks > 0) {
                        seen.geometry = null;
                        for (let i = 0; i < zoomClicks; i++) host.querySelector('[data-ds-zoom-out]').click();
                        await tick();
                        await until(() => state() === 'rendered' && seen.geometry, 'the zoom back');
                    }
                }
            }
            root.unmount();
            host.remove();
            await r.owner.close();
            return plainly({ rows, record: lastRecord(r.owner) });
        }

        function storage() {
            return {
                writes: plainly(window.__storage),
                local: localStorage.length,
                session: sessionStorage.length,
                objectUrls: window.__objectUrls.size,
                exports: plainly(window.__exports),
            };
        }

        window.__m7p2b2 = { ownerRelease, baseline, viewerAndCrop, evidence, sessions, lock, pointer, storage };
        window.__m7p2b2Ready = true;
        document.getElementById('state').textContent = 'ready';
    </script>
