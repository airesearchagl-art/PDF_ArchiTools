    <!--
        Drives the Production M7-P2-B2 modules -- the preview owner's page
        sections and release (W0), the crop service, the session store's
        commands, operation lock and confirmation evidence -- in a real
        browser, through the Vite dev server, for scripts/smoke-m7-p1.mjs
        (scripts/smoke-m7-p2b2-checks.mjs). Every function returns plain data;
        the Node side decides what passes. Synthetic fixtures only.

        Delays are deferreds the harness settles itself, and the release
        deadline is the owner's test seam, fired by hand: nothing here waits
        on a timer to decide an outcome.
    -->
    <script>
        // Before any module runs: count Workers by kind, canvases made, and
        // every storage write, object URL and canvas export.
        (() => {
            const counts = { pdf: { started: 0, ended: 0, live: 0, peak: 0 }, ocr: { started: 0, ended: 0, live: 0, peak: 0 }, other: { started: 0, ended: 0, live: 0, peak: 0 } };
            const kindOf = (url) => (/pdf\.worker/.test(url) ? 'pdf' : /\/ocr\//.test(url) ? 'ocr' : 'other');
            // RV-39-02: the start of an OCR Worker the test planned for is held at one of tesseract.js's
            // answers (load / loadLanguage / initialize) until the test releases it, fails it, or never does.
            // The Worker itself is real and does its real work; only when the page hears the answer moves.
            const ocrStart = { plans: [], made: [], log: [] };
            const NativeWorker = window.Worker;
            window.Worker = class extends NativeWorker {
                constructor(url, options) {
                    super(url, options);
                    this.__kind = kindOf(String(url));
                    const c = counts[this.__kind];
                    c.started += 1;
                    c.live += 1;
                    c.peak = Math.max(c.peak, c.live);
                    if (this.__kind === 'ocr') {
                        const plan = ocrStart.plans.shift() ?? null;
                        let channel = null;
                        try {
                            channel = new URLSearchParams(new URL(String(url), location.href).hash.slice(1)).get('channel');
                        } catch { /* not a URL the app made */ }
                        const record = { n: ocrStart.made.length + 1, plan, channel, liveAtSpawn: c.live, held: [], thrown: [], released: false, worker: this, heldAcks: [], ackReleased: false };
                        if (plan) plan.record = record;
                        ocrStart.made.push(record);
                        ocrStart.log.push(`${record.n}:spawned`);
                        this.__ocr = record;
                    }
                }
                postMessage(message, ...rest) {
                    // Every job the page asks of a planned or unplanned OCR Worker, answered or not.
                    if (this.__ocr && message?.action) ocrStart.log.push(`${this.__ocr.n}:${message.action}:asked`);
                    // M7-ADV-VERIFY: when each job was asked, on the page's clock.
                    if (this.__ocr && message?.action) (this.__ocr.asked ??= []).push({ action: message.action, at: performance.now() });
                    return super.postMessage(message, ...rest);
                }
                get onmessage() {
                    return super.onmessage;
                }
                set onmessage(handler) {
                    const record = this.__ocr;
                    if (!record || typeof handler !== 'function') {
                        super.onmessage = handler;
                        return;
                    }
                    const deliver = (event) => {
                        const data = event.data;
                        if (data?.status === 'resolve' || data?.status === 'reject') ocrStart.log.push(`${record.n}:${data.action}:${data.status}`);
                        try {
                            handler.call(this, event);
                        } catch (error) {
                            // tesseract.js throws from its own message handler after a rejection; kept, not lost.
                            record.thrown.push(String(error?.message ?? error));
                        }
                    };
                    const plan = record.plan;
                    record.release = () => {
                        record.released = true;
                        for (const event of record.held.splice(0)) deliver(event);
                    };
                    record.fail = (message) => {
                        record.released = true;
                        for (const event of record.held.splice(0)) deliver({ data: { ...event.data, status: 'reject', data: message } });
                    };
                    super.onmessage = (event) => {
                        const data = event.data;
                        // M7-ADV-VERIFY: what the Worker itself says while it works -- tesseract.js's progress reports
                        // ('recognizing text' 0..1) -- and when each job was answered, on the page's clock. Observation only.
                        if (data?.status === 'progress') (record.progress ??= []).push({ action: data.action ?? null, status: data.data?.status ?? null, p: data.data?.progress ?? null, at: performance.now() });
                        if (data?.status === 'resolve' || data?.status === 'reject') (record.answered ??= []).push({ action: data.action, status: data.status, at: performance.now() });
                        if (plan && !record.released && data?.action === plan.action && data.status === 'resolve') {
                            if (plan.mode === 'fail') {
                                record.released = true;
                                deliver({ data: { ...data, status: 'reject', data: plan.message ?? 'simulated' } });
                            } else record.held.push(event);
                            return;
                        }
                        deliver(event);
                    };
                }
                terminate() {
                    // RF-39-03: a planned Worker's first terminate() fails, as Worker.terminate() itself would throw.
                    if (this.__ocr?.plan?.terminateThrows && !this.__terminateThrown) {
                        this.__terminateThrown = true;
                        ocrStart.log.push(`${this.__ocr.n}:terminate-threw`);
                        throw new Error('simulated: Worker.terminate() failed');
                    }
                    if (!this.__ended) {
                        this.__ended = true;
                        const c = counts[this.__kind];
                        c.ended += 1;
                        c.live -= 1;
                        if (this.__ocr) ocrStart.log.push(`${this.__ocr.n}:terminated`);
                    }
                    super.terminate();
                }
            };
            window.__workers = counts;
            window.__ocrStart = ocrStart;
            // M7-ADV-VERIFY: anything thrown or rejected that nobody handled, with when.
            const faults = { errors: [], rejections: [] };
            window.addEventListener('error', (e) => faults.errors.push({ at: performance.now(), message: String(e.message ?? e.error ?? e) }));
            window.addEventListener('unhandledrejection', (e) => faults.rejections.push({ at: performance.now(), message: String(e.reason?.message ?? e.reason) }));
            window.__faults = faults;
            // RV-39-02 (HG-RV39-OCR-01): a planned Worker's "closed", as the page hears it on its channel, can be held
            // (and given later, or never) -- the Worker itself has closed; only the page's knowing it is withheld.
            // And, for a Worker planned so, the page's first "close" can be lost (as one sent before the Worker had
            // joined its channel would be), and its "alive" heard only when the test says.
            const NativeChannel = window.BroadcastChannel;
            window.BroadcastChannel = class extends NativeChannel {
                postMessage(message) {
                    const record = ocrStart.made.find((r) => r.channel === this.name);
                    if (record?.plan?.dropFirstClose && message?.type === 'close' && !record.closeDropped) {
                        record.closeDropped = true;
                        ocrStart.log.push(`${record.n}:close-lost`);
                        return;
                    }
                    super.postMessage(message);
                }
                get onmessage() {
                    return super.onmessage;
                }
                set onmessage(handler) {
                    const name = this.name;
                    if (typeof handler !== 'function') {
                        super.onmessage = handler;
                        return;
                    }
                    super.onmessage = (event) => {
                        const record = ocrStart.made.find((r) => r.channel === name);
                        if (record?.plan?.holdAlive && event.data?.type === 'alive' && !record.aliveReleased) {
                            (record.heldAlive ??= []).push(event);
                            record.releaseAlive = () => {
                                record.aliveReleased = true;
                                for (const held of record.heldAlive.splice(0)) handler.call(this, held);
                            };
                            return;
                        }
                        if (record && event.data?.type === 'closed') {
                            ocrStart.log.push(`${record.n}:closed-heard`);
                            if (record.plan?.holdClosed && !record.ackReleased) {
                                record.heldAcks.push(event);
                                record.releaseAck = () => {
                                    record.ackReleased = true;
                                    for (const held of record.heldAcks.splice(0)) handler.call(this, held);
                                };
                                return;
                            }
                        }
                        handler.call(this, event);
                    };
                }
            };
            const canvases = { made: 0, list: [] };
            const create = Document.prototype.createElement;
            Document.prototype.createElement = function (name, ...rest) {
                const element = create.call(this, name, ...rest);
                if (String(name).toLowerCase() === 'canvas') {
                    canvases.made += 1;
                    canvases.list.push(element);
                    if (canvases.list.length > 64) canvases.list.shift();
                }
                return element;
            };
            window.__canvases = canvases;
            const exports = { toDataURL: 0, toBlob: 0 };
            for (const name of ['toDataURL', 'toBlob']) {
                const original = HTMLCanvasElement.prototype[name];
                HTMLCanvasElement.prototype[name] = function (...args) {
                    exports[name] += 1;
                    return original.apply(this, args);
                };
            }
            window.__exports = exports;
            const storage = { writes: 0, calls: [] };
            for (const name of ['setItem', 'removeItem', 'clear']) {
                const original = Storage.prototype[name];
                Storage.prototype[name] = function (...args) {
                    storage.writes += 1;
                    storage.calls.push(`Storage.${name}`);
                    return original.apply(this, args);
                };
            }
            for (const name of ['open', 'deleteDatabase']) {
                const original = indexedDB[name].bind(indexedDB);
                indexedDB[name] = (...args) => {
                    storage.writes += 1;
                    storage.calls.push(`indexedDB.${name}`);
                    return original(...args);
                };
            }
            if (window.caches) {
                const original = caches.open.bind(caches);
                caches.open = (...args) => {
                    storage.writes += 1;
                    storage.calls.push('caches.open');
                    return original(...args);
                };
            }
            window.__storage = storage;
            const urls = new Set();
            const createUrl = URL.createObjectURL.bind(URL);
            const revokeUrl = URL.revokeObjectURL.bind(URL);
            URL.createObjectURL = (o) => { const u = createUrl(o); urls.add(u); return u; };
            URL.revokeObjectURL = (u) => { urls.delete(u); return revokeUrl(u); };
            window.__objectUrls = urls;
        })();
    </script>
    <script type="module">
        import * as pdfjsLib from 'pdfjs-dist';
        import { StrictMode, createElement } from 'react';
        import { createRoot } from 'react-dom/client';
        import { configurePdfWorker } from '/src/utils/pdf-worker-source.ts';
        import { renderRegion } from '/src/utils/pdf-textifier/drawing-register-geometry.ts';
        import { PreviewDocumentOwner, RELEASE_DEADLINE_MS } from '/src/utils/drawing-set/preview-document.ts';
        import { PdfDocumentGate } from '/src/utils/drawing-set/pdf-document-gate.ts';
        import { m7PdfDocumentAssets } from '/src/utils/drawing-set/pdf-document-assets.ts';
        import { readFileDigest } from '/src/utils/drawing-set/file-evidence.ts';
        import { verifyHeldFile, RuntimeBindingLedger, observationCurrency, currencyLabel } from '/src/utils/drawing-set/currency.ts';
        import { CROP_LIMITS, planCrop } from '/src/utils/drawing-set/crop-service.ts';
        import { GuardedRegisterOcr } from '/src/utils/drawing-set/register-extraction.ts';
        // The OCR Worker registry (RV-39-02), loaded by name so the same harness also runs against a tree that has
        // none -- the before-evidence -- and says so instead of failing to load.
        const OCR_WORKERS_MODULE = '/src/utils/drawing-set/ocr-workers.ts';
        const ocrWorkersModule = await import(/* @vite-ignore */ OCR_WORKERS_MODULE).catch(() => null);
        import { DrawingSetStore, EvidenceHandle } from '/src/utils/drawing-set/workspace-store.ts';
        import { ReadOnlySheetViewer } from '/src/components/drawing-set/ReadOnlySheetViewer.tsx';
        import { TitleBlockPanel } from '/src/components/drawing-set/TitleBlockPanel.tsx';
        import { PAGE_PREVIEW_OWNER } from '/src/utils/drawing-set/page-documents.ts';
        import { dragToUpright, uprightSize, uprightToScreen } from '/src/utils/drawing-set/profile-pointer.ts';

        const P1 = '/test-fixtures/m7-p1';
        const P2A = '/test-fixtures/m7-p2a';
        const FIELDS = ['drawingNumber', 'drawingTitle', 'revision', 'issueDate'];
        const plainly = (value) => JSON.parse(JSON.stringify(value ?? null));
        const workers = () => plainly(window.__workers);
        const settle = (promise) => promise.then((value) => ({ ok: true, value }), (error) => ({ ok: false, code: error?.code ?? error?.name ?? String(error) }));
        const tick = () => new Promise((resolve) => setTimeout(resolve, 0));
        const frames = (n = 2) => new Promise((resolve) => {
            const step = (left) => (left === 0 ? resolve() : requestAnimationFrame(() => step(left - 1)));
            step(n);
        });
        function defer() {
            let resolve;
            let reject;
            const promise = new Promise((res, rej) => { resolve = res; reject = rej; });
            return { promise, resolve, reject };
        }
        /** Wait for a condition the harness itself will make true; fails loudly rather than hanging. */
        async function until(test, what, limitMs = 20000) {
            const t0 = performance.now();
            while (!test()) {
                if (performance.now() - t0 > limitMs) throw new Error(`timed out waiting for ${what}`);
                await new Promise((resolve) => setTimeout(resolve, 5));
            }
        }

        async function fixtureBytes(dir, name) {
            const response = await fetch(`${dir}/${name}.pdf`);
            const type = response.headers.get('content-type') || '';
            if (!response.ok || type.includes('text/html')) throw new Error(`fixture ${name} missing (the dev server fell back to HTML)`);
            return new Uint8Array(await response.arrayBuffer());
        }
        const fileOf = (bytes, name) => new File([bytes], name, { type: '' });
        async function sha256Hex(bytes) {
            const digest = await crypto.subtle.digest('SHA-256', bytes);
            return [...new Uint8Array(digest)].map((b) => b.toString(16).padStart(2, '0')).join('');
        }
        async function fixture(dir, name) {
            const bytes = await fixtureBytes(dir, name);
            return { bytes, file: fileOf(bytes, `${name}.pdf`), expected: { sha256: await sha256Hex(bytes), byteLength: bytes.byteLength } };
        }
        async function canvasDigest(canvas) {
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            return sha256Hex(data);
        }
        function darkCount(canvas) {
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            let dark = 0;
            for (let i = 0; i < data.length; i += 4) if (0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2] < 128) dark += 1;
            return dark;
        }

        /** An upright rectangle as it lies on the page turned clockwise by `rotate`. */
        function displayRect(r, rotate, W, H) {
            switch (((rotate % 360) + 360) % 360) {
                case 90: return { left: H - r.bottom, right: H - r.top, top: r.left, bottom: r.right };
                case 180: return { left: W - r.right, right: W - r.left, top: H - r.bottom, bottom: H - r.top };
                case 270: return { left: r.top, right: r.bottom, top: W - r.right, bottom: W - r.left };
                default: return { ...r };
            }
        }
        /** A copy of a canvas turned clockwise by a multiple of 90 degrees. */
        function turned(source, rotate) {
            const r = ((rotate % 360) + 360) % 360;
            const quarter = r % 180 === 90;
            const out = document.createElement('canvas');
            out.width = quarter ? source.height : source.width;
            out.height = quarter ? source.width : source.height;
            const ctx = out.getContext('2d', { willReadFrequently: true });
            ctx.translate(out.width / 2, out.height / 2);
            ctx.rotate((r * Math.PI) / 180);
            ctx.drawImage(source, -source.width / 2, -source.height / 2);
            return out;
        }
        /**
         * How alike two canvases look at a coarse scale: the correlation of
         * their ink density over 8 px blocks, across the area they share.
         * Rasterising through a rotation moves strokes by a pixel or so, so
         * pixels are not compared one by one; the layout is.
         */
        function agreement(a, b) {
            const w = Math.min(a.width, b.width);
            const h = Math.min(a.height, b.height);
            const B = 8;
            const cols = Math.floor(w / B);
            const rows = Math.floor(h / B);
            if (cols === 0 || rows === 0) return 0;
            const density = (canvas) => {
                const data = canvas.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, cols * B, rows * B).data;
                const grid = new Float64Array(cols * rows);
                for (let y = 0; y < rows * B; y++) {
                    for (let x = 0; x < cols * B; x++) {
                        const i = (y * cols * B + x) * 4;
                        if (0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2] < 128) grid[Math.floor(y / B) * cols + Math.floor(x / B)] += 1;
                    }
                }
                return grid;
            };
            const ga = density(a);
            const gb = density(b);
            a.width = 0;
            const mean = (g) => g.reduce((s, v) => s + v, 0) / g.length;
            const ma = mean(ga);
            const mb = mean(gb);
            let num = 0;
            let va = 0;
            let vb = 0;
            for (let i = 0; i < ga.length; i++) {
                num += (ga[i] - ma) * (gb[i] - mb);
                va += (ga[i] - ma) ** 2;
                vb += (gb[i] - mb) ** 2;
            }
            return va === 0 || vb === 0 ? (va === vb ? 1 : 0) : num / Math.sqrt(va * vb);
        }

        /**
         * A gate and an owner with the test seams: page requests through
         * `pages(doc, n)` (the document's own by default), every one logged,
         * and the release deadline armed into `deadlines` for the test to
         * fire by hand.
         */
        function rig(pages = null) {
            const gate = new PdfDocumentGate();
            const log = [];
            const deadlines = [];
            const pageRequests = [];
            const owner = new PreviewDocumentOwner({
                gate,
                pageSource: (doc, n) => {
                    pageRequests.push(n);
                    log.push(`page-asked:${n}`);
                    return pages ? pages(doc, n, log) : doc.getPage(n);
                },
                releaseDeadline: (expire) => {
                    const armed = { expire, disarmed: false };
                    deadlines.push(armed);
                    return () => { armed.disarmed = true; };
                },
            });
            return { gate, owner, log, deadlines, pageRequests };
        }

        /** Log a document's destruction, and let the test hold it, fail it, or never finish it. */
        function watchDestroy(doc, log, mode = {}) {
            const task = doc.loadingTask;
            const real = task.destroy.bind(task);
            const control = { real, hold: null };
            task.destroy = () => {
                log.push('destroy-asked');
                if (mode.fail) return Promise.reject(new Error('simulated destroy failure'));
                if (mode.never) return new Promise(() => { });
                if (mode.hold) {
                    control.hold = defer();
                    return control.hold.promise.then(() => real()).then(() => { log.push('destroy-done'); });
                }
                return real().then(() => { log.push('destroy-done'); });
            };
            return control;
        }

        /**
         * A real page whose renders pause at their first step until the test
         * lets them go (PDF.js's own onContinue hook), and whose renders and
         * cleanups are logged. `cleanup` can be made to report false, or to throw.
         */
        function instrumentPage(page, log, options = {}) {
            if (page.__instrumented) {
                page.__options = options;
                return page;
            }
            page.__instrumented = true;
            page.__options = options;
            page.__held = [];
            const realRender = page.render.bind(page);
            const realCleanup = page.cleanup.bind(page);
            const realGetViewport = page.getViewport.bind(page);
            page.render = (params) => {
                const opts = page.__options;
                if (opts.renderFails) {
                    log.push('render-start');
                    return { promise: Promise.reject(new Error('simulated render failure')), cancel: () => { } };
                }
                const task = realRender(params);
                log.push('render-start');
                page.__lastCanvas = params.canvas;
                if (opts.hold) {
                    task.onContinue = (next) => { page.__held.push(next); opts.onHeld?.(); };
                }
                task.promise.then(() => log.push('render-done'), (e) => log.push(`render-${e?.name ?? 'error'}`));

            };

                const opts = page.__options;
                if (opts.cleanupThrows) {
                    log.push('cleanup-threw');
                    throw new Error('simulated cleanup failure');
                }
                const result = realCleanup(...args);
                const reported = opts.cleanupFalse ? false : result;
                log.push(`cleanup:${reported}`);
                return reported;
            };

                (page.__viewports ??= []).push({ scale: params?.scale, rotation: params?.rotation });

            return page;

            const panel = document.createElement('div');
            panel.style.cssText = 'width: 900px; position: relative;';
            const slots = {};
            for (const name of FIELDS) {
                const slot = document.createElement('div');
                slot.dataset.slot = name;
                slot.style.cssText = 'min-height: 10px; overflow: auto;';
                panel.appendChild(slot);
                slots[name] = slot;

                const held = new HeldOcr();
                const progress = [];
                const run = t.store.extract({ sheetIds: [reg[1].id] }, { createOcr: () => held, onProgress: (e) => progress.push(e.phase) });
                await held.entered.promise;
                const seen = progress.length;
                t.store.reset();
                const afterReset = { operation: t.store.getSnapshot().operation, sheets: t.store.currentSet().sheets.length, runs: t.store.currentSet().analysisRuns.length };
                held.gate.resolve();
                const report = await run;
                out.NL3 = { afterReset, report: report.report.kind === 'finished' ? { applied: report.report.applied, notApplied: report.report.notApplied } : report.report.refusal.code, progressAfterReset: progress.length - seen, operation: t.store.getSnapshot().operation, runsNow: t.store.currentSet().analysisRuns.length };
                await t.dispose();
            }
            // N-L5: extraction that throws -- the lock is let go.
            {
                const t = await observedStore();
                let thrown = 'not thrown';
                try {
                    await t.store.extract({ sheetIds: [t.register1] }, { createOcr: () => { throw new Error('simulated'); } });
                } catch (error) {
                    thrown = error?.message ?? 'threw';
                }
                out.NL5 = { thrown, operation: t.store.getSnapshot().operation, renameAfter: codeOf(t.store.renameProfile(t.profile.id, 'R')) };
                await t.dispose();
            }
            // N-L6: extraction's document cannot be destroyed -- the lock is let go, the gate keeps refusing, the snapshot says so.
            {
                const t = await observedStore();
                const probeDoc = await openDoc(await fixtureBytes(P2A, 'p2a-register'));
                const proto = Object.getPrototypeOf(probeDoc.doc.loadingTask._transport);
                await probeDoc.task.destroy();
                const realDestroy = proto.destroy;
                const leaked = [];
                proto.destroy = function failingOnce() {
                    proto.destroy = realDestroy;
                    leaked.push(this);
                    return Promise.reject(new Error('simulated destroy failure'));
                };
                let report;
                try {
                    report = await t.store.extract({ sheetIds: [t.register1] });
                } finally {
                    proto.destroy = realDestroy;
                }
                const snap = t.store.getSnapshot();
                const prepared = await t.store.prepareEvidence(t.register1, { panel: t.panel, slots: t.slots });
                const intake = await t.store.intake(fileOf(await fixtureBytes(P1, 'p1-second-c'), 'c.pdf'));
                out.NL6 = {
                    report: report.report.kind === 'finished' ? { outcome: report.report.outcome, failure: report.report.failure } : report.report.refusal.code,
                    operation: snap.operation, documentsUnavailable: snap.documentsUnavailable, gate: t.r.gate.releaseUnconfirmed,
                    prepare: prepared.ok ? 'issued' : prepared.refusal.code, intake: intake.kind === 'refused' ? intake.refusal.code : intake.kind,
                };
                // Release by hand what the injected failure left: the transport, then its worker (PDF.js skipped it).
                for (const transport of leaked) {
                    await realDestroy.call(transport).catch(() => { });
                    transport.loadingTask?._worker?.destroy();
                }
                await t.dispose();
            }
            await s.dispose();
            out.workers = workers();
            return plainly(out);
        }

        // RF-39-01: the summary the screen shows after extraction, through startExtraction() itself.
        // The next run is held at the gate's door until the test lets it in: no timer decides the order.
        function holdNextExtraction(gate) {
            const asked = defer();
            const held = defer();
            gate.beginExtraction = function heldOnce() {
                delete gate.beginExtraction;
                asked.resolve();
                return held.promise.then(() => gate.beginExtraction());
            };
            return { asked: asked.promise, release: () => held.resolve() };
        }

        async function summaries() {
            const out = {};
            const view = (store) => {
                const snap = store.getSnapshot();
                return { version: snap.version, operation: plainly(snap.operation), last: snap.lastExtraction ? { runId: snap.lastExtraction.runId, kind: snap.lastExtraction.kind, outcome: snap.lastExtraction.outcome, code: snap.lastExtraction.refusal?.code ?? null } : null };
            };
            // In one session: a run that completes, and a run that is cancelled, are each shown.
            {
                const s = await observedStore();
                const done = await s.store.startExtraction([s.register1]);
                out.completed = { returned: { runId: done.runId, outcome: done.outcome }, shown: view(s.store).last };
                const hold = holdNextExtraction(s.r.gate);
                const running = s.store.startExtraction([s.register1]);
                await hold.asked;
                s.store.cancelExtraction();
                hold.release();
                const cancelled = await running;
                out.cancelled = { returned: { runId: cancelled.runId, outcome: cancelled.outcome }, shown: view(s.store).last, operation: view(s.store).operation };
                await s.dispose();
            }
            for (const how of ['reset', 'leave']) {
                const s = await observedStore();
                const { store } = s;
                // A summary shown before; then a run held while the session is replaced, or the workspace left and entered again.
                const before = await store.startExtraction([s.register1]);
                const hold = holdNextExtraction(s.r.gate);
                const old = store.startExtraction([s.register1]);
                await hold.asked;
                const whileRunning = view(store);
                if (how === 'reset') store.reset();
                else {
                    store.leave();
                    store.enter();
                }
                const afterSwitch = view(store);
                // The old run ends now, before anything new: none of it is shown, and the snapshot does not move.
                hold.release();
                const oldSummary = await old;
                await tick();
                const afterOld = view(store);
                out[`${how}_alone`] = { before: { runId: before.runId, outcome: before.outcome }, whileRunning, afterSwitch, oldRunId: oldSummary.runId, afterOld };
                await s.dispose();
            }
            // The old run ends after a new run of the new session (or visit) has been shown: it does not replace it.
            for (const how of ['reset', 'leave']) {
                const s = await observedStore();
                const { store } = s;
                const hold = holdNextExtraction(s.r.gate);
                const old = store.startExtraction([s.register1]);
                await hold.asked;
                if (how === 'reset') store.reset();
                else {
                    store.leave();
                    store.enter();
                }
                let target = s.register1;
                if (how === 'reset') {
                    const accepted = await store.intake(s.files.register);
                    if (accepted.kind !== 'accepted') throw new Error(`intake after reset: ${accepted.kind}`);
                    const profile = store.createProfile({ name: 'P', transferModel: 'normalised', referencePage: { uprightWidthPt: 800, uprightHeightPt: 580 }, fields: s.profile.fields });
                    if (!profile.ok) throw new Error(`profile after reset: ${profile.refusal.code}`);
                    target = accepted.sheets[0].id;
                    const assigned = store.assignProfile([target], profile.profile.id);
                    if (!assigned.ok) throw new Error(`assign after reset: ${assigned.refusal.code}`);
                }
                const fresh = await store.startExtraction([target]);
                const afterNew = view(store);
                hold.release();
                const oldSummary = await old;
                await tick();
                const afterOld = view(store);
                out[`${how}_thenNew`] = { newRun: { runId: fresh.runId, outcome: fresh.outcome }, oldRunId: oldSummary.runId, afterNew, afterOld };
                await s.dispose();
            }
            out.workers = workers();
            return plainly(out);
        }

        // RV-39-02 / HG-RV39-OCR-01: extraction stopped, or failing, while its recogniser's Worker starts.
        // Each scenario plans the next OCR Worker's start (window.__ocrStart: one of tesseract.js's answers held,
        // failed or never given; the Worker's "closed" withheld from the page) and drives the screen's way in,
        // startExtraction(), on a store with its own registry whose deadlines the test fires by hand. A Worker is
        // gone only when the browser itself no longer lists it (window.__browserOcrWorkers, asked of the Node side):
        // neither the app's own record of it nor the harness ending it counts. The harness ends a planned Worker
        // only after everything about it has been read.
        async function ocrInit(which) {
            const out = { registryLoaded: Boolean(ocrWorkersModule) };
            const ocrStart = window.__ocrStart;
            const exportsBefore = { ...window.__exports };
            const logBefore = ocrStart.log.length;
            const Registry = ocrWorkersModule?.OcrWorkerRegistry ?? null;
            const START_MS = ocrWorkersModule?.OCR_START_DEADLINE_MS ?? null;
            const CLOSE_MS = ocrWorkersModule?.OCR_CLOSE_DEADLINE_MS ?? null;
            out.deadlines = { start: START_MS, close: CLOSE_MS };
            const browserOcr = async () => (typeof window.__browserOcrWorkers === 'function' ? window.__browserOcrWorkers() : -1);
            // The browser drops a Worker from its list a moment after it ends; waits for that, or gives the count it has.
            const browserSettles = async (n) => {
                const t0 = performance.now();
                for (; ;) {
                    const count = await browserOcr();
                    if (count === n || performance.now() - t0 > 20000) return count;
                    await new Promise((resolve) => setTimeout(resolve, 20));
                }
            };
            // A run that may never end: waits for it within a bound, and says whether it ended.
            const within = (promise, ms) => Promise.race([
                promise.then((value) => ({ settled: true, value }), (error) => ({ settled: true, error: String(error?.message ?? error) })),
                new Promise((resolve) => setTimeout(() => resolve({ settled: false }), ms)),
            ]);
            const planNext = (plan) => {
                ocrStart.plans.push(plan);
                return plan;
            };
            const shown = (store) => {
                const last = store.getSnapshot().lastExtraction;
                return last ? { runId: last.runId, kind: last.kind, outcome: last.outcome, committed: last.committed, ocrFailed: last.ocrFailed, code: last.refusal?.code ?? null } : null;
            };
            const rasterOf = (s) => {
                const reg = s.store.currentSet().sheets.filter((x) => x.sourceId === s.sheet(s.register1).sourceId && x.retiredAt === null).sort((a, b) => a.pageNumber - b.pageNumber);
                const raster = reg[1].id;
                const assigned = s.store.assignProfile([raster], s.profile.id, { replace: true });
                if (!assigned.ok) throw new Error(`assign: ${assigned.refusal.code}`);
                return raster;
            };
            const observationOf = (s, id) => {
                const o = s.sheet(id)?.observation;
                return o ? { runId: o.runId, status: o.status, sources: FIELDS.map((n) => o.fields[n].source) } : null;
            };
            const heldIn = (plan, what) => until(() => (plan.record?.held.length ?? 0) > 0, what, 60000);
            const logFrom = (mark) => ocrStart.log.slice(mark);
            // What the screen's title-block panel says now, drawn from the store's snapshot as the workspace draws it.
            const panelSays = async (store) => {
                const host = document.createElement('div');
                document.body.appendChild(host);
                const root = createRoot(host);
                const snap = store.getSnapshot();
                const noop = () => { };
                root.render(createElement(TitleBlockPanel, {
                    store, drawingSet: store.currentSet(), checked: new Set(), operation: snap.operation, lastExtraction: snap.lastExtraction,
                    selectedSheet: null, canDraw: false, editing: false, onCheck: noop, onCreate: noop, onRevise: noop, onNotice: noop,
                }));
                await frames(2);
                const result = host.querySelector('[data-ds-extraction-result]');
                const said = {
                    result: result ? { state: result.dataset.dsExtractionResult, ocrFailed: Number(result.dataset.dsExtractionOcrFailed), text: result.textContent.trim() } : null,
                    progress: host.querySelector('[data-ds-extraction-progress]')?.textContent.trim() ?? null,
                };
                root.unmount();
                host.remove();
                return said;
            };
            const manualClock = () => {
                const armed = [];
                return {
                    armed,
                    arm: (ms, expire) => {
                        const d = { ms, expire, disarmed: false, fired: false };
                        armed.push(d);
                        return () => { d.disarmed = true; };
                    },
                    fire: (ms) => {
                        let n = 0;
                        for (const d of armed) {
                            if (d.ms === ms && !d.disarmed && !d.fired) {
                                d.fired = true;
                                n += 1;
                                d.expire();
                            }
                        }
                        return n;
                    },
                    // Every deadline ever armed, disarmed ones included: one that fires late must change nothing.
                    fireAll: () => {
                        let n = 0;
                        for (const d of armed) {
                            if (!d.fired) {
                                d.fired = true;
                                n += 1;
                                d.expire();
                            }
                        }
                        return n;
                    },
                    live: (ms) => armed.filter((d) => d.ms === ms && !d.disarmed && !d.fired).length,
                };
            };
            // A store on its own registry; every snapshot it publishes is kept with the registry's Workers at that moment.
            const setup = async (opts = {}) => {
                const clock = manualClock();
                const registry = Registry ? new Registry({ deadline: clock.arm, ...(opts.terminate ? { terminate: opts.terminate } : {}) }) : null;
                const s = await observedStore(registry ? { ocrWorkers: registry } : {});
                const raster = rasterOf(s);
                const trail = [];
                const stopTrail = s.store.subscribe(() => {
                    const snap = s.store.getSnapshot();
                    trail.push({ phase: snap.operation?.phase ?? null, live: registry ? registry.live : null, states: registry ? registry.records().map((r) => r.state) : null });
                });
                const transitions = [];
                const stopRegistry = registry ? registry.subscribe(() => {
                    const line = registry.records().map((r) => `${r.n}:${r.state}`).join(',');
                    if (transitions.at(-1) !== line) transitions.push(line);
                }) : () => { };
                const mark = ocrStart.log.length;
                return {
                    s, store: s.store, raster, clock, registry, trail, transitions, mark,
                    // At most this many of the registry's Workers were ever not known ended at the same time.
                    concurrent: () => Math.max(0, ...transitions.map((line) => line.split(',').filter((x) => /:(starting|started|closing)$/.test(x)).length)),
                    // The lock as the screen saw it let go after a cancel: what the Workers were at that moment.
                    unlockAfterCancel: () => {
                        const i = trail.findIndex((e, k) => k > 0 && e.phase === null && trail[k - 1].phase === 'cancelling');
                        return i < 0 ? null : trail[i];
                    },
                    counts: () => (registry ? registry.counts() : null),
                    records: () => (registry ? registry.records() : null),
                    done: async () => {
                        stopTrail();
                        stopRegistry();
                        await s.dispose();
                    },
                };
            };

            // A. Cancelled while initialising; the next extraction asked for at once; the old start's answers given afterwards.
            if (which === 'A') {
                const t = await setup();
                const plan = planNext({ action: 'initialize' });
                const first = t.store.startExtraction([t.raster]);
                await heldIn(plan, 'the recogniser held in its start');
                const atCancel = { browser: await browserOcr(), phase: t.store.getSnapshot().operation?.phase ?? null, records: t.records() };
                t.store.cancelExtraction();
                const firstSummary = await first;
                const unlock = t.unlockAfterCancel();
                const afterCancel = { browser: await browserSettles(0), operation: plainly(t.store.getSnapshot().operation), shown: shown(t.store), extractionActive: t.s.r.gate.extractionActive, counts: t.counts(), records: t.records(), panel: await panelSays(t.store) };
                const second = await t.store.startExtraction([t.raster]);
                const afterSecond = { browser: await browserSettles(0), shown: shown(t.store), observation: observationOf(t.s, t.raster), version: t.store.getSnapshot().version, counts: t.counts(), startDeadlinesLive: START_MS === null ? null : t.clock.live(START_MS) };
                // The old Worker's held answers, given now: to a Worker that has closed itself.
                plan.record.release();
                await tick();
                await tick();
                const afterOld = { browser: await browserSettles(0), shown: shown(t.store), observation: observationOf(t.s, t.raster), version: t.store.getSnapshot().version, counts: t.counts() };
                // H. Every deadline armed so far fired late, disarmed ones included: nothing moves.
                const fired = t.clock.fireAll();
                await tick();
                const afterLateDeadlines = { fired, counts: t.counts(), shown: shown(t.store), version: t.store.getSnapshot().version, unavailable: t.store.getSnapshot().ocr?.unavailable ?? null };
                out.A = {
                    atCancel, firstSummary: { runId: firstSummary.runId, outcome: firstSummary.outcome }, unlock, afterCancel,
                    second: { runId: second.runId, outcome: second.outcome }, afterSecond, afterOld, afterLateDeadlines,
                    concurrent: t.concurrent(), transitions: t.transitions, log: logFrom(t.mark),
                };
                plan.record.worker.terminate();
                await t.done();
            }
            // B. Cancelled while loading; then the load answered as failed (createWorker rejects): nothing moves, nothing left.
            if (which === 'B') {
                const t = await setup();
                const plan = planNext({ action: 'load' });
                const run = t.store.startExtraction([t.raster]);
                await heldIn(plan, 'the recogniser held in its load');
                t.store.cancelExtraction();
                const summary = await run;
                const afterCancel = { browser: await browserSettles(0), operation: plainly(t.store.getSnapshot().operation), outcome: summary.outcome, version: t.store.getSnapshot().version, counts: t.counts(), unlock: t.unlockAfterCancel() };
                plan.record.fail('simulated: the recogniser could not load');
                await tick();
                await tick();
                const afterFail = { browser: await browserSettles(0), version: t.store.getSnapshot().version, counts: t.counts(), thrownInHandler: plan.record.thrown.length };
                const next = await t.store.startExtraction([t.raster]);
                const afterNext = { browser: await browserSettles(0), outcome: next.outcome, shown: shown(t.store), counts: t.counts() };
                out.B = { afterCancel, afterFail, afterNext, concurrent: t.concurrent(), log: logFrom(t.mark) };
                plan.record.worker.terminate();
                await t.done();
            }
            // C. The language data refused (loadLanguage rejected; tesseract.js never settles its createWorker), not cancelled.
            if (which === 'C') {
                const t = await setup();
                const plan = planNext({ action: 'loadLanguage', mode: 'fail', message: 'simulated: the language data could not be fetched' });
                const run = t.store.startExtraction([t.raster]);
                const ended = await within(run, 30000);
                const atEnd = { settled: ended.settled, outcome: ended.value?.outcome ?? null, ocrFailed: ended.value?.ocrFailed ?? null, operation: plainly(t.store.getSnapshot().operation), browser: await browserSettles(0), counts: t.counts(), thrownInHandler: plan.record?.thrown.length ?? null, observation: observationOf(t.s, t.raster), panel: await panelSays(t.store) };
                if (!ended.settled) {
                    t.store.cancelExtraction();
                    await within(run, 30000);
                }
                out.C = { atEnd, log: logFrom(t.mark) };
                plan.record?.worker.terminate();
                await t.done();
            }
            // D1. A start that never answers, cancelled: ended in finite time.
            if (which === 'D1') {
                const t = await setup();
                const plan = planNext({ action: 'initialize' });
                const run = t.store.startExtraction([t.raster]);
                await heldIn(plan, 'the recogniser held in its start');
                t.store.cancelExtraction();
                const ended = await within(run, 30000);
                out.D1 = { settled: ended.settled, outcome: ended.value?.outcome ?? null, operation: plainly(t.store.getSnapshot().operation), browser: await browserSettles(0), counts: t.counts(), records: t.records(), unlock: t.unlockAfterCancel(), panel: await panelSays(t.store) };
                plan.record.worker.terminate();
                await t.done();
            }
            // D2. A start that never answers, not cancelled: its start deadline taken as a failure; the Worker closed; the run ends.
            if (which === 'D2') {
                const t = await setup();
                const plan = planNext({ action: 'initialize' });
                const run = t.store.startExtraction([t.raster]);
                await heldIn(plan, 'the recogniser held in its start');
                const fired = START_MS === null ? 0 : t.clock.fire(START_MS);
                const ended = await within(run, fired ? 30000 : 3000);
                out.D2 = {
                    fired, settled: ended.settled, outcome: ended.value?.outcome ?? null, ocrFailed: ended.value?.ocrFailed ?? null, observation: observationOf(t.s, t.raster),
                    browser: await browserSettles(0), counts: t.counts(), records: t.records(), panel: await panelSays(t.store),
                };
                if (!ended.settled) {
                    t.store.cancelExtraction();
                    await within(run, 30000);
                }
                plan.record.worker.terminate();
                await t.done();
            }
            // E. The recogniser cannot load, not cancelled: OCR_FAILED shown, the Worker gone.
            if (which === 'E') {
                const t = await setup();
                const plan = planNext({ action: 'load', mode: 'fail', message: 'simulated: the recogniser could not load' });
                const summary = await t.store.startExtraction([t.raster]);
                await tick();
                out.E = {
                    outcome: summary.outcome, ocrFailed: summary.ocrFailed, observation: observationOf(t.s, t.raster),
                    browser: await browserSettles(0), counts: t.counts(), thrownInHandler: plan.record.thrown.length, panel: await panelSays(t.store),
                };
                plan.record.worker.terminate();
                await t.done();
            }
            // F. Every start would fail; every register page assigned: one Worker for the run, not one per page.
            if (which === 'F') {
                const t = await setup();
                const reg = t.store.currentSet().sheets.filter((x) => x.sourceId === t.s.sheet(t.s.register1).sourceId && x.retiredAt === null).map((x) => x.id);
                t.store.assignProfile(reg, t.s.profile.id, { replace: true });
                const madeBefore = ocrStart.made.length;
                for (let i = 0; i < 32; i += 1) planNext({ action: 'load', mode: 'fail', message: 'simulated: the recogniser could not load' });
                const summary = await t.store.startExtraction(reg);
                await tick();
                const made = ocrStart.made.slice(madeBefore);
                ocrStart.plans.splice(0);
                out.F = {
                    sheets: reg.length, outcome: summary.outcome, ocrFailed: summary.ocrFailed, ocrFailedSheets: reg.filter((id) => observationOf(t.s, id)?.status === 'OCR_FAILED').length,
                    spawned: made.length, browser: await browserSettles(0), counts: t.counts(),
                };
                for (const r of made) r.worker.terminate();
                await t.done();
            }
            // G. Told to close, the Worker's "closed" never reaches the page: the lock waits for its deadline; then the
            //    page's OCR fails closed, stays so when the answer comes late, and only a new registry (a reload) reads again.
            if (which === 'G') {
                const t = await setup();
                const plan = planNext({ action: 'initialize', holdClosed: true });
                const run = t.store.startExtraction([t.raster]);
                await heldIn(plan, 'the recogniser held in its start');
                t.store.cancelExtraction();
                // (A tree without the registry has no channel: nothing to wait for, and the checks below say what it did.)
                if (Registry) await until(() => (plan.record.heldAcks?.length ?? 0) > 0, 'the Worker said closed (withheld from the page)', 30000);
                await tick();
                const whileUnheard = { phase: t.store.getSnapshot().operation?.phase ?? null, rename: (() => { const r = t.store.renameProfile(t.s.profile.id, 'G'); return r.ok ? 'ok' : r.refusal.code; })(), closeDeadlinesLive: CLOSE_MS === null ? null : t.clock.live(CLOSE_MS), counts: t.counts() };
                const fired = CLOSE_MS === null ? 0 : t.clock.fire(CLOSE_MS);
                const ended = await within(run, 30000);
                const afterDeadline = {
                    fired, settled: ended.settled, outcome: ended.value?.outcome ?? null, operation: plainly(t.store.getSnapshot().operation), unavailable: t.store.getSnapshot().ocr?.unavailable ?? null,
                    counts: t.counts(), records: t.records(),
                };
                const refused = await t.store.startExtraction([t.raster]);
                const refusedView = { kind: refused.kind, code: refused.refusal?.code ?? null, panel: await panelSays(t.store) };
                plan.record.releaseAck?.();
                await tick();
                const afterLateAnswer = { counts: t.counts(), records: t.records(), unavailable: t.store.getSnapshot().ocr?.unavailable ?? null, again: await t.store.startExtraction([t.raster]).then((x) => x.refusal?.code ?? x.outcome) };
                await t.done();
                // What a reload gives: a registry of its own.
                const fresh = await setup();
                const reloaded = await fresh.store.startExtraction([fresh.raster]);
                out.G = { whileUnheard, afterDeadline, refused: refusedView, afterLateAnswer, reloaded: { outcome: reloaded.outcome, browser: await browserSettles(0), counts: fresh.counts() } };
                plan.record.worker.terminate();
                await fresh.done();
            }
            // I. Cancelled, then a new Drawing Set (or leaving and entering again) while the old Worker's "closed" is not yet
            //    heard: the old run still holds the extraction lease, so nothing new reads; once heard, the next run does --
            //    and at no moment are two of the registry's Workers not known ended.
            if (which === 'I') for (const how of ['reset', 'leave']) {
                const t = await setup();
                const plan = planNext({ action: 'initialize', holdClosed: true });
                const old = t.store.startExtraction([t.raster]);
                await heldIn(plan, 'the recogniser held in its start');
                t.store.cancelExtraction();
                // (A tree without the registry has no channel: nothing to wait for, and the checks below say what it did.)
                if (Registry) await until(() => (plan.record.heldAcks?.length ?? 0) > 0, 'the Worker said closed (withheld from the page)', 30000);
                if (how === 'reset') t.store.reset();
                else {
                    t.store.leave();

                        workerEnded: watch.seen.endedAt[record.channel]?.ended ?? null,
                        workerEndedMs: watch.seen.endedAt[record.channel] ? advRound(watch.seen.endedAt[record.channel].at - cancelAt) : null,
                        recognitionAnsweredAfterCancel: advAnswered(record, 'recognize').filter((a) => a.at > cancelAt).map((a) => ({ status: a.status, ms: advRound(a.at - cancelAt) })),
                        closedHeard: closedHeardAt, browser: await browserSettles(0), counts: t.counts(), records: t.records(),
                        unavailable: t.store.getSnapshot().ocr?.unavailable ?? null, gate: gateOf(t), sheet: advSheetState(t.s, t.raster),
                    };
                } else {
                    const heardClosed = await until(() => (plan.record?.heldAcks?.length ?? 0) > 0, 'the Worker said closed (withheld)', 60000).then(() => true, () => false);
                    await tick();
                    const tooSoon = await t.store.startExtraction([t.raster]);
                    const whileUnknown = { heardClosedAfterMs: heardClosed ? advRound(advNow() - cancelAt) : null, phase: t.store.getSnapshot().operation?.phase ?? null, gate: gateOf(t), counts: t.counts(), next: tooSoon.refusal?.code ?? tooSoon.outcome };
                    const fired = CLOSE_MS === null ? 0 : t.clock.fire(CLOSE_MS);
                    const ended = await within(run, 30000);
                    const afterDeadline = { fired, settled: ended.settled, report: advReport(ended.value?.report), operation: plainly(t.store.getSnapshot().operation), gate: gateOf(t), unavailable: t.store.getSnapshot().ocr?.unavailable ?? null, counts: t.counts(), records: t.records(), sheet: advSheetState(t.s, t.raster) };
                    late.resolve();
                    await tick();
                    await tick();
                    const afterLate = { counts: t.counts(), records: t.records(), unavailable: t.store.getSnapshot().ocr?.unavailable ?? null, next: await t.store.startExtraction([t.raster]).then((x) => x.refusal?.code ?? x.outcome) };
                    out.R3N = { atCancel, whileUnknown, afterDeadline, afterLate };
                    plan.record?.worker.terminate();
                }
                watch.stop();
                await t.done();
            }

            // ST:<action>. Cancelled at a stage of the recogniser's start, as soon as the page has asked the Worker for
            //     that job and before it answers: 'load' (the core), 'loadLanguage' (the language data), 'initialize'.
            //     And ST:recognize: during a real recognition (the R1 trigger). Correctness here; times are recorded.
            if (typeof which === 'string' && which.startsWith('ST:')) {
                const stage = which.slice(3);
                const t = await setup();
                const watch = advWatch(t);
                const n0 = ocrStart.made.length;
                const run = t.store.extract({ sheetIds: [t.raster] });
                let record = null;
                let caught = null;
                await until(() => {
                    if (stage === 'recognize') {
                        const f = advInRecognition(n0);
                        if (f) { record = f.record; caught = { askedAt: f.askedAt, lastProgress: f.progress.at(-1).p }; }
                        return Boolean(f);
                    }
                    for (const r of advMadeSince(n0)) {
                        const asked = advAsked(r, stage);
                        if (asked.length > 0 && advAnswered(r, stage).length < asked.length) { record = r; caught = { askedAt: asked.at(-1).at }; return true; }
                        // The stage already passed (it answered before the poll saw it): too late to cancel inside it.
                        if (advAnswered(r, stage).length > 0) { record = r; caught = { missed: true }; return true; }
                    }
                    return false;
                }, `the recogniser at ${stage}`, 120000);
                const cancelAt = advNow();
                watch.seen.cancelAt = cancelAt;
                const answeredAtCancel = record ? (record.answered ?? []).map((a) => `${a.action}:${a.status}`) : [];
                t.store.cancelExtraction();
                const { report } = await run;
                const gone = await advBrowserGone(cancelAt);
                out[which] = {
                    stage, caught: caught ? { ...caught, sinceAskedMs: caught.askedAt === undefined ? null : advRound(cancelAt - caught.askedAt) } : null,
                    answeredAtCancel, unlockMs: watch.seen.unlockedAt === null ? null : advRound(watch.seen.unlockedAt - cancelAt),
                    workerEnded: record ? watch.seen.endedAt[record.channel]?.ended ?? null : null,
                    workerEndedMs: record && watch.seen.endedAt[record.channel] ? advRound(watch.seen.endedAt[record.channel].at - cancelAt) : null,
                    browserGoneMs: gone.ms, browserAfter: gone.count, report: advReport(report), sheet: advSheetState(t.s, t.raster),
                    recognizeAskedAfterCancel: record ? advAsked(record, 'recognize').filter((a) => a.at > cancelAt).length : 0,
                    counts: t.counts(), unavailable: t.store.getSnapshot().ocr?.unavailable ?? null, gate: gateOf(t),
                    // The start's own timeline (ms from the Worker's first job asked): how long each stage took here.
                    timeline: record ? (() => {
                        const t0 = (record.asked ?? [])[0]?.at ?? cancelAt;
                        return [
                            ...(record.asked ?? []).map((a) => ({ job: a.action, event: 'asked', ms: advRound(a.at - t0) })),
                            ...(record.answered ?? []).map((a) => ({ job: a.action, event: a.status, ms: advRound(a.at - t0) })),
                            { job: 'cancel', event: 'asked', ms: advRound(cancelAt - t0) },
                        ].sort((x, y) => x.ms - y.ms);
                    })() : null,
                };
                watch.stop();
                await t.done();
            }
            // The recogniser's own input: each recognition hands tesseract.js one data URL of the region (the existing
            // OCR engine). Counted so the privacy check can tell them from any other export.
            out.recogniser = {
                recognitions: ocrStart.log.slice(logBefore).filter((l) => l.endsWith(':recognize:asked')).length,
                toDataURL: window.__exports.toDataURL - exportsBefore.toDataURL,
                toBlob: window.__exports.toBlob - exportsBefore.toBlob,
            };
            out.browserAtEnd = await browserSettles(0);
            out.workers = workers();
            return plainly(out);
        }

        // T-01 / H-12: where a profile's rectangles land on the viewer, and back, for every rotation, offset and zoom.
        async function pointer(geometryTruth) {
            const geometry = await fixture(P2A, 'p2a-geometry');
            const r = rig();
            const host = document.createElement('div');
            host.style.cssText = 'width: 900px; height: 700px;';
            document.body.appendChild(host);
            const root = createRoot(host);
            await r.owner.open('A', geometry.file, geometry.expected);
            const source = { id: 'A', displayName: 'p2a-geometry.pdf', fingerprint: { sha256: geometry.expected.sha256, byteLength: geometry.expected.byteLength, pageCount: 8 } };
            const seen = { geometry: null };
            const rows = [];
            for (const pageTruth of geometryTruth.pages) {
                const sheet = { id: `sheet-${pageTruth.page}`, pageNumber: pageTruth.page };
                const overlay = (g) => { seen.geometry = g; return null; };
                root.render(createElement(ReadOnlySheetViewer, { owner: r.owner, source, file: geometry.file, sheet, pageTotal: 8, overlay }));
                const state = () => host.querySelector('[data-ds-viewer]')?.dataset.dsRenderState ?? '';
                await until(() => state() === 'rendered' && host.querySelector('canvas')?.dataset.dsRenderedSheet === sheet.id, `page ${pageTruth.page}`);
                for (const zoomClicks of [0, 2, 4]) {
                    for (let i = 0; i < zoomClicks; i++) host.querySelector('[data-ds-zoom-in]').click();
                    await tick();
                    await until(() => state() === 'rendered' && seen.geometry, 'the zoomed render');
                    await frames(1);
                    const g = seen.geometry;
                    const canvasBox = host.querySelector('canvas').getBoundingClientRect();
                    let worstToTruth = 0;
                    let worstRoundTrip = 0;
                    for (const name of FIELDS) {
                        const upright = pageTruth.uprightRects[name];
                        const display = pageTruth.displayRects[name];
                        const box = uprightToScreen(upright, g);
                        // Against the generator's own display rectangle, in CSS px.
                        worstToTruth = Math.max(worstToTruth, Math.abs(box.left - display.left * g.cssScale), Math.abs(box.top - display.top * g.cssScale),
                            Math.abs(box.left + box.width - display.right * g.cssScale), Math.abs(box.top + box.height - display.bottom * g.cssScale));
                        // A drag over that box back to upright points, in CSS px.
                        const back = dragToUpright({ x: box.left, y: box.top }, { x: box.left + box.width, y: box.top + box.height }, g);
                        worstRoundTrip = Math.max(worstRoundTrip, ...['left', 'top', 'right', 'bottom'].map((k) => Math.abs(back[k] - upright[k]) * g.cssScale));
                    }
                    rows.push({
                        page: pageTruth.page, rotate: pageTruth.rotate, offset: pageTruth.offset, zoomClicks, cssScale: g.cssScale, viewerRotate: g.rotate,
                        upright: uprightSize(g), uprightTruth: pageTruth.upright, canvasCss: [canvasBox.width, canvasBox.height],
                        worstToTruth, worstRoundTrip,
                    });
                    if (zoomClicks > 0) {
                        seen.geometry = null;
                        for (let i = 0; i < zoomClicks; i++) host.querySelector('[data-ds-zoom-out]').click();
                        await tick();
                        await until(() => state() === 'rendered' && seen.geometry, 'the zoom back');
                    }
                }
            }
            root.unmount();
            host.remove();
            await r.owner.close();
            return plainly({ rows, record: lastRecord(r.owner) });
        }

        function storage() {
            return {
                writes: plainly(window.__storage),
                local: localStorage.length,
                session: sessionStorage.length,
                objectUrls: window.__objectUrls.size,
                exports: plainly(window.__exports),
            };
        }

        // M7-ADV-VERIFY-01: what a confirmation keeps through readings after it (T-REREAD-SAME-BASIS / T-REREAD-FAIL-KEEPS).
        // A native Sheet (register p.1) confirmed with a corrected value, then read again: under the same profile
        // revision to its end; read again and cancelled; read again and failed (its File not handed over). Test only.
        async function advRetention() {
            const s = await observedStore();
            const id = s.register1;
            const state = () => {
                const sh = s.sheet(id);
                const c = s.store.currencyOf(sh);
                return {
                    confirmation: sh.confirmation ? JSON.stringify(sh.confirmation) : null, history: sh.confirmationHistory.length,
                    observationRunId: sh.observation?.runId ?? null, observation: sh.observation ? JSON.stringify(sh.observation) : null,
                    confirmationCurrency: c ? currencyLabel(c.confirmation) : null, observationCurrency: c ? currencyLabel(c.observation) : null,
                    runs: s.store.currentSet().analysisRuns.length,
                };
            };
            const report = (r) => (r?.kind === 'finished' ? { outcome: r.outcome, committed: r.committedSheetIds.length, excluded: r.excluded.map((e) => e.code) } : plainly(r));
            const out = {};
            const prepared = await s.prepare(id);
            if (!prepared.ok) throw new Error(`prepare: ${prepared.refusal.code}`);
            const values = { ...s.valuesOf(id), drawingTitle: `${s.valuesOf(id).drawingTitle}（改）` };
            out.confirmed = s.confirm(id, prepared.handle, values);
            out.afterConfirm = state();
            // A handle drawn now, and kept, as a screen that was left open would keep it.
            const kept = await s.prepare(id);
            out.keptHandle = kept.ok;

            // A. The same Sheet read again, under the same profile revision, to its end.
            const same = await s.store.extract({ sheetIds: [id] });
            out.sameBasis = { report: report(same.report), after: state() };
            out.keptHandleAfter = kept.ok ? s.confirm(id, kept.handle, values) : { ok: false, code: 'NOT_DRAWN' };
            out.afterKeptHandle = state();

            // B. Read again and cancelled as soon as it starts its Source: nothing of it may land.
            const beforeCancel = state();
            const cancelled = await s.store.extract({ sheetIds: [id] }, { onProgress: (e) => { if (e.phase === 'source') s.store.cancelExtraction(); } });
            out.cancelled = { report: report(cancelled.report), before: beforeCancel, after: state() };

            // C. Read again and failed: the File is not handed over (SOURCE_MISSING).
            const beforeFail = state();
            const failed = await s.store.extract({ sheetIds: [id] }, { fileFor: () => null });
            out.failed = { report: report(failed.report), before: beforeFail, after: state() };
            await s.dispose();
            return out;
        }

        window.__m7p2b2 = { ownerRelease, baseline, viewerAndCrop, evidence, sessions, lock, summaries, ocrInit, pointer, storage, advRetention };
        window.__m7p2b2Ready = true;
        document.getElementById('state').textContent = 'ready';
    </script>
