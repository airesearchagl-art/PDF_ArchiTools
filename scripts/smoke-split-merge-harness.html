<body>
<p id="state">loading…</p>
<script type="module">
/**
 * Drives the **production** M6 orchestration over the synthetic corpus.
 *
 * Nothing here re-implements a check. The boundary, the planner, the detectors,
 * the runners and the readback are the same modules the app ships; if this file
 * and `src/utils/split-merge` disagree, the gate fails, which is the point.
 *
 * It runs in a real browser because two of the things being asserted — that the
 * work happens in a Worker, and that a superseded run publishes nothing — are
 * properties of the browser build rather than of the modules.
 */
import {
    M6_STATUS,
    INTAKE_RESULT,
    LOAD_REFUSAL,
    PROVISIONAL_POLICY,
    MECHANISM_BOUNDS,
    inspectLoadBoundary,
    policyFrom,
    assertEnforceablePolicy,
    planExtract,
    runExtract,
    intakeSources,
    planMerge,
    runMerge,
    mergeConfirmationFingerprint,
    planStructuralGraph,
    reachableGraph,
    comparePlanWithActual,
    readbackArtifact,
    describeOptionalContent,
    planOptionalContent,
    readForm,
    planFormForExtract,
    scanJavaScript,
    censusJavaScript,
    censusSignatures,
    readSourceFacts,
    measureDestinationInvariants,
    rebuildDestinations,
    extractOutputName,
    mergeOutputName,
    describeSelection,
    extractInWorker,
    mergeInWorker,
    intakeInWorker,
    workerAvailable,
    censusIndirectObjects,
    countByCensus,
    CENSUS_BUDGET,
    carriesJavaScript,
    scrubAllJavaScript,
    snapshotMetadata,
    metadataGaps,
    infoText,
    checkArtifactInvariants,
    contentDigest,
    contentDigestJs,
    UNNAMED_ATTACHMENT_LABEL,
} from '/src/utils/split-merge/index.ts';
import {
    PDFArray, PDFDict, PDFDocument, PDFHexString, PDFName, PDFRawStream, PDFRef, PDFString,
} from 'pdf-lib';
// Round 5's independent reader. PDF.js shares no code with pdf-lib: an
// encoding defect in the writer cannot hide behind the same library's parser.
import * as pdfjsLib from 'pdfjs-dist';

pdfjsLib.GlobalWorkerOptions.workerSrc = '/pdf.worker.min.mjs';

const FIXTURES = '/test-fixtures/m6-split-merge-production';
const cache = new Map();

async function bytesOf(name) {
    if (!cache.has(name)) {
        const response = await fetch(`${FIXTURES}/${name}.pdf`);
        if (!response.ok) throw new Error(`fixture ${name} missing (${response.status})`);
        cache.set(name, new Uint8Array(await response.arrayBuffer()));
    }
    // A fresh copy each time: several of these get transferred to a worker.
    const held = cache.get(name);
    const copy = new Uint8Array(held.length);
    copy.set(held);
    return copy;
}

/** Every value that crosses back to the driver has to survive JSON. */
const plainly = (value) => JSON.parse(JSON.stringify(value ?? null));

window.__m6 = {
    constants: () => plainly({
        status: M6_STATUS,
        intake: INTAKE_RESULT,
        refusal: LOAD_REFUSAL,
        policy: PROVISIONAL_POLICY,
        mechanismBounds: MECHANISM_BOUNDS,
        workerAvailable: workerAvailable(),
    }),

    /** The pre-parse boundary, on raw bytes, with optional limit overrides. */
    boundary: async (name, overrides) => {
        const policy = policyFrom(overrides ? { loadBoundary: overrides } : {});
        const verdict = inspectLoadBoundary(await bytesOf(name), policy.loadBoundary);
        return plainly({
            verdict: verdict.verdict,
            code: verdict.code ?? null,
            stage: verdict.stage,
            reason: verdict.reason ?? null,
            stats: verdict.stats,
        });
    },

    /** Whether the policy validator rejects a limit that cannot refuse. */
    policyRejects: (patch) => {
        try {
            assertEnforceablePolicy({ ...PROVISIONAL_POLICY, ...patch });
            return { rejected: false };
        } catch (error) {
            return { rejected: true, message: String(error.message) };
        }
    },

    facts: async (name) => {
        const bytes = await bytesOf(name);
        const doc = await PDFDocument.load(bytes, { updateMetadata: false });
        return plainly(readSourceFacts(doc, bytes.length));
    },

    plan: async (name, selection, options = {}) => {
        const plan = await planExtract(await bytesOf(name), {
            selection,
            sourceName: `${name}.pdf`,
            ...options,
            policy: options.policyOverrides ? policyFrom(options.policyOverrides) : undefined,
        });
        return plainly({
            status: plan.status,
            reason: plan.reason ?? null,
            structural: plan.structural,
            losses: plan.losses,
            requiresConfirmation: plan.requiresConfirmation,
            detail: plan.detail ?? null,
            facts: plan.facts,
        });
    },

    extract: async (name, selection, options = {}) => {
        const result = await runExtract(await bytesOf(name), {
            selection,
            sourceName: `${name}.pdf`,
            confirmedLosses: options.confirmedLosses,
            destinationPolicy: options.destinationPolicy,
            policy: options.policyOverrides ? policyFrom(options.policyOverrides) : undefined,
        });
        return plainly({
            status: result.status,
            reason: result.reason ?? null,
            outputName: result.outputName,
            outputBytes: result.bytes ? result.bytes.length : null,
            planned: result.planned,
            actual: result.actual,
            readback: result.readback,
            losses: result.losses,
            detail: result.detail ?? null,
        });
    },

    /** The same extract, driven through the disposable Worker. */
    extractViaWorker: async (name, selection) => {
        const handle = extractInWorker(await bytesOf(name), {
            sourceName: `${name}.pdf`,
            selection,
            destinationPolicy: 'E2',
        });
        const result = await handle.promise;
        return plainly({
            status: result.status,
            outputName: result.outputName,
            outputBytes: result.bytes ? result.bytes.length : null,
            readback: result.readback,
        });
    },

    /** Start a run in a Worker, cancel it immediately, and see what comes back. */
    extractCancelled: async (name, selection) => {
        const handle = extractInWorker(await bytesOf(name), {
            sourceName: `${name}.pdf`,
            selection,
            destinationPolicy: 'E2',
        });
        handle.cancel();
        const result = await Promise.race([
            handle.promise,
            new Promise((resolve) => setTimeout(() => resolve({ status: 'NO_ANSWER', bytes: null }), 4000)),
        ]);
        return plainly({ status: result.status, published: Boolean(result.bytes) });
    },

    intake: async (names, types = {}) => {
        const inputs = [];
        for (const name of names) {
            inputs.push({
                id: name,
                name: `${name}.pdf`,
                type: types[name] ?? 'application/pdf',
                bytes: await bytesOf(name),
            });
        }
        return plainly(await intakeSources(inputs));
    },

    merge: async (names, options = {}) => {
        const inputs = [];
        for (const name of names) {
            inputs.push({
                id: name,
                name: `${name}.pdf`,
                type: options.types?.[name] ?? 'application/pdf',
                bytes: await bytesOf(name),
            });
        }
        const intake = await intakeSources(inputs);
        const plan = planMerge(intake, options);
        const result = await runMerge(inputs, plan, {
            confirmedLosses: plan.requiresConfirmation,
            ...options,
            policy: options.policyOverrides ? policyFrom(options.policyOverrides) : undefined,
        });
        return plainly({
            planStatus: plan.status,
            status: result.status,
            reason: result.reason ?? null,
            outputName: result.outputName,
            outputBytes: result.bytes ? result.bytes.length : null,
            intake: result.intake.map((r) => ({ name: r.name, result: r.result, pages: r.pageCount })),
            cumulative: result.cumulative,
            readback: result.readback,
            renamedFields: result.renamedFields,
            detail: result.detail ?? null,
        });
    },

    mergeViaWorker: async (names) => {
        const inputs = [];
        for (const name of names) {
            inputs.push({ id: name, name: `${name}.pdf`, type: 'application/pdf', bytes: await bytesOf(name) });
        }
        const intake = await intakeInWorker(inputs.map((i) => ({ ...i })), undefined).promise;
        const plan = planMerge(intake, {});
        const result = await mergeInWorker(inputs, plan, {
            metadataPolicy: 'M4',
            collisionPolicy: 'rename',
        }).promise;
        return plainly({
            status: result.status,
            outputBytes: result.bytes ? result.bytes.length : null,
            readback: result.readback,
        });
    },

    /**
     * A5, measured directly: the planner's count against the real copy.
     *
     * Deliberately not routed through `runExtract`, so the gate sees the two
     * numbers itself rather than the run's opinion of whether they matched.
     */
    planVersusCopy: async (name, selection) => {
        const bytes = await bytesOf(name);
        const source = await PDFDocument.load(bytes, { updateMetadata: false });

        // The same transformation the Extract plan applies, so what is counted
        // is the graph that will be copied.
        const { planDestinations, stripInternalDestinations } =
            await import('/src/utils/split-merge/destinations.ts');
        const destinations = planDestinations(source, selection);
        stripInternalDestinations(source, destinations, selection);

        const predicted = await planStructuralGraph(source, selection);

        const out = await PDFDocument.create({ updateMetadata: false });
        let before = 0;
        let beforeBytes = 0;
        for (const [, obj] of out.context.enumerateIndirectObjects()) {
            before += 1;
            if (obj instanceof PDFRawStream) beforeBytes += obj.contents.length;
        }
        const copied = await out.copyPages(source, selection);
        let after = 0;
        let afterBytes = 0;
        for (const [, obj] of out.context.enumerateIndirectObjects()) {
            after += 1;
            if (obj instanceof PDFRawStream) afterBytes += obj.contents.length;
        }
        copied.forEach((p) => out.addPage(p));
        const actual = reachableGraph(out, out.getPageIndices());

        return plainly({
            predicted,
            registeredObjects: after - before,
            registeredStreamBytes: afterBytes - beforeBytes,
            comparison: comparePlanWithActual(predicted, actual),
        });
    },

    /** What today's code does, for contrast. No E2, no readback, no refusal. */
    baseline: async (name, selection) => {
        const source = await PDFDocument.load(await bytesOf(name), { updateMetadata: false });
        const out = await PDFDocument.create({ updateMetadata: false });
        const copied = await out.copyPages(source, selection);
        copied.forEach((p) => out.addPage(p));
        const bytes = await out.save();
        return plainly(await readbackArtifact(bytes));
    },

    optionalContent: async (name, selection) => {
        const doc = await PDFDocument.load(await bytesOf(name), { updateMetadata: false });
        const description = describeOptionalContent(doc, selection);
        return plainly({
            present: description.present,
            unsupported: description.unsupported,
            groups: description.groups.map((g) => g.name),
            plan: planOptionalContent(description).status,
        });
    },

    form: async (name, selection) => {
        const doc = await PDFDocument.load(await bytesOf(name), { updateMetadata: false });
        const form = readForm(doc);
        const plan = planFormForExtract(form, selection);
        return plainly({
            present: form.present,
            outsideSubset: form.outsideSubset,
            fields: form.fields.map((f) => ({ name: f.name, ft: f.ft, value: f.value })),
            plan: plan.status,
            code: plan.code ?? null,
        });
    },

    javascript: async (name) => {
        const doc = await PDFDocument.load(await bytesOf(name), { updateMetadata: false });
        const scan = scanJavaScript(doc);
        // The artifact-wide number comes from the census, which is the only
        // thing in the package that claims to have looked everywhere.
        const census = censusJavaScript(doc);
        return plainly({
            reachable: scan.count,
            artifactWide: census.complete ? census.value.length : null,
            complete: scan.complete,
            incomplete: scan.incomplete,
        });
    },

    /** Names, which M6-H14 made deterministic and self-describing. */
    names: (sourceName, selection, mergeNames) => plainly({
        extract: extractOutputName(sourceName, selection),
        selection: describeSelection(selection),
        merge: mergeOutputName(mergeNames),
    }),

    /** Whether an artifact still holds tagging or an attachment. */
    artifactStructure: async (name, selection) => {
        const result = await runExtract(await bytesOf(name), {
            selection,
            sourceName: `${name}.pdf`,
            confirmedLosses: ['tagging', 'attachments'],
        });
        if (!result.bytes) return plainly({ status: result.status });
        const doc = await PDFDocument.load(result.bytes, { updateMetadata: false });
        let structParents = 0;
        for (const page of doc.getPages()) {
            if (page.node.get(PDFName.of('StructParents')) !== undefined) structParents += 1;
        }
        let filespecs = 0;
        for (const [, obj] of doc.context.enumerateIndirectObjects()) {
            const type = obj?.get?.(PDFName.of('Type'))?.asString?.();
            if (type === '/Filespec') filespecs += 1;
        }
        return plainly({
            status: result.status,
            structTreeRoot: doc.catalog.get(PDFName.of('StructTreeRoot')) !== undefined,
            structParents,
            filespecs,
            destinations: measureDestinationInvariants(doc),
            losses: result.losses.map((l) => l.kind),
        });
    },
};

/**
 * An INDEPENDENT artifact walker.
 *
 * Deliberately written here rather than imported from `src/utils/split-merge`.
 * The production scanner is the thing under test: three of the Independent
 * Review's findings were cases where it reported zero about a file that carried
 * the thing. An oracle that asked the same code the same question would have
 * agreed with it every time.
 */
function walkEverything(doc) {
    const out = {
        javascript: 0,
        fileAttachmentAnnots: 0,
        filespecsWithEF: 0,
        efCarriers: 0,
        embeddedFileStreams: 0,
        orphanPages: 0,
        strayPageRefs: 0,
        structTreeRoot: false,
        markInfo: false,
        structParents: 0,
        structParent: 0,
        objects: 0,
    };
    const nameOf = (v) => (typeof v?.asString === 'function' ? v.asString() : '');
    const inTree = new Set(doc.getPages().map((pg) => pg.ref.tag));
    out.structTreeRoot = doc.catalog.get(PDFName.of('StructTreeRoot')) !== undefined;
    out.markInfo = doc.catalog.get(PDFName.of('MarkInfo')) !== undefined;

    const seen = new Set();
    const walk = (value, depth) => {
        if (!value || depth > 200) return;
        if (seen.has(value)) return;
        seen.add(value);
        const dict = value instanceof PDFDict
            ? value
            : (value?.dict instanceof PDFDict ? value.dict : null);
        if (dict) {
            if (nameOf(dict.get(PDFName.of('S'))) === '/JavaScript'
                || dict.get(PDFName.of('JS')) !== undefined) out.javascript += 1;
            if (nameOf(dict.get(PDFName.of('Subtype'))) === '/FileAttachment') {
                out.fileAttachmentAnnots += 1;
            }
            if (nameOf(dict.get(PDFName.of('Type'))) === '/Filespec'
                && dict.get(PDFName.of('EF')) !== undefined) out.filespecsWithEF += 1;
            // Any `/EF` at all, declared or not: the semantic carrier.
            if (dict.get(PDFName.of('EF')) !== undefined) out.efCarriers += 1;
            if (nameOf(dict.get(PDFName.of('Type'))) === '/EmbeddedFile') {
                out.embeddedFileStreams += 1;
            }
            if (dict.get(PDFName.of('StructParents')) !== undefined) out.structParents += 1;
            if (dict.get(PDFName.of('StructParent')) !== undefined) out.structParent += 1;
            for (const [, entry] of dict.entries()) walk(entry, depth + 1);
            return;
        }
        if (value instanceof PDFArray) {
            for (let i = 0; i < value.size(); i += 1) walk(value.get(i), depth + 1);
        }
    };

    for (const [ref, obj] of doc.context.enumerateIndirectObjects()) {
        out.objects += 1;
        const type = obj?.get?.(PDFName.of('Type'))?.asString?.();
        if (type === '/Page' && !inTree.has(ref.tag)) out.orphanPages += 1;
        walk(obj, 0);
    }

    // A page reference that does not resolve into this document's own tree.
    const strayRef = (raw) => {
        if (!(raw instanceof PDFRef)) return false;
        let target;
        try { target = doc.context.lookup(raw); } catch { return false; }
        if (!(target instanceof PDFDict)) return false;
        if (nameOf(target.get(PDFName.of('Type'))) !== '/Page') return false;
        return !inTree.has(raw.tag);
    };
    const actionSeen = new Set();
    const walkAction = (raw, depth) => {
        if (depth > 64) return;
        let action = raw;
        if (raw instanceof PDFRef) { try { action = doc.context.lookup(raw); } catch { return; } }
        if (!(action instanceof PDFDict) || actionSeen.has(action)) return;
        actionSeen.add(action);
        let dest = action.get(PDFName.of('D'));
        if (dest instanceof PDFRef) { try { dest = doc.context.lookup(dest); } catch { dest = null; } }
        if (dest instanceof PDFArray && strayRef(dest.get(0))) out.strayPageRefs += 1;
        let next = action.get(PDFName.of('Next'));
        if (next instanceof PDFRef) { try { next = doc.context.lookup(next); } catch { next = null; } }
        if (next instanceof PDFArray) {
            for (let i = 0; i < next.size(); i += 1) walkAction(next.get(i), depth + 1);
        } else if (next) walkAction(next, depth + 1);
    };
    const walkAa = (owner) => {
        let aa = owner.get(PDFName.of('AA'));
        if (aa instanceof PDFRef) { try { aa = doc.context.lookup(aa); } catch { aa = null; } }
        if (!(aa instanceof PDFDict)) return;
        for (const [, entry] of aa.entries()) walkAction(entry, 0);
    };
    for (const pg of doc.getPages()) {
        walkAa(pg.node);
        let annots = pg.node.get(PDFName.of('Annots'));
        if (annots instanceof PDFRef) { try { annots = doc.context.lookup(annots); } catch { annots = null; } }
        if (!(annots instanceof PDFArray)) continue;
        for (let i = 0; i < annots.size(); i += 1) {
            let annot = annots.get(i);
            if (annot instanceof PDFRef) { try { annot = doc.context.lookup(annot); } catch { continue; } }
            if (!(annot instanceof PDFDict)) continue;
            if (strayRef(annot.get(PDFName.of('P')))) out.strayPageRefs += 1;
            let d = annot.get(PDFName.of('Dest'));
            if (d instanceof PDFRef) { try { d = doc.context.lookup(d); } catch { d = null; } }
            if (d instanceof PDFArray && strayRef(d.get(0))) out.strayPageRefs += 1;
            walkAction(annot.get(PDFName.of('A')), 0);
            walkAa(annot);
        }
    }
    out.taggingRemnants = (out.structTreeRoot ? 1 : 0) + (out.markInfo ? 1 : 0)
        + out.structParents + out.structParent;
    return out;
}

/**
 * The gate's own `/Names /Dests` reader: `/Kids` and `<< /D [...] >>` included.
 *
 * Written here rather than imported, for the same reason `walkEverything` is.
 * RF-R3-5 was a production reader that could not see two standard shapes, and a
 * gate that asked that reader whether they survived would have agreed with it.
 */
function gateReadNames(doc) {
    const out = [];
    const names = doc.catalog.lookup(PDFName.of('Names'));
    if (!(names instanceof PDFDict)) return out;
    const pageTags = doc.getPages().map((page) => page.ref.tag);
    const walk = (node, depth) => {
        if (depth > 64) return;
        const dict = node instanceof PDFRef ? doc.context.lookup(node) : node;
        if (!(dict instanceof PDFDict)) return;
        const leaf = dict.lookup(PDFName.of('Names'));
        if (leaf instanceof PDFArray) {
            for (let i = 0; i + 1 < leaf.size(); i += 2) {
                const key = leaf.lookup(i);
                const label = typeof key?.decodeText === 'function' ? key.decodeText() : String(key);
                let value = leaf.lookup(i + 1);
                if (value instanceof PDFDict) value = value.lookup(PDFName.of('D'));
                let targetIndex = null;
                if (value instanceof PDFArray) {
                    const first = value.get(0);
                    if (first instanceof PDFRef) targetIndex = pageTags.indexOf(first.tag);
                }
                out.push({ name: label, targetIndex });
            }
        }
        const kids = dict.lookup(PDFName.of('Kids'));
        if (kids instanceof PDFArray) {
            for (let i = 0; i < kids.size(); i += 1) walk(kids.get(i), depth + 1);
        }
    };
    walk(names.lookup(PDFName.of('Dests')), 0);
    return out;
}

/** The gate's own read of `/OCProperties`, field by field. */
function gateReadOcConfig(doc) {
    const oc = doc.catalog.lookup(PDFName.of('OCProperties'));
    if (!(oc instanceof PDFDict)) return { present: false };
    const d = oc.lookup(PDFName.of('D'));
    const ocgs = oc.lookup(PDFName.of('OCGs'));
    const groups = [];
    if (ocgs instanceof PDFArray) {
        for (let i = 0; i < ocgs.size(); i += 1) {
            const g = ocgs.lookup(i);
            if (g instanceof PDFDict) {
                const n = g.lookup(PDFName.of('Name'));
                groups.push(typeof n?.decodeText === 'function' ? n.decodeText() : String(n));
            }
        }
    }
    if (!(d instanceof PDFDict)) return { present: true, hasD: false, groups };
    const nameValue = d.lookup(PDFName.of('Name'));
    const baseValue = d.lookup(PDFName.of('BaseState'));
    const orderValue = d.lookup(PDFName.of('Order'));
    const onValue = d.lookup(PDFName.of('ON'));
    const offValue = d.lookup(PDFName.of('OFF'));
    return {
        present: true,
        hasD: true,
        groups,
        keys: [...d.entries()].map((entry) => entry[0].asString()),
        name: nameValue === undefined || nameValue === null
            ? null
            : (typeof nameValue.decodeText === 'function' ? nameValue.decodeText() : String(nameValue)),
        baseState: baseValue === undefined || baseValue === null
            ? null
            : String(baseValue.asString ? baseValue.asString() : baseValue),
        order: orderValue instanceof PDFArray ? orderValue.size() : null,
        on: onValue instanceof PDFArray ? onValue.size() : null,
        off: offValue instanceof PDFArray ? offValue.size() : null,
    };
}

/** Whether a literal marker appears in the serialized bytes. */
function bytesContain(bytes, marker) {
    const needle = new TextEncoder().encode(marker);
    outer: for (let i = 0; i + needle.length <= bytes.length; i += 1) {
        for (let j = 0; j < needle.length; j += 1) {
            if (bytes[i + j] !== needle[j]) continue outer;
        }
        return true;
    }
    return false;
}

Object.assign(window.__m6, {
    /** Extract, then inspect the artifact with the independent walker. */
    extractAndInspect: async (name, selection, marker, options = {}) => {
        const result = await runExtract(await bytesOf(name), {
            selection,
            sourceName: `${name}.pdf`,
            confirmedLosses: options.confirmedLosses ?? ['tagging', 'attachments'],
            destinationPolicy: options.destinationPolicy,
        });
        if (!result.bytes) {
            return plainly({ status: result.status, reason: result.reason ?? null, independent: null });
        }
        const doc = await PDFDocument.load(result.bytes, { updateMetadata: false });
        return plainly({
            status: result.status,
            outputName: result.outputName,
            losses: result.losses,
            production: result.readback,
            independent: walkEverything(doc),
            markerInBytes: marker ? bytesContain(result.bytes, marker) : null,
        });
    },

    /** Merge, then inspect the artifact with the independent walker. */
    mergeAndInspect: async (names, marker, options = {}) => {
        const inputs = [];
        for (const name of names) {
            inputs.push({ id: name, name: `${name}.pdf`, type: 'application/pdf', bytes: await bytesOf(name) });
        }
        const intake = await intakeSources(inputs);
        const plan = planMerge(intake, options);
        // A confirmation is bound to the plan it was given for (RF-R3-3), so
        // the gate confirms the way the app does rather than by passing kinds.
        const result = await runMerge(inputs, plan, {
            confirmedLosses: plan.requiresConfirmation,
            confirmedFingerprint: mergeConfirmationFingerprint(plan),
            ...options,
        });
        if (!result.bytes) {
            return plainly({
                status: result.status,
                reason: result.reason ?? null,
                intake: result.intake.map((r) => ({ name: r.name, result: r.result })),
                independent: null,
            });
        }
        const doc = await PDFDocument.load(result.bytes, { updateMetadata: false });
        const oc = describeOptionalContent(doc, null);
        return plainly({
            status: result.status,
            intake: result.intake.map((r) => ({ name: r.name, result: r.result })),
            losses: result.losses,
            production: result.readback,
            independent: walkEverything(doc),
            markerInBytes: marker ? bytesContain(result.bytes, marker) : null,
            optionalContent: {
                present: oc.present,
                groups: oc.groups.map((g) => g.name),
                unsupported: oc.unsupported,
            },
        });
    },

    /** The Info dictionary and XMP of an extracted artifact, read back. */
    extractMetadata: async (name, selection) => {
        const result = await runExtract(await bytesOf(name), {
            selection, sourceName: `${name}.pdf`, confirmedLosses: ['tagging', 'attachments'],
        });
        if (!result.bytes) return plainly({ status: result.status, reason: result.reason ?? null });
        const doc = await PDFDocument.load(result.bytes, { updateMetadata: false });
        const info = {};
        const infoRef = doc.context.trailerInfo.Info;
        const dict = infoRef ? doc.context.lookup(infoRef) : null;
        if (dict instanceof PDFDict) {
            for (const [key, value] of dict.entries()) {
                const resolved = value instanceof PDFRef ? doc.context.lookup(value) : value;
                info[key.asString().replace(/^\//, '')] =
                    typeof resolved?.decodeText === 'function' ? resolved.decodeText() : String(resolved);
            }
        }
        return plainly({
            status: result.status,
            info,
            hasXmp: doc.catalog.get(PDFName.of('Metadata')) !== undefined,
            xmpMarkerInBytes: bytesContain(result.bytes, 'M6_XMP_MARKER'),
        });
    },

    /**
     * A Merge where one requested source was never decided.
     *
     * BLK-4: intake used to answer `[]` when the worker failed, and a Merge built
     * from that list omitted files the person chose while reporting success. The
     * `NOT_DECIDED` record here is what the hardened client now synthesises for
     * an input the worker never answered for, so this drives the same shape.
     */
    mergeUndecided: async (names) => {
        const inputs = [];
        for (const name of names) {
            inputs.push({ id: name, name: `${name}.pdf`, type: 'application/pdf', bytes: await bytesOf(name) });
        }
        const intake = await intakeSources(inputs);
        const damaged = intake.map((r, i) => (i === intake.length - 1
            ? { ...r, result: 'NOT_DECIDED', reason: 'このファイルは確認が完了しませんでした。' }
            : r));
        const plan = planMerge(damaged, {});
        const result = await runMerge(inputs, plan, {
            confirmedLosses: plan.requiresConfirmation,});
        return plainly({
            planStatus: plan.status,
            status: result.status,
            reason: result.reason ?? plan.reason ?? null,
            bytes: result.bytes ? result.bytes.length : null,
            intake: result.intake.map((r) => ({ name: r.name, result: r.result })),

    /**
     * A Merge driven with intake facts that claim every source is fine.
     *
     * The promoted ADV-7: main-thread intake facts are UX facts. In a worker they
     * arrive as a message, and a message is not an authority. This hands the run
     * an ACCEPTED record for a source whose bytes hold a form outside the adopted
     * envelope, and the run has to refuse on what it reads rather than on what it
     * was told.
     */
    mergeWithFalseIntake: async (names) => {
        const inputs = [];
        for (const name of names) {
            inputs.push({ id: name, name: `${name}.pdf`, type: 'application/pdf', bytes: await bytesOf(name) });

        // and a record without one is refused before its facts are looked at.
        // So the forgery here carries the TRUE digest of the bytes — the
        // stronger adversary — and the run still has to refuse on what it
        // reads, which is what this probe exists to show.
        const lying = [];
        for (const i of inputs) {
            lying.push({
                id: i.id,
                name: i.name,
                sizeBytes: i.bytes.length,
                result: 'ACCEPTED',

                pageTreeWalks: true,
                hasAcroForm: false,
                fieldNames: [],
                hasOptionalContent: false,

        const result = await runMerge(inputs, plan, {
            confirmedLosses: plan.requiresConfirmation,});

            planStatus: plan.status,
            status: result.status,
            reason: result.reason ?? null,
            bytes: result.bytes ? result.bytes.length : null,
        });
    },

    /** A Merge run WITHOUT confirming what the plan says needs confirming. */
    /** Extract, then read the artifact's named destinations independently. */
    extractNamedDestinations: async (name, selection) => {
        const result = await runExtract(await bytesOf(name), {
            selection, sourceName: `${name}.pdf`, confirmedLosses: ['tagging', 'attachments'],
        });
        const base = {
            status: result.status,
            reason: result.reason ?? null,

    /** Merge, then read the artifact's named destinations independently. */
    mergeNamedDestinations: async (names) => {
        const inputs = [];
        for (const name of names) {
            inputs.push({ id: name, name: `${name}.pdf`, type: 'application/pdf', bytes: await bytesOf(name) });
        }
        const intake = await intakeSources(inputs);
        const plan = planMerge(intake, {});
        const result = await runMerge(inputs, plan, {
            confirmedLosses: plan.requiresConfirmation,

        const base = {
            status: result.status,
            reason: result.reason ?? null,

     * RF-R3-1 passed every existing check because they counted groups. The
     * configuration those groups are shown under was gone.
     */
    mergeOptionalContentConfig: async (names) => {
        const inputs = [];
        for (const name of names) {
            inputs.push({ id: name, name: `${name}.pdf`, type: 'application/pdf', bytes: await bytesOf(name) });
        }
        const intake = await intakeSources(inputs);
        const plan = planMerge(intake, {});
        const result = await runMerge(inputs, plan, {

    /** The same, read off a source, so the gate can compare like with like. */
    sourceOptionalContentConfig: async (name) => {

    /**
     * What a Merge does with a confirmation that was given for a different plan.
     *
     * `mutate` names how the input set changes after the confirmation: the
     * fingerprint is taken from the first plan and offered to the second.
     */
    mergeStaleConfirmation: async (names, mutate) => {
        const build = async (list) => {
            const inputs = [];
            for (const name of list) {
                inputs.push({ id: name, name: `${name}.pdf`, type: 'application/pdf', bytes: await bytesOf(name) });
            }
            const intake = await intakeSources(inputs);
            return { inputs, plan: planMerge(intake, {}) };
        };
        const first = await build(names);
        const firstFingerprint = mergeConfirmationFingerprint(first.plan);

        let secondNames = names;
        if (mutate === 'add') secondNames = [...names, 'merge-a'];
        else if (mutate === 'remove') secondNames = names.slice(0, names.length - 1);
        else if (mutate === 'reorder') secondNames = [...names].reverse();
        const second = await build(secondNames);
        const secondFingerprint = mergeConfirmationFingerprint(second.plan);

        const result = await runMerge(second.inputs, second.plan, {
            confirmedLosses: first.plan.requiresConfirmation,
            confirmedFingerprint: firstFingerprint,
        });

            mutate,
            fingerprintChanged: firstFingerprint !== secondFingerprint,
            requiresConfirmation: second.plan.requiresConfirmation,
            status: result.status,
            bytes: result.bytes ? result.bytes.length : null,
            losses: (result.losses ?? []).map((l) => ({ kind: l.kind, what: l.what ?? null })),

    },

    /** What intake says about a source's attachments, and what is really there. */
    attachmentFacts: async (name) => {
        const doc = await PDFDocument.load(await bytesOf(name), { updateMetadata: false });
        const facts = readSourceFacts(doc, 0);
        return plainly({
            hasAttachments: facts.hasAttachments,
            attachmentNames: facts.attachmentNames,
            attachmentsComplete: facts.attachmentsComplete,
            independent: walkEverything(doc),
        });
    },

    /**
     * What a reconstruction does when it is handed something it cannot apply.
     *
     * The same half of the contract the census-refusal probe exists for: every
     * document in the corpus produces an empty `unapplied`, so asserting on
     * them proves only that the happy path works. This drives the reconstruction
     * with a plan that names a page the output does not have, which is the
     * state the old `continue` turned into a successful count.
     */
    rebuildUnapplied: async () => {
        const out = await PDFDocument.create({ updateMetadata: false });
        out.addPage();

            rebuild: [{
                fromIndex: 0, annotIndex: 0, holderIsAction: false,
                targetIndex: 7, tail: [],

                key: { text: 'M6_NOWHERE', bytes: new TextEncoder().encode('M6_NOWHERE'), token: null },
                targetIndex: 9,

            unreadable: [],
            duplicateNames: [],

        const control = rebuildDestinations(
            out,
            { rebuild: [], survivingNames: [], losses: [], unreadable: [], duplicateNames: [] },

        );

            rebuilt: outcome.rebuilt,
            unapplied: outcome.unapplied,
            controlUnapplied: control.unapplied,

    mergeUnconfirmed: async (names) => {
        const inputs = [];
        for (const name of names) {
            inputs.push({ id: name, name: `${name}.pdf`, type: 'application/pdf', bytes: await bytesOf(name) });
        }
        const intake = await intakeSources(inputs);
        const plan = planMerge(intake, {});
        const result = await runMerge(inputs, plan, {});
        return plainly({
            requiresConfirmation: plan.requiresConfirmation,
            status: result.status,
            bytes: result.bytes ? result.bytes.length : null,
            losses: result.losses,
        });
    },

    /**
     * A census driven past its own budget, to prove what it does then.
     *
     * The whole architectural claim of round 3 is that a census ends COMPLETE
     * or REFUSED. Asserting that on documents it can cover proves only the
     * first half. This builds a document with direct nesting deeper than the
     * budget and asks for the same JavaScript count — the answer must be a
     * refusal, and the refusal must reach the scrubber, not a zero.
     *
     * These bytes would never get past the pre-parse Load Boundary, which
     * refuses at a far shallower nesting cap. That is the point: this is the
     * behaviour of the layer behind the gate, tested without the gate.
     */
    censusDeepDirect: async (depth) => {
        const doc = await PDFDocument.create({ updateMetadata: false });
        doc.addPage();
        let node = doc.context.obj({
            Type: 'Action', S: 'JavaScript', JS: PDFString.of('app.alert(1)'),
        });
        for (let i = 0; i < depth; i += 1) node = doc.context.obj([node]);
        doc.catalog.set(PDFName.of('M6Deep'), doc.context.register(node));
        const walked = censusIndirectObjects(doc, () => undefined);
        const counted = countByCensus(doc, ({ dict }) => carriesJavaScript(dict));
        const scrub = scrubAllJavaScript(doc);
        return plainly({
            depth,
            maxDirectDepth: CENSUS_BUDGET.maxDirectDepth,
            censusComplete: walked.complete,
            censusReason: walked.complete ? null : walked.reason,
            countComplete: counted.complete,
            count: counted.complete ? counted.value : null,
            scrubComplete: scrub.complete,
            scrubbed: scrub.complete ? scrub.scrubbed : null,
        });
    },

    /** A metadata snapshot, and whether the artifact's XMP still decodes. */
    metadataRoundTrip: async (name, selection) => {
        const source = await PDFDocument.load(await bytesOf(name), { updateMetadata: false });
        const snapshot = snapshotMetadata(source);
        const result = await runExtract(await bytesOf(name), {
            selection, sourceName: `${name}.pdf`, confirmedLosses: ['tagging', 'attachments'],
        });
        if (!result.bytes) return plainly({ status: result.status });
        const artifact = await PDFDocument.load(result.bytes, { updateMetadata: false });
        const after = snapshotMetadata(artifact);
        const text = (u8) => new TextDecoder().decode(u8 ?? new Uint8Array());
        return plainly({
            status: result.status,
            gaps: metadataGaps(snapshot, artifact),
            sourceFilters: snapshot.xmp ? snapshot.xmp.filters : [],
            sourceDecodable: snapshot.xmp ? snapshot.xmp.decodable : null,
            artifactFilters: after.xmp ? after.xmp.filters : [],
            artifactDecodable: after.xmp ? after.xmp.decodable : null,
            xmpEqual: text(snapshot.xmp && snapshot.xmp.decoded)
                === text(after.xmp && after.xmp.decoded),
            markerInDecoded: text(after.xmp && after.xmp.decoded)
                .includes('M6R3_XMP_FLATE_MARKER'),
            title: after.info.Title ? infoText(after.info.Title) : null,
        });
    },

    /**
     * Whether `copyPages` ran at all.
     *
     * RF-H asks for a refusal BEFORE the copy, not a readback after it. A
     * status alone cannot tell those apart, so the copy is counted for the
     * duration of one run and the method put back afterwards.
     */
    extractCountingCopies: async (name, selection) => {
        const original = PDFDocument.prototype.copyPages;
        let calls = 0;
        PDFDocument.prototype.copyPages = function counted(...args) {
            calls += 1;
            return original.apply(this, args);
        };
        try {
            const result = await runExtract(await bytesOf(name), {
                selection, sourceName: `${name}.pdf`,
                confirmedLosses: ['tagging', 'attachments'],
            });
            return plainly({ status: result.status, copyPagesCalls: calls });
        } finally {
            PDFDocument.prototype.copyPages = original;
        }
    },

    /** Facts a refusal depends on, for the inherited-signature cases. */
    signatureFacts: async (name) => {
        const bytes = await bytesOf(name);
        const doc = await PDFDocument.load(bytes, { updateMetadata: false });
        const facts = readSourceFacts(doc, bytes.length);
        return plainly({
            hasSignatureField: facts.hasSignatureField,
            hasAppliedSignature: facts.hasAppliedSignature,
            names: facts.signatureFieldNames,
        });
    },
});

// ============================================================================
// Round 5 — independent oracles
//
// The fourth Independent FULL Re-Review found that a pdf-lib writer read back by
// pdf-lib's own parser could not show the encoding defect it had. So everything
// below asks readers that share no code with the production writer: PDF.js for
// what a person sees, this project's Load Boundary for whether the bytes are a
// document at all, and small readers written here rather than imported.
// ============================================================================

/** SHA-256 from Web Crypto, never from the module under test. */
async function sha256Independent(bytes) {
    const digest = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(digest), (b) => b.toString(16).padStart(2, '0')).join('');
}

/** A PDF.js document over a private copy of the bytes. */
async function pdfjsOpen(bytes) {
    const data = new Uint8Array(bytes.length);
    data.set(bytes);
    return pdfjsLib.getDocument({ data, isEvalSupported: false, verbosity: 0 }).promise;
}

/** A destination PDF.js returned, as the index of the page it names. */
async function pdfjsPageOf(doc, dest) {
    let explicit = dest;
    if (typeof dest === 'string') explicit = await doc.getDestination(dest);
    if (!Array.isArray(explicit) || explicit.length === 0) return null;
    const target = explicit[0];
    if (Number.isInteger(target)) return target;
    try {
        return await doc.getPageIndex(target);
    } catch {
        return null;
    }
}

/**
 * What PDF.js reads: field names and values, named destinations and their
 * pages, the optional-content configuration's name and order, and where every
 * link on every page goes.
 */
async function pdfjsRead(bytes) {
    const doc = await pdfjsOpen(bytes);
    try {
        const out = { pages: doc.numPages, fields: {}, destinations: {}, oc: null, links: [], info: null };
        const meta = await doc.getMetadata();
        out.info = meta?.info
            ? Object.fromEntries(['Title', 'Author', 'Subject', 'Creator'].map((k) => [k, meta.info[k] ?? null]))
            : null;
        const fields = await doc.getFieldObjects();
        for (const [name, widgets] of Object.entries(fields ?? {})) {
            out.fields[name] = widgets
                .filter((w) => w.type !== undefined && w.type !== '')
                .map((w) => ({ type: w.type, value: w.value }));
        }
        const dests = await doc.getDestinations();
        for (const [name, dest] of Object.entries(dests ?? {})) {
            out.destinations[name] = await pdfjsPageOf(doc, dest);
        }
        const config = await doc.getOptionalContentConfig();
        out.oc = config ? { name: config.name ?? null, order: config.getOrder() ?? null } : null;
        for (let i = 1; i <= doc.numPages; i += 1) {
            const page = await doc.getPage(i);
            for (const annot of await page.getAnnotations()) {
                if (annot.subtype !== 'Link') continue;
                out.links.push({
                    page: i - 1,
                    target: annot.dest !== undefined && annot.dest !== null
                        ? await pdfjsPageOf(doc, annot.dest)
                        : null,
                });
            }
        }
        return out;
    } finally {
        await doc.destroy();
    }
}

/**
 * PDF.js looking a name up by its RAW BYTES, on a fresh document.
 *
 * `getDestination` first binary-searches the name tree comparing byte strings,
 * and only then falls back to a map keyed by decoded text. A raw id whose
 * decoded text differs from its bytes cannot be rescued by that fallback, so a
 * hit is proof the binary search found it — which is proof of the order. Fresh
 * per lookup, because once the fallback map exists PDF.js answers from it.
 */
async function pdfjsRawLookup(bytes, rawKey) {
    const doc = await pdfjsOpen(bytes);
    try {
        const dest = await doc.getDestination(rawKey);
        return dest ? await pdfjsPageOf(doc, dest) : null;
    } finally {
        await doc.destroy();
    }
}

/**
 * The bytes of a string object, decoded here.
 *
 * pdf-lib hands over the characters between the delimiters; the escapes are
 * undone by this gate's own code, not by the module that wrote them.
 */
function gateStringBytes(value) {
    const raw = typeof value?.asString === 'function' ? value.asString() : '';
    const out = [];
    if (value instanceof PDFHexString) {
        const digits = raw.replace(/[\s\0]/g, '');
        for (let i = 0; i < digits.length; i += 2) out.push(parseInt((digits[i] + (digits[i + 1] ?? '0')), 16));
        return out;
    }
    for (let i = 0; i < raw.length; i += 1) {
        const c = raw[i];
        if (c !== '\\') { out.push(raw.charCodeAt(i)); continue; }
        const e = raw[++i];
        const simple = { n: 10, r: 13, t: 9, b: 8, f: 12 };
        if (e in simple) out.push(simple[e]);
        else if (e === '\r') { if (raw[i + 1] === '\n') i += 1; }
        else if (e === '\n') { /* continuation */ }
        else if (e >= '0' && e <= '7') {
            let digits = e;
            while (digits.length < 3 && raw[i + 1] >= '0' && raw[i + 1] <= '7') digits += raw[++i];
            out.push(parseInt(digits, 8) & 0xff);
        } else out.push(e.charCodeAt(0));
    }
    return out;
}

const latin1Of = (bytes) => String.fromCharCode(...bytes);
const compareBytes = (a, b) => {
    for (let i = 0; i < Math.min(a.length, b.length); i += 1) if (a[i] !== b[i]) return a[i] - b[i];
    return a.length - b.length;
};

/** Every `/Names /Dests` key in the order written, as bytes, per leaf. */
function gateNameKeys(doc) {
    const leaves = [];
    const names = doc.catalog.lookup(PDFName.of('Names'));
    if (!(names instanceof PDFDict)) return leaves;
    const walk = (node, depth) => {
        if (depth > 64) return;
        const dict = node instanceof PDFRef ? doc.context.lookup(node) : node;
        if (!(dict instanceof PDFDict)) return;
        const leaf = dict.lookup(PDFName.of('Names'));
        if (leaf instanceof PDFArray) {
            const keys = [];
            for (let i = 0; i + 1 < leaf.size(); i += 2) keys.push(gateStringBytes(leaf.lookup(i)));
            leaves.push(keys);
        }
        const kids = dict.lookup(PDFName.of('Kids'));
        if (kids instanceof PDFArray) for (let i = 0; i < kids.size(); i += 1) walk(kids.get(i), depth + 1);
    };
    walk(names.lookup(PDFName.of('Dests')), 0);
    return leaves;
}

/** Every dictionary in the artifact, streams' included, reached from every object. */
function forEachDict(doc, visit) {
    const seen = new Set();
    const walk = (value, depth) => {
        if (!value || depth > 200 || seen.has(value)) return;
        seen.add(value);
        const dict = value instanceof PDFDict ? value : (value?.dict instanceof PDFDict ? value.dict : null);
        if (dict) {
            visit(dict);
            for (const [, entry] of dict.entries()) walk(entry, depth + 1);
            return;
        }
        if (value instanceof PDFArray) for (let i = 0; i < value.size(); i += 1) walk(value.get(i), depth + 1);
    };
    for (const [, obj] of doc.context.enumerateIndirectObjects()) walk(obj, 0);
}

const SIG_PAYLOAD_HEX = Array.from('M6R5_SIG_PAYLOAD', (c) => c.charCodeAt(0).toString(16).toUpperCase()).join('');

/** Signature remnants, counted by this gate. */
function gateSignatures(doc, bytes) {
    const out = { byteRange: 0, typeSig: 0, ftSig: 0, dictValues: 0 };
    const nameOf = (v) => (typeof v?.asString === 'function' ? v.asString() : '');
    forEachDict(doc, (dict) => {
        if (dict.get(PDFName.of('ByteRange')) !== undefined) out.byteRange += 1;
        if (['/Sig', '/DocTimeStamp'].includes(nameOf(dict.get(PDFName.of('Type'))))) out.typeSig += 1;
        if (nameOf(dict.get(PDFName.of('FT'))) === '/Sig') out.ftSig += 1;
        const v = dict.get(PDFName.of('V'));
        const resolved = v instanceof PDFRef ? doc.context.lookup(v) : v;
        if (resolved instanceof PDFDict) out.dictValues += 1;
    });
    out.appearanceMarker = bytesContain(bytes, 'M6R5_SIG_APPEARANCE');
    out.payloadMarker = bytesContain(bytes, SIG_PAYLOAD_HEX);
    return out;
}

/** Inputs with distinct ids, so the same file can be merged with itself. */
async function uniqueInputs(names) {
    const inputs = [];
    for (let i = 0; i < names.length; i += 1) {
        inputs.push({
            id: `${names[i]}#${i}`,
            name: `${names[i]}.pdf`,
            type: 'application/pdf',
            bytes: await bytesOf(names[i]),
        });
    }
    return inputs;
}

/**
 * Everything the round-5 gate asserts about one produced artifact.
 *
 * READY must mean serialization succeeded: the bytes pass the Load Boundary when
 * fed back in, PDF.js opens them, and the text PDF.js shows is the text the
 * sources showed.
 */
async function fidelityReport(sources, result) {
    const base = {
        status: result.status,
        reason: result.reason ?? null,
        detail: result.detail ?? null,
        losses: (result.losses ?? []).map((l) => ({ kind: l.kind, what: l.what ?? null })),
        sources: [],
    };
    for (const bytes of sources) base.sources.push(await pdfjsRead(bytes));
    if (!result.bytes) return base;

    const boundary = inspectLoadBoundary(result.bytes, PROVISIONAL_POLICY.loadBoundary);
    let output = null;
    let pdfjsError = null;
    try {
        output = await pdfjsRead(result.bytes);
    } catch (error) {
        pdfjsError = String(error?.message ?? error);
    }
    const doc = await PDFDocument.load(result.bytes, { updateMetadata: false });
    const leaves = gateNameKeys(doc);
    const keys = leaves.flat();
    const leavesAscending = leaves.every((leaf) => leaf.every(
        (key, i) => i === 0 || compareBytes(leaf[i - 1], key) < 0,
    ));
    const rawLookups = [];
    for (const key of keys) {
        const raw = latin1Of(key);
        rawLookups.push({ raw, page: await pdfjsRawLookup(result.bytes, raw) });
    }
    return {
        ...base,
        boundary: boundary.verdict,
        boundaryCode: boundary.code ?? null,
        pdfjsError,
        output,
        keyCount: keys.length,
        leavesAscending,
        rawLookups,
        readback: result.readback ?? null,
    };
}

Object.assign(window.__m6, {
    /** BLK-R4-1: an Extract, read by PDF.js on both sides and fed back through the boundary. */
    fidelityExtract: async (name, selection) => {
        const source = await bytesOf(name);
        const result = await runExtract(await bytesOf(name), {

// ---------------------------------------------------------------------------
// Round 6 oracles. RF-R5-1, RF-R5-2, RF-R5-3.
// ---------------------------------------------------------------------------

/**
 * Every annotation in an artifact, read by PDF.js, with where its link goes.
 *
 * The question RF-R5-1 asks is not "did it return READY" but "is the annotation
 * that survived the one the plan was about". PDF.js answers it without sharing
 * a line with the writer.
 */
async function pdfjsAnnots(bytes) {
    const doc = await pdfjsOpen(bytes);
    try {
        const pages = [];
        for (let i = 1; i <= doc.numPages; i += 1) {
            const page = await doc.getPage(i);
            const annots = await page.getAnnotations();
            const rows = [];
            for (const a of annots) {
                rows.push({
                    subtype: a.subtype,
                    fieldName: a.fieldName ?? null,
                    fieldValue: a.fieldValue ?? null,
                    target: a.subtype === 'Link' ? await pdfjsPageOf(doc, a.dest) : null,
                });
            }
            pages.push(rows);
        }
        return pages;
    } finally {
        await doc.destroy();
    }
}

/**
 * `/P` on every annotation, checked against the artifact's own page tree.
 *
 * A reconstruction that put the reference back in the wrong place, or did not
 * put it back at all, shows up here and nowhere in a status.
 */
function gatePageRefs(doc) {
    const out = { annots: 0, withP: 0, pointingIntoTree: 0, dangling: 0 };
    const inTree = new Set(doc.getPages().map((p) => p.ref.tag));
    for (const page of doc.getPages()) {
        const annots = page.node.lookup(PDFName.of('Annots'));
        if (!(annots instanceof PDFArray)) continue;
        for (let i = 0; i < annots.size(); i += 1) {
            const annot = doc.context.lookup(annots.get(i));
            if (!(annot instanceof PDFDict)) continue;
            out.annots += 1;
            const p = annot.get(PDFName.of('P'));
            if (p === undefined) continue;
            out.withP += 1;
            if (p instanceof PDFRef && inTree.has(p.tag)) out.pointingIntoTree += 1;
            else out.dangling += 1;
        }
    }
    return out;
}

/**
 * Signature remnants by this gate's own semantics. RF-R5-3.
 *
 * Written here rather than imported, and deliberately context-aware in the same
 * way the production rule claims to be: `/Contents` counts only on a dictionary
 * some field points at with `/V`, because a page's `/Contents` is its content
 * stream. A detector that counted the key would fail the two controls.
 */
function gateRemnants(doc) {
    const nameOf = (v) => (typeof v?.asString === 'function' ? v.asString() : '');
    const valueTags = new Set();
    const valueDicts = new Set();
    forEachDict(doc, (dict) => {
        const v = dict.get(PDFName.of('V'));
        if (v instanceof PDFRef) valueTags.add(v.tag);
        else if (v instanceof PDFDict) valueDicts.add(v);
    });
    /**
     * `/FT`, resolved up `/Parent` — this gate's own walk, bounded and
     * cycle-aware. A signature widget whose type lives on its parent is still a
     * signature widget, and H1 says none may be in an artifact.
     */
    const inheritedFt = (dict) => {
        const seen = new Set();
        let current = dict;
        for (let depth = 0; depth < 32 && current instanceof PDFDict; depth += 1) {
            const own = nameOf(current.get(PDFName.of('FT')));
            if (own) return own;
            const parent = current.get(PDFName.of('Parent'));
            if (parent instanceof PDFRef) {
                if (seen.has(parent.tag)) return '';
                seen.add(parent.tag);
                current = doc.context.lookup(parent);
            } else {
                current = parent;
            }
        }
        return '';
    };

    let count = 0;
    const reasons = [];
    for (const [ref, obj] of doc.context.enumerateIndirectObjects()) {
        const roots = [];
        const walk = (value, depth) => {
            if (depth > 32) return;
            const dict = value instanceof PDFDict
                ? value
                : (value?.dict instanceof PDFDict ? value.dict : null);
            if (!dict) return;
            roots.push({ dict, depth });
            for (const [, entry] of dict.entries()) {
                if (entry instanceof PDFDict) walk(entry, depth + 1);
                else if (entry instanceof PDFArray) {
                    for (let i = 0; i < entry.size(); i += 1) walk(entry.get(i), depth + 1);
                }
            }
        };
        walk(obj, 0);
        for (const { dict, depth } of roots) {
            const isValue = (depth === 0 && valueTags.has(ref.tag)) || valueDicts.has(dict);
            const type = nameOf(dict.get(PDFName.of('Type')));
            const isWidget = nameOf(dict.get(PDFName.of('Subtype'))) === '/Widget';
            let why = null;
            if (nameOf(dict.get(PDFName.of('FT'))) === '/Sig') why = '/FT /Sig';
            else if (isWidget && inheritedFt(dict) === '/Sig') why = 'a widget inheriting /FT /Sig';
            else if (type === '/Sig' || type === '/DocTimeStamp') why = `/Type ${type}`;
            else if (dict.get(PDFName.of('ByteRange')) !== undefined) why = '/ByteRange';
            else if (isValue && dict.get(PDFName.of('Contents')) !== undefined) why = 'value /Contents';
            if (why) {
                count += 1;
                reasons.push(`${ref.tag}${depth ? `+${depth}` : ''} ${why}`);
            }
        }
    }
    return { count, reasons };
}
