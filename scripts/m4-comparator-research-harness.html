const FIXTURES = '/test-fixtures/m4-comparator';
const docs = new Map();
async function open(name) {
  if (!docs.has(name)) {
    const r = await fetch(`${FIXTURES}/${name}.pdf`);
    const data = new Uint8Array(await r.arrayBuffer());
    docs.set(name, await pdfjsLib.getDocument({ data, isEvalSupported: false }).promise);
  }
  return docs.get(name);
}

/** What a page looks like before anything is rendered. */
async function describe(name, pageNumber = 1, label = name) {
  const doc = await open(name);
  if (pageNumber > doc.numPages) {
    return { label, name, pageNumber, available: false, renderError: false };
  }
  const page = await doc.getPage(pageNumber);
  const vp = page.getViewport({ scale: 1 });
  return {
    label, name, pageNumber, available: true, renderError: false,
    view: page.view, rotate: page.rotate,
    displayWidth: vp.width, displayHeight: vp.height,
  };
}

// ---------------------------------------------------------------------------
// Rendering, exactly as production does it
// ---------------------------------------------------------------------------

/** The caps that ship today (PdfComparator.tsx:271-272). */
const MAX_DIM = 12000;
const MAX_AREA = 80000000;

function productionExportScale(dpi, vp) {
  const requested = dpi / 72;
  let safe = requested;
  const estW = vp.width * requested;
  const estH = vp.height * requested;
  if (estW > MAX_DIM || estH > MAX_DIM || estW * estH > MAX_AREA) {
    const ratioW = MAX_DIM / estW;
    const ratioH = MAX_DIM / estH;
    const ratioA = Math.sqrt(MAX_AREA / (estW * estH));
    safe = requested * Math.min(ratioW, ratioH, ratioA);
  }
  return { requested, safe, capped: safe < requested };
}

/**
 * Compose the way the shipped export loop does: render each member, take the
 * largest dimensions, draw each at the top-left of a white field, composite.
 */
async function composeAsProduction(
  members, scale, threshold,
  {
    failMember = null, upright = false,
    matchColor = [0, 0, 0], matchOpacity = 1,
  } = {},
) {
  const started = performance.now();
  const raw = [];
  let maxW = 0;
  let maxH = 0;
  const dropped = [];

  for (const m of members) {
    if (!m.available) { dropped.push(`${m.label}: page absent`); continue; }
    try {
      if (failMember === m.label) throw new Error('injected render failure');
      const doc = await open(m.name);
      // `upright` renders with /Rotate undone, which is what the proposed
      // design does and what makes a rotation-only pair comparable at all.
      const canvas = upright
        ? await renderUpright(doc, m.pageNumber, scale)
        : await renderPageToCanvas(doc, m.pageNumber, scale);
      maxW = Math.max(maxW, canvas.width);
      maxH = Math.max(maxH, canvas.height);
      raw.push({ canvas, color: m.color });
    } catch (error) {
      // Production catches here and carries on with whatever is left.
      dropped.push(`${m.label}: ${error.message}`);
    }
  }
  if (raw.length === 0 || maxW === 0) {
    return { produced: false, dropped, ms: Math.round(performance.now() - started) };
  }

  const temp = document.createElement('canvas');
  temp.width = maxW;
  temp.height = maxH;
  const ctx = temp.getContext('2d', { willReadFrequently: true });
  const layers = [];
  for (const layer of raw) {
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, maxW, maxH);
    ctx.drawImage(layer.canvas, 0, 0);
    layers.push({ data: ctx.getImageData(0, 0, maxW, maxH).data, color: layer.color });
    layer.canvas.width = 0;
    layer.canvas.height = 0;
  }

  const compositeStarted = performance.now();
  const composite = computeMultiPdfComposite(
    layers, maxW, maxH, threshold, matchColor, matchOpacity,
  );
  const compositeMs = Math.round(performance.now() - compositeStarted);
  const bounds = detectChangeBounds(layers, maxW, maxH, threshold);

  // Pixels that are neither white nor black: the composite paints an unmatched
  // layer in that layer's colour, so these are what the tool is calling a
  // change.
  let changePixels = 0;
  let inkPixels = 0;
  const d = composite.data;
  for (let i = 0; i < d.length; i += 4) {
    const [r, g, b] = [d[i], d[i + 1], d[i + 2]];
    if (r > 245 && g > 245 && b > 245) continue;
    inkPixels += 1;
    if (Math.max(r, g, b) - Math.min(r, g, b) > 30) changePixels += 1;
  }

  temp.width = 1;
  temp.height = 1;
  return {
    produced: true,
    dropped,
    width: maxW,
    height: maxH,
    members: raw.length,
    changePixels,
    inkPixels,
    changeRatio: inkPixels === 0 ? 0 : changePixels / inkPixels,
    bounds,
    compositeMs,
    ms: Math.round(performance.now() - started),
    memory: estimateMemory({ width: maxW, height: maxH, layers: raw.length }).total,
  };
}

/** The same page with /Rotate undone. */
async function renderUpright(doc, pageNumber, scale) {
  const page = await doc.getPage(pageNumber);
  const vp = page.getViewport({ scale, rotation: 0 });
  const canvas = document.createElement('canvas');
  canvas.width = Math.ceil(vp.width);
  canvas.height = Math.ceil(vp.height);
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = 'white';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  return canvas;
}

// ---------------------------------------------------------------------------
// The canonical comparison
// ---------------------------------------------------------------------------

/**
 * Every member rendered in the canonical upright frame, at the same size.
 *
 * Sizes that do not agree are not normalised here by padding or stretching:
 * that is a plan-level question and the plan has already answered it. If they
 * disagree at this point something upstream let through a comparison it should
 * have refused, so it is reported rather than papered over.
 */
async function renderMembersUpright(members, scale) {
  const buffers = [];
  let width = 0;
  let height = 0;
  for (const m of members) {
    const doc = await open(m.name);
    const canvas = await renderUpright(doc, m.pageNumber, scale);
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    if (width === 0) { width = canvas.width; height = canvas.height; }
    buffers.push({ label: m.label, data, width: canvas.width, height: canvas.height });
    canvas.width = 1;
    canvas.height = 1;
  }
  return {
    buffers,
    width,
    height,
    sameSize: buffers.every((b) => b.width === width && b.height === height),
  };
}

/**
 * The verdict, taken from ink rather than from the picture.
 *
 * This is the whole of RF-N2's shape: an ink predicate and a physical spatial
 * tolerance produce a change mask, the mask produces the verdict, and only then
 * is anything painted. `presentation` here exists to prove the separation --
 * the same comparison run with different layer colours, match colour and match
 * opacity has to give the same verdict.
 */
async function canonicalCompare(members, scale, radius, {
  isInk = INK_PREDICATES.mean, presentation = null,
} = {}) {
  const rendered = await renderMembersUpright(members, scale);
  const { width, height } = rendered;
  const masks = rendered.buffers.map((b) => inkMask(b.data, width, height, isInk));
  // Reference pairs: slot 1 against each of the others, independently.
  const pairs = [];
  for (let i = 1; i < masks.length; i++) {
    const mask = pairChangeMask({
      a: masks[0], b: masks[i], width, height, radius,
    });
    pairs.push({
      member: rendered.buffers[i].label,
      changePixels: mask.changePixels,
      inkPixels: mask.inkPixels,
      ratio: mask.inkPixels === 0 ? 0 : mask.changePixels / mask.inkPixels,
      verdict: canonicalVerdict(mask).status,
    });
  }
  const changePixels = pairs.reduce((n, p) => n + p.changePixels, 0);
  const inkPixels = Math.max(...pairs.map((p) => p.inkPixels), 0);
  const out = {
    width,
    height,
    sameSize: rendered.sameSize,
    changePixels,
    inkPixels,
    ratio: inkPixels === 0 ? 0 : changePixels / inkPixels,
    pairs,
    // MATCH only when every pair matches. No pair can be cancelled by another.
    verdict: pairs.every((p) => p.verdict === RESULT.MATCH) ? RESULT.MATCH : RESULT.CHANGE,
  };
  if (presentation) {
    // What the user is shown, for the same input. Nothing here may reach the
    // verdict above.
    const coloured = members.map((m, i) => ({ ...m, color: presentation.colors[i] }));
    const shown = await composeAsProduction(coloured, scale, radius, {
      upright: true,
      matchColor: presentation.matchColor,
      matchOpacity: presentation.matchOpacity,
    });
    out.presentation = {
      label: presentation.label,
      // The colour-spread count the earlier rounds used: derived from the
      // painted composite, and therefore a property of the palette.
      compositeChangePixels: shown.changePixels,
      compositeInkPixels: shown.inkPixels,
      compositeRatio: shown.changeRatio,
    };
  }
  return out;
}

const RED = [1, 0, 0];
const BLUE = [0, 0, 1];
const member = (name, color, label = name, pageNumber = 1) =>
  describe(name, pageNumber, label).then((m) => ({ ...m, color }));

const pair = async (a, b, pageNumber = 1) => ([
  await member(a, BLUE, a, pageNumber),
  await member(b, RED, b, pageNumber),
]);

// ---------------------------------------------------------------------------
// The probes
// ---------------------------------------------------------------------------

const DPI = 150;
const SCALE = DPI / 72;

window.__m4 = {
  /** The corpus has to differ in the ways it claims to. */
  async corpus() {
    const out = {};
    for (const name of [
      'base-a4', 'identical-a4', 'added-line-a4', 'removed-line-a4', 'offset-a4',
      'grey-line-a4', 'colour-line-a4', 'pale-hatch-a4',
      'base-a3', 'base-a1', 'base-a0', 'landscape-a4', 'nearly-a4', 'same-ratio-larger',
      'rotate-0', 'rotate-90', 'rotate-180', 'rotate-270',
      'crop-origin-0', 'crop-origin-50-70', 'mediabox-larger',
      'three-pages', 'two-pages', 'three-pages-blank-third',
      'base-a4-copy', 'wall-at-y-a4', 'wall-at-y-a4-copy',
      'dense-a', 'dense-b', 'sheet-plus-0-99', 'sheet-plus-1-01',
      'rotate-0-copy', 'crop-rot-90', 'crop-rot-180', 'crop-rot-270',
      'small-base', 'small-base-copy', 'small-digit', 'small-fine-line',
      'small-symbol', 'small-revision-mark', 'small-hatch',
    ]) {
      const doc = await open(name);
      const page = await doc.getPage(1);
      const vp = page.getViewport({ scale: 1 });
      const ops = await page.getOperatorList();
      out[name] = {
        pages: doc.numPages,
        view: page.view.map((v) => Math.round(v)),
        rotate: page.rotate,
        display: [Math.round(vp.width), Math.round(vp.height)],
        ops: ops.fnArray.length,
      };
    }
    return out;
  },

  /**
   * What the shipped comparator does with each pair.
   *
   * The number that matters is `changeRatio`: how much of the ink it painted in
   * a layer colour rather than in the matched colour. On a pair whose drawing
   * is identical, every one of those pixels is the tool reporting its own
   * coordinate handling as a design change.
   */
  async baseline() {
    const cases = {
      'identical drawing': ['base-a4', 'identical-a4'],
      'a wall added': ['base-a4', 'added-line-a4'],
      'a wall removed': ['base-a4', 'removed-line-a4'],
      'the drawing shifted 2pt': ['base-a4', 'offset-a4'],
      'A4 vs A3, same drawing': ['base-a4', 'base-a3'],
      'A4 vs A1, same drawing': ['base-a4', 'base-a1'],
      'portrait vs landscape': ['base-a4', 'landscape-a4'],
      'A4 vs a sheet 3pt bigger': ['base-a4', 'nearly-a4'],
      'same aspect, 1.4x': ['base-a4', 'same-ratio-larger'],
      '/Rotate 0 vs 90': ['rotate-0', 'rotate-90'],
      '/Rotate 0 vs 180': ['rotate-0', 'rotate-180'],
      '/Rotate 0 vs 270': ['rotate-0', 'rotate-270'],
      'crop origin (0,0) vs (50,70)': ['crop-origin-0', 'crop-origin-50-70'],
      'MediaBox larger, same CropBox': ['base-a4', 'mediabox-larger'],
      'black vs grey ink': ['base-a4', 'grey-line-a4'],
      'black vs cyan ink': ['base-a4', 'colour-line-a4'],
      'a pale hatch added': ['base-a4', 'pale-hatch-a4'],
    };
    const out = {};
    for (const [label, [a, b]] of Object.entries(cases)) {
      out[label] = await composeAsProduction(await pair(a, b), SCALE, 0);
    }
    return out;
  },

  /** Page 3 of a three-page document against a two-page one. */
  async missingPage() {
    const out = {};
    for (const n of [1, 2, 3]) {
      out[`page ${n}`] = {
        production: await composeAsProduction(
          await pair('three-pages', 'two-pages', n), SCALE, 0),
        strict: candidateStrict({ pages: await pair('three-pages', 'two-pages', n) }),
      };
    }
    // A page that exists and is empty is a different statement from a page that
    // is not there, and a comparison must not turn one into the other.
    out['blank page 3'] = {
      production: await composeAsProduction(
        await pair('three-pages', 'three-pages-blank-third', 3), SCALE, 0),
      strict: candidateStrict({
        pages: await pair('three-pages', 'three-pages-blank-third', 3),
      }),
    };
    return out;
  },

  /** One member fails to render; the other does not. */
  async renderFailure() {
    const members = await pair('base-a4', 'added-line-a4');
    const production = await composeAsProduction(members, SCALE, 0,
      { failMember: 'added-line-a4' });
    const withFailure = members.map(
      (m) => (m.label === 'added-line-a4' ? { ...m, renderError: true } : m),
    );
    return {
      production,
      strict: candidateStrict({ pages: withFailure }),
      // What the same pair produces when nothing fails, for contrast.
      intact: await composeAsProduction(members, SCALE, 0),
    };
  },

  /** What each candidate says about each geometry pair. */
  async candidates() {
    const cases = {
      'identical drawing': ['base-a4', 'identical-a4'],
      'a wall added': ['base-a4', 'added-line-a4'],
      '/Rotate 0 vs 90': ['rotate-0', 'rotate-90'],
      'crop origin (0,0) vs (50,70)': ['crop-origin-0', 'crop-origin-50-70'],
      'MediaBox larger, same CropBox': ['base-a4', 'mediabox-larger'],
      'A4 vs A3, same drawing': ['base-a4', 'base-a3'],
      'portrait vs landscape': ['base-a4', 'landscape-a4'],
      'A4 vs a sheet 3pt bigger': ['base-a4', 'nearly-a4'],
      'same aspect, 1.4x': ['base-a4', 'same-ratio-larger'],
    };
    const out = {};
    for (const [label, [a, b]] of Object.entries(cases)) {
      const pages = await pair(a, b);
      const withAlignment = { x: 12, y: -4, rotation: 0, scale: 1 };
      out[label] = {
        geometry: compareGeometry(pageGeometry(pages[0]), pageGeometry(pages[1])),
        baseline: candidateBaseline({ pages }),
        strict: candidateStrict({ pages }),
        normalise: candidateNormalise({ pages }),
        human: candidateHumanAlignment({ pages }),
        humanWithAlignment: candidateHumanAlignment({ pages, alignment: withAlignment }),
      };
    }
    return out;
  },

  /**
   * Rendering upright: does undoing /Rotate remove the difference?
   *
   * PDF.js applies /Rotate unless told otherwise, so the same drawing at four
   * rotations renders to four different canvases. Asking for `rotation: 0`
   * renders the page upright, which is what makes the comparison possible.
   */
  async rotationUpright() {
    const out = {};
    for (const angle of [90, 180, 270]) {
      const upright = [];
      for (const name of ['rotate-0', `rotate-${angle}`]) {
        const doc = await open(name);
        const page = await doc.getPage(1);
        const vp = page.getViewport({ scale: SCALE, rotation: 0 });
        const canvas = document.createElement('canvas');
        canvas.width = Math.ceil(vp.width);
        canvas.height = Math.ceil(vp.height);
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        await page.render({ canvasContext: ctx, viewport: vp }).promise;
        upright.push({ data: ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas });
      }
      const w = upright[0].canvas.width;
      const h = upright[0].canvas.height;
      const sameSize = w === upright[1].canvas.width && h === upright[1].canvas.height;
      let differing = 0;
      let ink = 0;
      if (sameSize) {
        const a = upright[0].data;
        const b = upright[1].data;
        for (let i = 0; i < a.length; i += 4) {
          const inkA = (a[i] + a[i + 1] + a[i + 2]) / 3 < 200;
          const inkB = (b[i] + b[i + 1] + b[i + 2]) / 3 < 200;
          if (inkA || inkB) ink += 1;
          if (inkA !== inkB) differing += 1;
        }
      }
      for (const u of upright) { u.canvas.width = 1; u.canvas.height = 1; }
      out[`0 vs ${angle}`] = {
        sameSize, width: w, height: h, ink, differing,
        ratio: ink === 0 ? 0 : differing / ink,
      };
    }
    return out;
  },

  /** What the shipped caps do to a requested DPI. */
  async dpiContract() {
    const out = {};
    for (const sheet of ['base-a4', 'base-a3', 'base-a1', 'base-a0']) {
      const doc = await open(sheet);
      const page = await doc.getPage(1);
      const vp = page.getViewport({ scale: 1 });
      out[sheet] = {};
      for (const dpi of [72, 150, 300, 600]) {
        const s = productionExportScale(dpi, vp);
        const width = Math.round(vp.width * s.safe);
        const height = Math.round(vp.height * s.safe);
        const budget = checkBudget({ width, height, layers: 2 });
        out[sheet][dpi] = {
          requestedDpi: dpi,
          actualDpi: Math.round(72 * s.safe),
          capped: s.capped,
          width,
          height,
          megapixels: +(width * height / 1e6).toFixed(2),
          estimatedBytes: budget.total,
          estimatedMB: +(budget.total / 1e6).toFixed(1),
          withinBudget: budget.withinBudget,
        };
      }
    }
    return out;
  },

  /** What a comparison actually costs, measured rather than modelled. */
  async cost() {
    const rows = {};
    for (const [label, sheet, dpi, threshold, layers] of [
      ['A4 150dpi, 2 layers, threshold 0', 'base-a4', 150, 0, 2],
      ['A4 150dpi, 2 layers, threshold 2', 'base-a4', 150, 2, 2],
      ['A4 150dpi, 2 layers, threshold 4', 'base-a4', 150, 4, 2],
      ['A4 300dpi, 2 layers, threshold 0', 'base-a4', 300, 0, 2],
      ['A4 150dpi, 4 layers, threshold 0', 'base-a4', 150, 0, 4],
      ['A3 150dpi, 2 layers, threshold 0', 'base-a3', 150, 0, 2],
      ['A1 150dpi, 2 layers, threshold 0', 'base-a1', 150, 0, 2],
    ]) {
      const others = ['identical-a4', 'added-line-a4', 'removed-line-a4'];
      const members = [await member(sheet, BLUE, sheet)];
      for (let i = 1; i < layers; i++) {
        const name = sheet === 'base-a4' ? others[(i - 1) % others.length] : sheet;
        members.push(await member(name, RED, `${name}#${i}`));
      }
      rows[label] = await composeAsProduction(members, dpi / 72, threshold);
    }
    return rows;
  },

  /** Threshold as a physical distance rather than a pixel count. */
  thresholdContract() {
    const out = { pixelToMm: {}, mmToPixel: {} };
    for (const dpi of [72, 150, 300, 600]) {
      out.pixelToMm[dpi] = +millimetresFor(2, dpi).toFixed(3);
      out.mmToPixel[dpi] = pixelRadiusFor(0.5, dpi);
    }
    return out;
  },

  /** What the shipped ink test calls ink. */
  async inkBoundary() {
    const swatches = {
      black: '#000000', 'dark grey': '#404040', 'mid grey': '#8c8c8c',
      'pale grey': '#d2d2d2', 'cad cyan': '#009ed9', 'cad yellow': '#ffe100',
      // Bright but not dark on average: the mean is over 200 while one
      // channel is under it, which is where the two ink tests part company.
      'pale yellow': '#ffff8c', 'near white': '#f5f5f5', white: '#ffffff',
    };
    // Sized from the swatches rather than a literal: a reading taken outside the
    // canvas comes back as transparent black, which would look like ink.
    const canvas = document.createElement('canvas');
    canvas.width = Object.keys(swatches).length;
    canvas.height = 1;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const out = {};
    let x = 0;
    for (const [name, colour] of Object.entries(swatches)) {
      ctx.fillStyle = colour;
      ctx.fillRect(x, 0, 1, 1);
      const d = ctx.getImageData(x, 0, 1, 1).data;
      out[name] = {
        rgb: [d[0], d[1], d[2]],
        // computeMultiPdfComposite: the mean.
        compositeSaysInk: (d[0] + d[1] + d[2]) / 3 < 200,
        // detectChangeBounds: any channel.
        boundsSaysInk: d[0] < 200 || d[1] < 200 || d[2] < 200,
      };
      x += 1;
    }
    return out;
  },

  /** Twice through, same input. */
  async determinism() {
    const members = await pair('base-a4', 'added-line-a4');
    const first = await composeAsProduction(members, SCALE, 0);
    const second = await composeAsProduction(members, SCALE, 0);
    return {
      changePixels: [first.changePixels, second.changePixels],
      inkPixels: [first.inkPixels, second.inkPixels],
      bounds: [first.bounds, second.bounds],
      identical: first.changePixels === second.changePixels
        && first.inkPixels === second.inkPixels
        && JSON.stringify(first.bounds) === JSON.stringify(second.bounds),
    };
  },

  /** The budget arithmetic, and the largest thing it refuses. */
  budget() {
    const cases = {};
    for (const [label, w, h, layers] of [
      ['A4 at 150dpi, 2 layers', 1240, 1754, 2],
      ['A3 at 300dpi, 2 layers', 3508, 4961, 2],
      ['A1 at 300dpi, 2 layers', 7016, 9933, 2],
      ['A1 at 300dpi, 4 layers', 7016, 9933, 4],
      ['A0 at 300dpi, 2 layers', 9933, 14043, 2],
      ['A0 at 600dpi, 2 layers', 19866, 28087, 2],
    ]) {
      const b = checkBudget({ width: w, height: h, layers });
      cases[label] = {
        megapixels: +(w * h / 1e6).toFixed(1),
        totalMB: +(b.total / 1e6).toFixed(0),
        withinBudget: b.withinBudget,
      };
    }
    return { limitMB: MAX_COMPARISON_BYTES / 1e6, cases };
  },

  /**
   * A plan, then a verdict — the two stages kept apart.
   *
   * The first version of this returned CHANGE as soon as the geometry was
   * eligible, so an identical drawing came back as CHANGE. A plan says whether
   * the comparison can be made; only a comparison that actually ran may say
   * MATCH or CHANGE.
   */
  async planThenVerdict() {
    const cases = {
      identical: ['base-a4', 'identical-a4'],
      'a wall added': ['base-a4', 'added-line-a4'],
      'rotation only': ['rotate-0', 'rotate-90'],
      'crop origin only': ['crop-origin-0', 'crop-origin-50-70'],
      'a different sheet': ['base-a4', 'base-a3'],
    };
    const out = {};
    for (const [label, [a, b]] of Object.entries(cases)) {
      const pages = await pair(a, b);
      const plan = candidateStrict({ pages });
      if (plan.status !== PLAN.READY_TO_COMPARE) {
        out[label] = { plan: plan.status, verdict: null, reported: plan.reported };
        continue;
      }
      // Rotation is settled by rendering upright, which is what makes the plan
      // ready in the first place; the diff has to see the same frame. The
      // verdict comes from the ink masks, not from the painted composite.
      const compared = await canonicalCompare(pages, SCALE, 0);
      const verdict = canonicalVerdict(compared);
      out[label] = {
        plan: plan.status,
        verdict: verdict.status,
        ratio: verdict.ratio,
        changePixels: verdict.changePixels,
        tolerance: verdict.tolerance,
      };
    }

    // The same pair, with a human alignment supplied. Candidate C records the
    // numbers; it does not define what they mean, so it may not claim a plan
    // that is ready. See the alignment sub-spike this defers to.
    const mismatched = await pair('base-a4', 'base-a3');
    const withAlignment = candidateHumanAlignment({
      pages: mismatched, alignment: { x: 12, y: -4, rotation: 0, scale: 1 },
    });
    out['a different sheet, aligned by a human'] = {
      plan: withAlignment.status,
      implementationReady: withAlignment.implementationReady,
      requires: withAlignment.requires,
      recordedAlignment: withAlignment.recordedAlignment,
      appliedAlignment: withAlignment.appliedAlignment,
      missingContract: withAlignment.missingContract,
      verdict: null,
      reported: withAlignment.reported,
    };
    return out;
  },

  /**
   * What "matched" means with more than two members.
   *
   * The shipped rule is *any other layer*. With four members two agreeing pairs
   * cancel: A and B put a wall in one place, C and D put it in another, every
   * pixel finds a partner, and the comparison comes back clean.
   */
  async multiMember() {
    const sets = {
      'four identical': ['base-a4', 'identical-a4', 'base-a4-copy', 'base-a4'],
      'three the same, one changed': ['base-a4', 'identical-a4', 'base-a4-copy', 'added-line-a4'],
      'two against two': ['base-a4', 'identical-a4', 'wall-at-y-a4', 'wall-at-y-a4-copy'],
      'reference and three different': ['base-a4', 'added-line-a4', 'removed-line-a4', 'wall-at-y-a4'],
    };
    const colours = [[0, 0, 1], [1, 0, 0], [0, 0.6, 0], [0.8, 0, 0.8]];
    const out = {};
    for (const [label, names] of Object.entries(sets)) {
      const members = [];
      for (let i = 0; i < names.length; i++) {
        members.push(await member(names[i], colours[i], `${names[i]}#${i}`));
      }
      const all = await composeAsProduction(members, SCALE, 0);
      // The same set, but each non-reference member against slot 1 alone.
      const pairs = [];
      for (let i = 1; i < members.length; i++) {
        const two = await composeAsProduction([members[0], members[i]], SCALE, 0);
        pairs.push({
          member: names[i],
          ratio: two.changeRatio,
          verdict: verdictFor({
            changePixels: two.changePixels, inkPixels: two.inkPixels,
          }).status,
        });
      }
      out[label] = {
        members: names.length,
        anyOtherLayer: {
          ratio: all.changeRatio,
          verdict: verdictFor({
            changePixels: all.changePixels, inkPixels: all.inkPixels,
          }).status,
        },
        referencePairs: {
          pairs,
          // MATCH only if every pair matches -- no pair can be cancelled.
          verdict: pairs.every((p) => p.verdict === RESULT.MATCH) ? RESULT.MATCH : RESULT.CHANGE,
        },
      };
    }
    out.plans = {
      two: planMultiMember({ members: 2, contract: MULTI_MEMBER.TWO_ONLY }).status,
      fourTwoOnly: planMultiMember({ members: 4, contract: MULTI_MEMBER.TWO_ONLY }).status,
      fourReferencePairs: planMultiMember({
        members: 4, contract: MULTI_MEMBER.REFERENCE_PAIRS,
      }),
      one: planMultiMember({ members: 1, contract: MULTI_MEMBER.REFERENCE_PAIRS }).status,
      // Consensus is described, not implemented. Nothing has been run against
      // a blank member, a missing member or a member that failed to render
      // under it, so it is refused at every member count rather than offered.
      twoConsensus: planMultiMember({ members: 2, contract: MULTI_MEMBER.CONSENSUS }),
      fourConsensus: planMultiMember({ members: 4, contract: MULTI_MEMBER.CONSENSUS }),
      implemented: IMPLEMENTED_CONTRACTS,
    };
    return out;
  },

  /** The tolerance for calling two sheets the same, probed either side. */
  async geometryTolerance() {
    const out = { tolerancePt: GEOMETRY_TOLERANCE_PT, cases: {} };
    for (const [label, other] of [
      ['+0.99pt', 'sheet-plus-0-99'],
      ['+1.01pt', 'sheet-plus-1-01'],
      ['+3.00pt', 'nearly-a4'],
    ]) {
      const pages = await pair('base-a4', other);
      const g = [pageGeometry(pages[0]), pageGeometry(pages[1])];
      out.cases[label] = {
        widths: [g[0].physical.width, g[1].physical.width],
        delta: +(g[1].physical.width - g[0].physical.width).toFixed(2),
        plan: candidateStrict({ pages }).status,
      };
    }
    return out;
  },

  /**
   * Three code paths, three answers.
   *
   * Preview, the full export and the change report each compute their own render
   * scale, and only two of them cap it. The change report also drops any page
   * where fewer than two members rendered, rather than reporting it.
   *
   * Arithmetic only: nothing here allocates a canvas, because the point is the
   * size the change report would ask for.
   */
  async pipelineDivergence() {
    const out = {};
    for (const sheet of ['base-a4', 'base-a1']) {
      const doc = await open(sheet);
      const vp = (await doc.getPage(1)).getViewport({ scale: 1 });
      out[sheet] = {};
      for (const [zoom, dpi] of [[1, 300], [2, 300], [6, 600]]) {
        const previewRequested = zoom * (dpi / 72);
        const preview = productionExportScale(dpi * zoom, vp);
        const exportOnly = productionExportScale(dpi, vp);
        // PdfComparator.tsx:416 -- `scale * (dpi / 72)` with no cap at all.
        const reportScale = previewRequested;
        const reportW = Math.round(vp.width * reportScale);
        const reportH = Math.round(vp.height * reportScale);
        out[sheet][`zoom ${zoom}, ${dpi}dpi`] = {
          previewScale: +preview.safe.toFixed(2),
          previewCapped: preview.capped,
          exportScale: +exportOnly.safe.toFixed(2),
          exportCapped: exportOnly.capped,
          reportScale: +reportScale.toFixed(2),
          reportCapped: false,
          reportPixels: reportW * reportH,
          reportMegapixels: +(reportW * reportH / 1e6).toFixed(1),
          reportWorkingSetMB: +(estimateMemory({
            width: reportW, height: reportH, layers: 2,
          }).total / 1e6).toFixed(0),
        };
      }
    }
    // The third divergence is not about size.
    out.missingPageHandling = {
      preview: 'skips the member (PdfComparator.tsx:173)',
      export: 'skips the member, still adds the page (PdfComparator.tsx:316)',
      changeReport: 'skips the whole page when fewer than 2 members render '
        + '(PdfComparator.tsx:437)',
    };
    return out;
  },

  /**
   * The threshold cost when the drawings do not match.
   *
   * Every earlier figure is a floor: `hasNeighborInAny` returns on the first ink
   * it finds, so a wider search exits sooner when the marks agree. These two
   * sheets share only the border and grid, so the search runs to completion on
   * nearly every ink pixel.
   */
  async adversarialThreshold() {
    const rows = {};
    for (const [label, a, b, dpi, mm] of [
      ['matching, A4 150dpi, 0mm', 'base-a4', 'identical-a4', 150, 0],
      ['matching, A4 150dpi, 0.5mm', 'base-a4', 'identical-a4', 150, 0.5],
      ['NOT matching, A4 150dpi, 0mm', 'dense-a', 'dense-b', 150, 0],
      ['NOT matching, A4 150dpi, 0.5mm', 'dense-a', 'dense-b', 150, 0.5],
      ['NOT matching, A4 300dpi, 0mm', 'dense-a', 'dense-b', 300, 0],
      ['NOT matching, A4 300dpi, 0.5mm', 'dense-a', 'dense-b', 300, 0.5],
    ]) {
      const radius = pixelRadiusFor(mm, dpi);
      const members = await pair(a, b);
      const r = await composeAsProduction(members, dpi / 72, radius);
      rows[label] = {
        dpi,
        millimetres: mm,
        radius,
        width: r.width,
        height: r.height,
        pixels: r.width * r.height,
        members: r.members,
        inkPixels: r.inkPixels,
        changeRatio: r.changeRatio,
        compositeMs: r.compositeMs,
        totalMs: r.ms,
      };
    }
    return rows;
  },

  /**
   * Candidate B, in the canonical upright frame.
   *
   * The pair that broke the earlier version is `/Rotate 0` against `/Rotate
   * 90`: a scale taken in the display plane comes out at x = 0.707, y = 1.414
   * — an anisotropic stretch on two pages that are the same piece of paper —
   * and the plan returned `READY_TO_COMPARE` anyway. Both numbers are recorded
   * here, the rejected one beside the one that replaced it, so the difference
   * is visible rather than asserted.
   */
  async rigidMapping() {
    const cases = {
      '/Rotate 0 vs 0': ['rotate-0', 'rotate-0-copy'],
      '/Rotate 0 vs 90': ['rotate-0', 'rotate-90'],
      '/Rotate 0 vs 180': ['rotate-0', 'rotate-180'],
      '/Rotate 0 vs 270': ['rotate-0', 'rotate-270'],
      'crop origin only': ['crop-origin-0', 'crop-origin-50-70'],
      'crop origin + /Rotate 90': ['crop-origin-0', 'crop-rot-90'],
      'crop origin + /Rotate 180': ['crop-origin-0', 'crop-rot-180'],
      'crop origin + /Rotate 270': ['crop-origin-0', 'crop-rot-270'],
    };
    const out = {};
    for (const [label, [a, b]] of Object.entries(cases)) {
      const pages = await pair(a, b);
      const geometry = [pageGeometry(pages[0]), pageGeometry(pages[1])];
      const plan = candidateNormalise({ pages });
      const invariant = assertRigidPlan(plan);
      const compared = plan.status === PLAN.READY_TO_COMPARE
        ? await canonicalCompare(pages, SCALE, 0)
        : null;
      out[label] = {
        plan: plan.status,
        alignment: plan.alignment ?? null,
        renderRotation: plan.renderRotation ?? null,
        mappings: (plan.mappings ?? []).map((m) => ({
          member: m.member,
          rigid: m.rigid,
          scaleX: m.scaleX,
          scaleY: m.scaleY,
          scaleDelta: m.scaleDelta,
          renderRotation: m.renderRotation,
          sourceRotate: m.sourceRotate,
          residualWidthPt: m.residualWidthPt,
          residualHeightPt: m.residualHeightPt,
        })),
        invariantHolds: invariant.holds,
        // What the rejected mapping would have produced for the same pair.
        displayPlane: displayPlaneScale(geometry[0], geometry[1]),
        upright: uprightGeometry(geometry[1]),
        verdict: compared?.verdict ?? null,
        changePixels: compared?.changePixels ?? null,
        inkPixels: compared?.inkPixels ?? null,
        ratio: compared?.ratio ?? null,
        width: compared?.width ?? null,
        height: compared?.height ?? null,
        sameSize: compared?.sameSize ?? null,
      };
    }
    // The control. Rendering upright must not turn a different sheet into a
    // comparable one.
    const different = await pair('base-a4', 'base-a3');
    const diffPlan = candidateNormalise({ pages: different });
    out['a different physical sheet'] = {
      plan: diffPlan.status,
      mappings: [],
      invariantHolds: assertRigidPlan(diffPlan).holds,
      reported: diffPlan.reported,
      verdict: null,
      displayPlane: displayPlaneScale(
        pageGeometry(different[0]), pageGeometry(different[1]),
      ),
    };
    return out;
  },

  /**
   * Changes small enough for a ratio floor to swallow.
   *
   * Every pair below except the control is a **true** change to the drawing.
   * `canonical` is the verdict with no floor at all; `underOldFloor` is what
   * the 0.5%-of-ink floor from the previous round would have said about the
   * same measurement. Where those two disagree, the floor is the thing
   * reporting a revised drawing as unrevised.
   *
   * `spatial` is the alternative: the tolerance applied to the mask as a
   * physical distance rather than to the total as a share. It is not free —
   * a wide enough radius erodes a small change too — which is exactly why it
   * has to be stated in millimetres the user chose rather than assumed.
   */
  async smallChanges() {
    const cases = {
      'nothing changed (control)': ['small-base', 'small-base-copy'],
      'one digit of a dimension': ['small-base', 'small-digit'],
      'one short fine line added': ['small-base', 'small-fine-line'],
      'a symbol swapped': ['small-base', 'small-symbol'],
      'a 4mm revision triangle added': ['small-base', 'small-revision-mark'],
      'a light hatch added': ['small-base', 'small-hatch'],
      'the pale hatch fixture': ['base-a4', 'pale-hatch-a4'],
      'a wall added, for scale': ['base-a4', 'added-line-a4'],
    };
    const out = { cases: {}, spatial: {} };
    for (const [label, [a, b]] of Object.entries(cases)) {
      const pages = await pair(a, b);
      const compared = await canonicalCompare(pages, SCALE, 0);
      const canonical = canonicalVerdict(compared).status;
      const underOldFloor = verdictFor({
        changePixels: compared.changePixels,
        inkPixels: compared.inkPixels,
        tolerance: 0.005,
      }).status;
      out.cases[label] = {
        changePixels: compared.changePixels,
        inkPixels: compared.inkPixels,
        ratio: compared.ratio,
        canonical,
        underOldFloor,
        // The failure the floor introduces, stated as a boolean so it can be
        // asserted rather than read off a percentage.
        floorWouldHide: canonical === RESULT.CHANGE && underOldFloor === RESULT.MATCH,
      };
    }
    // The physical tolerance, swept finely enough to find where a real change
    // stops being visible rather than only to show that it does.
    const sweep = [0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.4, 0.5];
    for (const [label, [a, b]] of Object.entries({
      'nothing changed (control)': ['small-base', 'small-base-copy'],
      'one digit of a dimension': ['small-base', 'small-digit'],
      'a 4mm revision triangle': ['small-base', 'small-revision-mark'],
    })) {
      const pages = await pair(a, b);
      out.spatial[label] = {};
      for (const mm of sweep) {
        const radius = pixelRadiusFor(mm, DPI);
        const compared = await canonicalCompare(pages, SCALE, radius);
        out.spatial[label][`${mm}mm`] = {
          radius,
          changePixels: compared.changePixels,
          verdict: compared.verdict,
        };
      }
    }
    // The same millimetres at twice the resolution. A tolerance stated in
    // millimetres should mean the same thing; the rounding to whole pixels is
    // where it stops doing so, and that belongs in the policy rather than in a
    // footnote.
    out.spatialAtHigherDpi = {};
    const digitPages = await pair('small-base', 'small-digit');
    for (const mm of sweep) {
      const radius = pixelRadiusFor(mm, 300);
      const compared = await canonicalCompare(digitPages, 300 / 72, radius);
      out.spatialAtHigherDpi[`${mm}mm`] = {
        radius,
        changePixels: compared.changePixels,
        verdict: compared.verdict,
      };
    }
    out.floor = MATCH_RATIO_FLOOR;
    out.policy = SPATIAL_TOLERANCE_POLICY;
    // The assertion the implementation gate has to carry: at the contract's
    // default, a changed dimension is a change.
    out.atTheDefault = {
      millimetres: SPATIAL_TOLERANCE_POLICY.default,
      isDefault: isDefaultSpatialTolerance(SPATIAL_TOLERANCE_POLICY.default),
      radius: pixelRadiusFor(SPATIAL_TOLERANCE_POLICY.default, DPI),
      verdict: out.spatial['one digit of a dimension']
        [`${SPATIAL_TOLERANCE_POLICY.default}mm`].verdict,
    };
    return out;
  },

  /**
   * The verdict must not be a property of the palette.
   *
   * The same comparison, painted three ways. `verdict` comes from the ink
   * masks and must not move. `composite` is the colour-spread count the
   * earlier rounds took from the painted result, and it moves a great deal —
   * which is why it cannot be what MATCH and CHANGE are decided from.
   */
  async presentationIndependence() {
    const presentations = {
      'blue/red, black match, opaque': {
        colors: [[0, 0, 1], [1, 0, 0]], matchColor: [0, 0, 0], matchOpacity: 1,
      },
      'grey/grey, grey match, faint': {
        colors: [[0.5, 0.5, 0.5], [0.5, 0.5, 0.5]],
        matchColor: [0.5, 0.5, 0.5], matchOpacity: 0.2,
      },
      'green/magenta, white match': {
        colors: [[0, 0.6, 0], [0.8, 0, 0.8]], matchColor: [1, 1, 1], matchOpacity: 1,
      },
    };
    const out = {};
    for (const [setLabel, [a, b]] of Object.entries({
      'a changed pair': ['small-base', 'small-digit'],
      'an identical pair': ['small-base', 'small-base-copy'],
    })) {
      const pages = await pair(a, b);
      out[setLabel] = {};
      for (const [label, p] of Object.entries(presentations)) {
        const compared = await canonicalCompare(pages, SCALE, 0, {
          presentation: { label, ...p },
        });
        out[setLabel][label] = {
          verdict: compared.verdict,
          changePixels: compared.changePixels,
          composite: compared.presentation,
        };
      }
    }
    return out;
  },

  /**
   * What a comparison would cost, before anything is allocated.
   *
   * Memory and work are separate ceilings. These are the work one, in units of
   * one pixel read, computed from the member count, the multi-member contract,
   * the neighbourhood box and the algorithm — all four, because leaving any of
   * them out is how the previous shape managed to report zero for a radius-0
   * comparison that still reads every pixel of every member.
   */
  workBudget() {
    const rows = [
      ['A4 300dpi, 2 members, radius 0', 2480, 3507, 2, MULTI_MEMBER.TWO_ONLY, 0],
      ['A4 300dpi, 2 members, radius 1', 2480, 3507, 2, MULTI_MEMBER.TWO_ONLY, 1],
      ['A4 300dpi, 2 members, radius 2', 2480, 3507, 2, MULTI_MEMBER.TWO_ONLY, 2],
      ['A4 300dpi, 2 members, 0.5mm', 2480, 3507, 2, MULTI_MEMBER.TWO_ONLY, 6],
      ['A4 300dpi, 4 members, ref-pairs, 0.5mm', 2480, 3507, 4,
        MULTI_MEMBER.REFERENCE_PAIRS, 6],
      ['A3 300dpi, 2 members, 0.5mm', 3508, 4961, 2, MULTI_MEMBER.TWO_ONLY, 6],
      ['A1 300dpi, 2 members, 0.5mm', 7016, 9933, 2, MULTI_MEMBER.TWO_ONLY, 6],
      ['A0 600dpi, 2 members, 0.5mm', 19866, 28087, 2, MULTI_MEMBER.TWO_ONLY, 12],
    ];
    const cases = {};
    for (const [label, w, h, members, contract, radiusPx] of rows) {
      const checked = checkComparisonWork({
        width: w, height: h, members, contract, radiusPx,
      });
      cases[label] = {
        pixels: checked.pixels,
        members: checked.members,
        contract: checked.contract,
        radiusPx: checked.radiusPx,
        neighbourhoodBox: checked.neighbourhoodBox,
        groups: checked.groups,
        units: checked.units,
        withinBudget: checked.withinBudget,
        refusal: checked.refusal,
        requested: checked.requested,
        effective: checked.effective,
        degraded: checked.degraded,
      };
    }
    // The same sheet under the algorithm that removes the radius from the cost.
    const scan = checkComparisonWork({
      width: 7016, height: 9933, members: 2,
      contract: MULTI_MEMBER.TWO_ONLY, radiusPx: 6,
      algorithm: COMPARISON_ALGORITHM.ANY_NEIGHBOUR_SCAN,
    });
    const separable = checkComparisonWork({
      width: 7016, height: 9933, members: 2,
      contract: MULTI_MEMBER.TWO_ONLY, radiusPx: 6,
      algorithm: COMPARISON_ALGORITHM.SEPARABLE_DILATION,
    });
    return {
      limit: MAX_COMPARISON_WORK_UNITS,
      cases,
      byAlgorithm: {
        'any-neighbour-scan': { units: scan.units, withinBudget: scan.withinBudget },
        'separable-dilation': {
          units: separable.units, withinBudget: separable.withinBudget,
        },
      },
      // A contract with no measured implementation gets no bound, and no bound
      // is a refusal rather than a default.
      consensus: checkComparisonWork({
        width: 2480, height: 3507, members: 4,
        contract: MULTI_MEMBER.CONSENSUS, radiusPx: 6,
      }).refusal,
      // Arithmetic that would leave the safe-integer range is a refusal too.
      unrepresentable: checkComparisonWork({
        width: 2000000, height: 2000000, members: 4,
        contract: MULTI_MEMBER.REFERENCE_PAIRS, radiusPx: 5000,
      }).refusal,
      oneMember: checkComparisonWork({
        width: 2480, height: 3507, members: 1,
        contract: MULTI_MEMBER.REFERENCE_PAIRS, radiusPx: 0,
      }).refusal,
    };
  },

  /**
   * An accepted comparison also has to be abandonable.
   *
   * The shipped loop is a synchronous nested scan: by the time it can be told
   * to stop it has already finished. Both replacements are measured here — the
   * separable dilation, which is the same answer at a fraction of the reads,
   * and the banded generator, which returns control between bounded chunks so
   * a cancellation can actually be observed.
   *
   * A cancelled comparison yields no verdict. Half a change mask is not a
   * smaller change; it is a different drawing.
   */
  async cancellableComparison() {
    const pages = await pair('dense-a', 'dense-b');
    const rendered = await renderMembersUpright(pages, SCALE);
    const { width, height } = rendered;
    const masks = rendered.buffers.map((b) => inkMask(b.data, width, height));
    const args = { a: masks[0], b: masks[1], width, height };

    const timings = {};
    for (const mm of [0, 0.25, 0.5]) {
      const radius = pixelRadiusFor(mm, DPI);
      const scanStarted = performance.now();
      const scan = pairChangeMaskScan({ ...args, radius });
      const scanMs = Math.round(performance.now() - scanStarted);
      const dilationStarted = performance.now();
      const dilation = pairChangeMask({ ...args, radius });
      const dilationMs = Math.round(performance.now() - dilationStarted);
      timings[`${mm}mm`] = {
        radius,
        box: (2 * radius + 1) ** 2,
        scanMs,
        dilationMs,
        scanChangePixels: scan.changePixels,
        dilationChangePixels: dilation.changePixels,
        // The separable form is not an approximation of the nested loop.
        identical: scan.changePixels === dilation.changePixels
          && scan.inkPixels === dilation.inkPixels,
      };
    }

    // The case a bound has to cover, which is not the case on the corpus.
    //
    // The scan exits on the first ink it finds, so on a sparse drawing whose
    // marks mostly agree it never runs the box. Its worst case is ink
    // everywhere that matches nothing: two half-sheets of solid ink, which is
    // what a scanned dark drawing against a redrawn one looks like. The scan
    // then does the full `(2r+1)²` per pixel and the dilation does not.
    const left = new Uint8Array(width * height);
    const right = new Uint8Array(width * height);
    const half = Math.floor(width / 2);
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        if (x < half) left[y * width + x] = 1; else right[y * width + x] = 1;
      }
    }
    const worstCase = {};
    for (const mm of [0.25, 0.5]) {
      const r = pixelRadiusFor(mm, DPI);
      const scanStarted = performance.now();
      const scan = pairChangeMaskScan({ a: left, b: right, width, height, radius: r });
      const scanMs = Math.round(performance.now() - scanStarted);
      const dilationStarted = performance.now();
      const dilation = pairChangeMask({ a: left, b: right, width, height, radius: r });
      const dilationMs = Math.round(performance.now() - dilationStarted);
      worstCase[`${mm}mm`] = {
        radius: r,
        box: (2 * r + 1) ** 2,
        scanMs,
        dilationMs,
        identical: scan.changePixels === dilation.changePixels,
        changePixels: dilation.changePixels,
      };
    }

    const radius = pixelRadiusFor(0.5, DPI);
    const full = runCancellable(pairChangeMaskSteps({ ...args, radius, band: 256 }));
    const stopped = runCancellable(
      pairChangeMaskSteps({ ...args, radius, band: 256 }),
      (_step, bands) => bands < 3,
    );
    return {
      width,
      height,
      pixels: width * height,
      inkFraction: masks[0].reduce((n, v) => n + v, 0) / (width * height),
      timings,
      worstCase,
      banded: {
        status: full.status,
        bands: full.bands,
        changePixels: full.result?.changePixels ?? null,
        matchesDilation: full.result?.changePixels
          === pairChangeMask({ ...args, radius }).changePixels,
      },
      cancelled: {
        status: stopped.status,
        bands: stopped.bands,
        // No partial verdict, by construction.
        result: stopped.result,
        stoppedEarly: stopped.bands < full.bands,
      },
    };
  },

  /**
   * The picture, painted from the masks alone.
   *
   * The memory model rests on this: if the composite is a function of the ink
   * masks and nothing else, then no member's RGBA has to survive the phase that
   * extracted its mask. Asserting it byte-for-byte against the production
   * compositor is what turns that from a design intention into a fact.
   */
  async compositeEquivalence() {
    const colours = [[0, 0, 1], [1, 0, 0], [0, 0.6, 0], [0.8, 0, 0.8]];
    const sets = {
      'two members, exact': {
        names: ['base-a4', 'added-line-a4'], radius: 0, matchOpacity: 1,
      },
      'two members, 0.5mm': {
        names: ['base-a4', 'added-line-a4'], radius: pixelRadiusFor(0.5, DPI), matchOpacity: 1,
      },
      'two members, faint match colour': {
        names: ['base-a4', 'added-line-a4'], radius: 0, matchOpacity: 0.25,
      },
      'four members, 0.25mm': {
        names: ['base-a4', 'identical-a4', 'wall-at-y-a4', 'added-line-a4'],
        radius: pixelRadiusFor(0.25, DPI), matchOpacity: 1,
      },
    };
    const out = {};
    for (const [label, spec] of Object.entries(sets)) {
      const members = [];
      for (let i = 0; i < spec.names.length; i++) {
        members.push(await member(spec.names[i], colours[i], `${spec.names[i]}#${i}`));
      }
      const rendered = await renderMembersUpright(members, SCALE);
      const { width, height } = rendered;
      const layers = rendered.buffers.map((b, i) => ({ data: b.data, color: colours[i] }));
      const production = computeMultiPdfComposite(
        layers, width, height, spec.radius, [0, 0, 0], spec.matchOpacity,
      );
      const masks = rendered.buffers.map((b) => inkMask(b.data, width, height));
      const dilated = masks.map((m) => dilateMask(m, width, height, spec.radius));
      const fromMasks = compositeFromMasks({
        masks, dilated, colors: colours.slice(0, masks.length),
        width, height, matchColor: [0, 0, 0], matchOpacity: spec.matchOpacity,
      });
      let differingBytes = 0;
      const produced = production.data;
      for (let i = 0; i < produced.length; i++) {
        if (produced[i] !== fromMasks[i]) differingBytes += 1;
      }
      out[label] = {
        width,
        height,
        members: masks.length,
        radius: spec.radius,
        matchOpacity: spec.matchOpacity,
        bytes: produced.length,
        differingBytes,
        identical: differingBytes === 0,
      };
    }
    return out;
  },

  /**
   * What the export actually costs to hold, measured rather than assumed.
   *
   * `toDataURL` returns a string, so the figure that matters is the length of
   * that string per pixel. The memory model carries an allowance; this is what
   * it is an allowance for.
   */
  async exportEncoding() {
    const rows = {};
    for (const [label, sheet, other, dpi] of [
      ['A4 150dpi, changed', 'base-a4', 'added-line-a4', 150],
      ['A4 300dpi, changed', 'base-a4', 'added-line-a4', 300],
      ['A4 150dpi, dense', 'dense-a', 'dense-b', 150],
      ['A3 150dpi, matched', 'base-a3', 'base-a3', 150],
    ]) {
      const members = [
        await member(sheet, BLUE, sheet), await member(other, RED, `${other}#1`),
      ];
      const rendered = await renderMembersUpright(members, dpi / 72);
      const { width, height } = rendered;
      const masks = rendered.buffers.map((b) => inkMask(b.data, width, height));
      const pixels = compositeFromMasks({
        masks, dilated: masks, colors: [BLUE, RED], width, height,
      });
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').putImageData(new ImageData(pixels, width, height), 0, 0);
      const jpeg = canvas.toDataURL('image/jpeg');
      const png = canvas.toDataURL('image/png');
      canvas.width = 1;
      canvas.height = 1;
      const area = width * height;
      rows[label] = {
        width,
        height,
        pixels: area,
        jpegBytes: jpeg.length,
        pngBytes: png.length,
        jpegBytesPerPixel: +(jpeg.length / area).toFixed(4),
        pngBytesPerPixel: +(png.length / area).toFixed(4),
      };
    }
    // The measurements above are **performance** evidence. The bound below is
    // the safety proof, and it is derived rather than measured: no image of
    // these dimensions can encode larger, whatever it contains.
    const bounds = {};
    for (const [label, r] of Object.entries(rows)) {
      const bound = encodedImageUpperBound({ width: r.width, height: r.height });
      bounds[label] = {
        upperBound: bound,
        upperBoundBytesPerPixel: +(bound / r.pixels).toFixed(3),
        measuredWorst: Math.max(r.jpegBytes, r.pngBytes),
        // As a data URL the same bytes cost base64 on top, twice over in a
        // two-byte string. This is why the recommendation is toBlob.
        dataUrlBound: Math.ceil(bound * 4 / 3) * EXPORT_STRATEGIES.dataUrl.bytesPerCharacter,
        measuredUnderBound: Math.max(r.jpegBytes, r.pngBytes) < bound,
      };
    }
    return {
      strategies: EXPORT_STRATEGIES,
      budgetedStrategy: BUDGETED_EXPORT_STRATEGY,
      rows,
      bounds,
      worstMeasured: Math.max(...Object.values(rows).flatMap(
        (r) => [r.jpegBytesPerPixel, r.pngBytesPerPixel],
      )),
      boundIsDerivedNotMeasured: true,
    };
  },

  /**
   * The spatial tolerance, at every resolution the Comparator actually offers.
   *
   * `PdfComparator.tsx` offers 72, 150, 300 and 450 DPI. A maximum justified on
   * two of those is not a maximum for the product: millimetres round to a whole
   * pixel radius, so the same setting is a different search at each one, and
   * the resolution where the smallest true change disappears first is the one
   * that has to set the ceiling.
   */
  async spatialToleranceAcrossDpi() {
    const uprightMasks = async (members, scale) => {
      const rendered = await renderMembersUpright(members, scale);
      const { width, height } = rendered;
      return {
        width,
        height,
        masks: rendered.buffers.map((b) => inkMask(b.data, width, height)),
      };
    };
    const sweep = [0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.4, 0.5];
    const changedPair = await pair('small-base', 'small-digit');
    const controlPair = await pair('small-base', 'small-base-copy');
    const symbolPair = await pair('small-base', 'small-symbol');

    const out = {
      supportedDpi: SPATIAL_TOLERANCE_POLICY.supportedDpi,
      sweep,
      rounding: {},
      changed: {},
      control: {},
      symbol: {},
      largestSafeMm: {},
      atDefault: {},
    };
    for (const dpi of SPATIAL_TOLERANCE_POLICY.supportedDpi) {
      const scale = dpi / 72;
      const changed = await uprightMasks(changedPair, scale);
      const control = await uprightMasks(controlPair, scale);
      const symbol = await uprightMasks(symbolPair, scale);
      out.rounding[dpi] = {};
      out.changed[dpi] = {};
      out.control[dpi] = {};
      out.symbol[dpi] = {};
      let largestSafe = null;
      for (const mm of sweep) {
        const radius = pixelRadiusFor(mm, dpi);
        out.rounding[dpi][`${mm}mm`] = radius;
        for (const [key, set] of [['changed', changed], ['control', control],
          ['symbol', symbol]]) {
          const m = pairChangeMask({
            a: set.masks[0], b: set.masks[1],
            width: set.width, height: set.height, radius,
          });
          out[key][dpi][`${mm}mm`] = {
            radius,
            changePixels: m.changePixels,
            verdict: canonicalVerdict(m).status,
          };
        }
        if (out.changed[dpi][`${mm}mm`].verdict === RESULT.CHANGE) largestSafe = mm;
      }
      // The largest setting at which the smallest measured true change is still
      // reported at this resolution. Only contiguous from zero counts: a
      // setting that works again above one that does not is not a safe range.
      let contiguous = null;
      for (const mm of sweep) {
        if (out.changed[dpi][`${mm}mm`].verdict !== RESULT.CHANGE) break;
        contiguous = mm;
      }
      out.largestSafeMm[dpi] = { contiguous, anywhere: largestSafe };
      out.atDefault[dpi] = {
        millimetres: SPATIAL_TOLERANCE_POLICY.default,
        radius: pixelRadiusFor(SPATIAL_TOLERANCE_POLICY.default, dpi),
        changed: out.changed[dpi][`${SPATIAL_TOLERANCE_POLICY.default}mm`].verdict,
        control: out.control[dpi][`${SPATIAL_TOLERANCE_POLICY.default}mm`].verdict,
        width: changed.width,
        height: changed.height,
      };
    }
    const safe = Object.values(out.largestSafeMm).map((r) => r.contiguous);
    out.minimumSafeAcrossDpi = safe.every((v) => v === null)
      ? null : Math.min(...safe.map((v) => (v === null ? 0 : v)));
    out.policyMaximum = SPATIAL_TOLERANCE_POLICY.maximum;
    out.policyMaximumIsSafeEverywhere = Object.entries(out.changed).every(
      ([, rows]) => Object.entries(rows)
        .filter(([mm]) => parseFloat(mm) <= SPATIAL_TOLERANCE_POLICY.maximum)
        .every(([, r]) => r.verdict === RESULT.CHANGE),
    );
    return out;
  },

  /**
   * What the whole operation costs, not what one page costs.
   *
   * Memory is a peak and pages are serial, so the page-level model is right for
   * it. Work accumulates: an export of a range runs every page, and a ceiling
   * checked per page would pass a job that is a hundred times over it.
   */
  jobWork() {
    const A4 = [2480, 3507];
    const A1 = [7016, 9933];
    const page = (label, [width, height], members, radiusPx, extra = {}) => ({
      label, width, height, members,
      contract: MULTI_MEMBER.REFERENCE_PAIRS, radiusPx, ...extra,
    });
    const repeat = (n, make) => Array.from({ length: n }, (_, i) => make(i + 1));
    const jobs = {
      'one page, below the ceiling': [page('page 1', A4, 2, 6)],
      'three pages, total below': repeat(3, (n) => page(`page ${n}`, A4, 2, 6)),
      'five pages, each below, the total above':
        repeat(5, (n) => page(`page ${n}`, A4, 2, 6)),
      'one page over on its own': [page('page 1', A1, 2, 6)],
      'reference-pairs over three pages':
        repeat(3, (n) => page(`page ${n}`, A4, 4, 1)),
      'a page that cannot be compared is still in the plan': [
        page('page 1', A4, 2, 6),
        page('page 2', A4, 2, 6, { comparable: false, reason: 'MISSING_PAGE' }),
        page('page 3', A4, 2, 6, { comparable: false, reason: 'RENDER_FAILED' }),
      ],
      'an export range costs only the pages asked for':
        repeat(2, (n) => page(`page ${n + 2}`, A4, 2, 6)),
      'arithmetic outside the safe-integer range': [
        page('page 1', [2000000, 2000000], 4, 5000),
      ],
    };
    const out = {};
    for (const [label, pages] of Object.entries(jobs)) {
      const job = estimateJobWork({ pages });
      out[label] = {
        requestedPages: pages.length,
        comparablePages: job.comparablePages,
        skipped: job.skippedPages.map((p) => `${p.label}: ${p.reason}`),
        perPageUnits: job.pages.map((p) => p.units),
        jobWorkUnits: job.jobWorkUnits,
        representable: job.representable,
        withinBudget: job.withinBudget,
        refusal: job.refusal,
        everyPageWithinPageCeiling: job.pages
          .filter((p) => p.comparable)
          .every((p) => p.withinPageCeiling === true),
      };
    }
    return { limit: MAX_COMPARISON_WORK_UNITS, jobs: out };
  },

  /**
   * The working set of the architecture that was actually selected.
   *
   * The shipped model counts layer canvases, normalised copies, a normalising
   * canvas, a composite and an encoder, because that is what the shipped
   * pipeline holds. The proposed pipeline holds masks, and the phase that peaks
   * is not the one that used to.
   */
  phaseBudget() {
    const rows = [
      ['A4 300dpi, 2 members, 0mm', 2480, 3507, 2, 0],
      ['A4 300dpi, 2 members, 0.5mm', 2480, 3507, 2, 6],
      ['A3 300dpi, 2 members, 0.5mm', 3508, 4961, 2, 6],
      ['A2 300dpi, 2 members, 0.5mm', 4961, 7016, 2, 6],
      ['A1 300dpi, 2 members, 0.5mm', 7016, 9933, 2, 6],
      ['A1 300dpi, 4 members, 0.5mm', 7016, 9933, 4, 6],
      ['A0 600dpi, 2 members, 0.5mm', 19866, 28087, 2, 12],
    ];
    const cases = {};
    for (const [label, width, height, members, radiusPx] of rows) {
      const checked = checkPhaseBudget({
        width, height, members, contract: MULTI_MEMBER.REFERENCE_PAIRS, radiusPx,
      });
      cases[label] = {
        pixels: checked.pixels,
        members: checked.members,
        radiusPx: checked.radiusPx,
        phaseTotals: Object.fromEntries(
          Object.entries(checked.phases).map(([k, v]) => [k, v.total]),
        ),
        peakPhase: checked.peakPhase,
        peakWorkingSet: checked.peakWorkingSet,
        peakMB: +(checked.peakWorkingSet / 1e6).toFixed(0),
        bytesPerPixel: +checked.bytesPerPixel.toFixed(2),
        withinBudget: checked.withinBudget,
        refusal: checked.refusal,
        memberProcessing: checked.memberProcessing,
        pairProcessing: checked.pairProcessing,
        referenceMaskReused: checked.referenceMaskReused,
        exportStrategy: checked.exportStrategy,
        encodedOutputIsUpperBound: checked.encodedOutputIsUpperBound,
        presentationLive: checked.phases.presentation.live,
      };
    }
    // The same sheet under the shipped model, which is what the previous
    // round's "within 512 MiB" claim was resting on.
    const shipped = checkBudget({ width: 3508, height: 4961, layers: 2 });
    return {
      limit: MAX_COMPARISON_BYTES,
      limitMB: +(MAX_COMPARISON_BYTES / 1e6).toFixed(1),
      cases,
      shippedModelA3: {
        totalMB: +(shipped.total / 1e6).toFixed(1),
        withinBudget: shipped.withinBudget,
      },
      byStrategy: Object.fromEntries(Object.keys(EXPORT_STRATEGIES).map((strategy) => [
        strategy,
        +(estimatePhaseMemory({
          width: 3508, height: 4961, members: 2, radiusPx: 6, exportStrategy: strategy,
        }).peakWorkingSet / 1e6).toFixed(1),
      ])),
      a3Detail: estimatePhaseMemory({
        width: 3508, height: 4961, members: 2, radiusPx: 6,
      }),
    };
  },

  /**
   * A cancellation that arrives while the comparison is running.
   *
   * The banded structure proves a decision point exists. It does not prove
   * anything can reach it. Both drivers are given the *same* cancellation,
   * scheduled from a timer while the comparison runs: the synchronous one never
   * returns to the event loop, so the timer cannot fire and the comparison
   * finishes and publishes; the asynchronous one yields between bands, so the
   * timer fires and the comparison stops with nothing to publish.
   */
  async asyncCancellation() {
    const pages = await pair('dense-a', 'dense-b');
    const rendered = await renderMembersUpright(pages, SCALE);
    const { width, height } = rendered;
    const masks = rendered.buffers.map((b) => inkMask(b.data, width, height));
    const radius = pixelRadiusFor(0.5, DPI);
    const band = 512;
    const args = { a: masks[0], b: masks[1], width, height, radius, band };
    const expected = pairChangeMask({ a: masks[0], b: masks[1], width, height, radius });

    // The control: uncancelled, asynchronous, and still the right answer.
    const completed = await runCancellableAsync(pairChangeMaskSteps({ ...args }));

    // A synchronous driver, given a cancellation it cannot see.
    let syncCancelRequested = false;
    const syncTimer = setTimeout(() => { syncCancelRequested = true; }, 0);
    const syncStarted = performance.now();
    const syncRun = runCancellable(
      pairChangeMaskSteps({ ...args }), () => !syncCancelRequested,
    );
    const syncMs = Math.round(performance.now() - syncStarted);
    clearTimeout(syncTimer);

    // The same cancellation, against a driver that yields between bands.
    let asyncCancelRequested = false;
    const asyncStarted = performance.now();
    setTimeout(() => { asyncCancelRequested = true; }, 20);
    const asyncRun = await runCancellableAsync(pairChangeMaskSteps({ ...args }), {
      shouldContinue: () => !asyncCancelRequested,
    });
    const asyncMs = Math.round(performance.now() - asyncStarted);

    // Ownership: superseded by a newer run rather than cancelled by a user.
    let generation = 1;
    setTimeout(() => { generation = 2; }, 20);
    const supersededRun = await runCancellableAsync(pairChangeMaskSteps({ ...args }), {
      owner: { token: 1, current: () => generation },
    });

    return {
      width,
      height,
      radius,
      band,
      expectedChangePixels: expected.changePixels,
      completed: {
        status: completed.status,
        bands: completed.bands,
        publishable: completed.publishable,
        changePixels: completed.result?.changePixels ?? null,
        matchesDirect: completed.result?.changePixels === expected.changePixels,
      },
      synchronousDriver: {
        status: syncRun.status,
        bands: syncRun.bands,
        ms: syncMs,
        // The timer was due long before this returned, and never ran.
        cancellationObserved: syncRun.status === PLAN.CANCELLED,
        cancellationFlagAtEnd: syncCancelRequested,
        produced: syncRun.result !== null,
      },
      asynchronousDriver: {
        status: asyncRun.status,
        bands: asyncRun.bands,
        ms: asyncMs,
        reason: asyncRun.reason,
        cancellationObserved: asyncRun.status === PLAN.CANCELLED,
        publishable: asyncRun.publishable,
        result: asyncRun.result,
        stoppedEarly: asyncRun.bands < completed.bands,
      },
      supersededByOwnership: {
        status: supersededRun.status,
        bands: supersededRun.bands,
        reason: supersededRun.reason,
        publishable: supersededRun.publishable,
        result: supersededRun.result,
      },
    };
  },

  PLAN,
  RESULT,
};

document.getElementById('state').textContent = 'ready';
window.__m4ready = true;
</script>
