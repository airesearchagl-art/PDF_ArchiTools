<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Title-block updater smoke harness</title>
<style>body { font: 13px/1.5 system-ui, sans-serif; margin: 16px; }</style>
</head>
<body>
<h1>Title-block updater smoke harness</h1>
<p>Driven by <code>scripts/smoke-title-block-updater.mjs</code>. Not part of the app.</p>
<div id="log">idle</div>

<script type="module">
import * as pdfjsLib from 'pdfjs-dist';
import { PDFDocument } from 'pdf-lib';
import { updateTitleBlocks, displayedSize, orientationOf } from '/src/utils/title-block-updater.ts';
import { classifyDocument } from '/src/utils/pdf-textifier/classify.ts';
import { configurePdfWorker, PDF_WORKER_URL } from '/src/utils/pdf-worker-source.ts';

// The worker that ships in public/, never a CDN: this must work with no network.
configurePdfWorker();

const log = (m) => { document.getElementById('log').textContent = m; };

/** Longest edge of the raster used for the pixel comparisons. */
const MAX_PX = 1400;
/** Antialiasing slack when deciding whether a pixel is inside a rule region. */
const EDGE_SLACK_PX = 2;

const OPS = pdfjsLib.OPS;
const IMAGE_OPS = ['paintImageXObject', 'paintInlineImageXObject', 'paintJpegXObject', 'paintImageMaskXObject']
    .map((n) => OPS[n]).filter((op) => op !== undefined);

const copyOf = (input) => (input instanceof Uint8Array ? input : new Uint8Array(input)).slice();

async function rasterise(page) {
    const base = page.getViewport({ scale: 1 });
    const scale = MAX_PX / Math.max(base.width, base.height);
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvas, viewport }).promise;
    return { canvas, data: ctx.getImageData(0, 0, canvas.width, canvas.height).data };
}

/** Everything measurable about a document, read back through PDF.js. */
async function measure(input) {
    const bytes = copyOf(input);
    const doc = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
    const pages = [];
    for (let i = 1; i <= doc.numPages; i++) {
        const page = await doc.getPage(i);
        const viewport = page.getViewport({ scale: 1 });
        const text = (await page.getTextContent()).items.map((it) => it.str ?? '').join('');
        const list = await page.getOperatorList();
        let pathOps = 0, imageOps = 0, textOps = 0;
        for (const fn of list.fnArray) {
            if (fn === OPS.constructPath) pathOps++;
            else if (IMAGE_OPS.includes(fn)) imageOps++;
            else if (fn === OPS.showText) textOps++;
        }
        pages.push({
            pageNumber: i,
            widthPt: viewport.width,
            heightPt: viewport.height,
            rotate: page.rotate,
            text,
            pathOps,
            imageOps,
            textOps,
        });
    }
    const lib = await PDFDocument.load(bytes.slice());
    lib.getPages().forEach((p, idx) => {
        const media = p.getMediaBox();
        pages[idx].mediaBox = { width: media.width, height: media.height };
        const shown = displayedSize(p);
        pages[idx].orientation = orientationOf(shown.width, shown.height);
    });
    return { numPages: doc.numPages, pages };
}

/**
 * Compare one page before and after, splitting the differing pixels by whether
 * they fall inside a rule rectangle.
 *
 * "outside === 0" is the whole promise of the feature: only the selected
 * regions may change, and the frame lines just beyond them have to survive.
 */
async function pixelDiff(beforeBytes, afterBytes, pageNo, rules) {
    const a = await pdfjsLib.getDocument({ data: copyOf(beforeBytes) }).promise;
    const b = await pdfjsLib.getDocument({ data: copyOf(afterBytes) }).promise;
    const ra = await rasterise(await a.getPage(pageNo));
    const rb = await rasterise(await b.getPage(pageNo));
    if (ra.canvas.width !== rb.canvas.width || ra.canvas.height !== rb.canvas.height) {
        return { sizeChanged: true, inside: 0, outside: 0 };
    }
    const w = ra.canvas.width;
    const h = ra.canvas.height;
    const boxes = rules.map((r) => ({
        x0: r.rect.x * w - EDGE_SLACK_PX,
        y0: r.rect.y * h - EDGE_SLACK_PX,
        x1: (r.rect.x + r.rect.width) * w + EDGE_SLACK_PX,
        y1: (r.rect.y + r.rect.height) * h + EDGE_SLACK_PX,
    }));
    let inside = 0;
    let outside = 0;
    const outsideSamples = [];
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            if (ra.data[i] === rb.data[i] && ra.data[i + 1] === rb.data[i + 1] && ra.data[i + 2] === rb.data[i + 2]) continue;
            if (boxes.some((box) => x >= box.x0 && x <= box.x1 && y >= box.y0 && y <= box.y1)) inside++;
            else {
                outside++;
                if (outsideSamples.length < 5) outsideSamples.push([x, y]);
            }
        }
    }
    return { sizeChanged: false, inside, outside, outsideSamples, canvas: [w, h] };
}

const fetchFixture = (name) => fetch(`/test-fixtures/${name}`).then((r) => {
    if (!r.ok) throw new Error(`fixture ${name}: HTTP ${r.status}`);
    return r.arrayBuffer();
});

window.__tbSmoke = {
    async run(name, rules, templateOrientation, diffPages = [1]) {
        log(`running ${name}`);
        const input = await fetchFixture(name);
        const before = await measure(input.slice(0));
        const result = await updateTitleBlocks(input.slice(0), { rules, templateOrientation });
        const after = await measure(result.data);
        const diffs = [];
        for (const p of diffPages) {
            diffs.push({ page: p, ...(await pixelDiff(input.slice(0), result.data, p, rules)) });
        }
        log(`done ${name}`);
        return {
            name,
            summary: result.summary,
            inputBytes: input.byteLength,
            outputBytes: result.data.length,
            before,
            after,
            diffs,
        };
    },

    /**
     * Render page 1 of two fixtures and count every differing pixel.
     *
     * Used to hold a rotated page against a flat one that is drawn to look the
     * same: agreement before AND after the update is what proves the rotation
     * maths puts the region where the user actually drew it.
     */
    async crossCompare(nameA, nameB, rules, templateOrientation) {
        const inputA = await fetchFixture(nameA);
        const inputB = await fetchFixture(nameB);
        const outA = (await updateTitleBlocks(inputA.slice(0), { rules, templateOrientation })).data;
        const outB = (await updateTitleBlocks(inputB.slice(0), { rules, templateOrientation })).data;

        const renderOf = async (bytes) => {
            const doc = await pdfjsLib.getDocument({ data: copyOf(bytes) }).promise;
            return await rasterise(await doc.getPage(1));
        };
        const countDiff = async (x, y) => {
            const ra = await renderOf(x);
            const rb = await renderOf(y);
            if (ra.canvas.width !== rb.canvas.width || ra.canvas.height !== rb.canvas.height) {
                return { sizeMismatch: true, diff: -1, total: 0 };
            }
            let diff = 0;
            for (let i = 0; i < ra.data.length; i += 4) {
                if (ra.data[i] !== rb.data[i] || ra.data[i + 1] !== rb.data[i + 1] || ra.data[i + 2] !== rb.data[i + 2]) diff++;
            }
            return { sizeMismatch: false, diff, total: ra.data.length / 4, canvas: [ra.canvas.width, ra.canvas.height] };
        };
        return {
            before: await countDiff(inputA.slice(0), inputB.slice(0)),
            after: await countDiff(outA, outB),
        };
    },

    /** The M1 gate: does the updated document still read as text-native? */
    async classify(name, rules, templateOrientation) {
        const input = await fetchFixture(name);
        const inDoc = await pdfjsLib.getDocument({ data: copyOf(input.slice(0)) }).promise;
        const beforeClass = await classifyDocument(inDoc);
        const result = await updateTitleBlocks(input.slice(0), { rules, templateOrientation });
        const outDoc = await pdfjsLib.getDocument({ data: copyOf(result.data) }).promise;
        const afterClass = await classifyDocument(outDoc);
        return { before: beforeClass, after: afterClass };
    },

    /**
     * Another module in this app assigns the PDF.js worker global to unpkg at
     * import time. Prove that the point-of-use call takes it back, which is the
     * only reason S2's worker request stays same-origin regardless of import
     * order.
     */
    workerProbe() {
        const before = pdfjsLib.GlobalWorkerOptions.workerSrc;
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@5.4.449/build/pdf.worker.min.mjs';
        const hijacked = pdfjsLib.GlobalWorkerOptions.workerSrc;
        configurePdfWorker();
        const restored = pdfjsLib.GlobalWorkerOptions.workerSrc;
        return { before, hijacked, restored, expected: PDF_WORKER_URL };
    },

    /** Fail-closed check: the call must reject rather than misplace anything. */
    async errorProbe(name, rules, templateOrientation) {
        const input = await fetchFixture(name);
        try {
            await updateTitleBlocks(input.slice(0), { rules, templateOrientation });
            return { threw: false, code: null, message: null };
        } catch (error) {
            return { threw: true, code: error?.code ?? null, message: String(error?.message ?? error) };
        }
    },

    ready: true,
};
log('ready');
</script>
</body>
</html>
